<text x="54" y="156.00" font-size="12" text-anchor="end" fill="#8b949e">300</text>
<text x="20" y="144.00" font-size="11" fill="#8b949e">MB</text>
<text x="64.00" y="494.00" font-size="12" text-anchor="start" fill="#8b949e">0s</text>
<text x="790.00" y="494.00" font-size="12" text-anchor="end" fill="#8b949e">10s</text>
