<text x="54" y="386.33" font-size="12" text-anchor="end" fill="#8b949e">100</text>
<line x1="64" y1="329.00" x2="790" y2="329.00" stroke="#30363d" stroke-width="1"/>
<text x="54" y="333.00" font-size="12" text-anchor="end" fill="#8b949e">150</text>
