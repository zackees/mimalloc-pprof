<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="At the first idle tick mimalloc-pprof returns 74% of peak RSS, Bun's mimalloc 74%, jemalloc 0% by default">
<rect width="1000" height="520" fill="#0d1117"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<text x="64" y="26" font-size="17" font-weight="600" fill="#e6edf3">At the first idle tick mimalloc-pprof returns 74% of peak RSS, Bun's mimalloc 74%, jemalloc 0% by default</text>
<text x="64" y="44" font-size="12" fill="#8b949e">measured at 37b77e2b, AMD Ryzen 7 3700X 8-Core Processor, 6.18.48, taskset -c 0-3, best of 3 runs</text>
<text x="64" y="61" font-size="12" fill="#8b949e">300k blocks in three small size classes, a scattered 1-in-20 kept alive, the rest freed, then a 10 s idle window.</text>
<text x="64" y="78" font-size="12" fill="#8b949e">The mimalloc forks call mi_on_thread_idle() every 100 ms, punching holes in still-used pages; upstream has no such API (0%).</text>
<text x="64" y="95" font-size="12" fill="#8b949e">jemalloc's decay is advanced by allocation, not by idling: nothing on its own, 74% via an explicit mallctl("arena.&lt;all&gt;.purge") (dashed).</text>
<text x="64" y="112" font-size="12" fill="#8b949e">Its opt-in background_thread:true does return it -- 73% over this same window, with nothing called. See the diagnostics in the table.</text>
<line x1="64" y1="472.00" x2="790" y2="472.00" stroke="#30363d" stroke-width="1"/>
<text x="54" y="476.00" font-size="12" text-anchor="end" fill="#8b949e">0</text>
<line x1="64" y1="418.67" x2="790" y2="418.67" stroke="#30363d" stroke-width="1"/>
<text x="54" y="422.67" font-size="12" text-anchor="end" fill="#8b949e">50</text>
<line x1="64" y1="365.33" x2="790" y2="365.33" stroke="#30363d" stroke-width="1"/>
<text x="54" y="369.33" font-size="12" text-anchor="end" fill="#8b949e">100</text>
<line x1="64" y1="312.00" x2="790" y2="312.00" stroke="#30363d" stroke-width="1"/>
<text x="54" y="316.00" font-size="12" text-anchor="end" fill="#8b949e">150</text>
<line x1="64" y1="258.67" x2="790" y2="258.67" stroke="#30363d" stroke-width="1"/>
<text x="54" y="262.67" font-size="12" text-anchor="end" fill="#8b949e">200</text>
<line x1="64" y1="205.33" x2="790" y2="205.33" stroke="#30363d" stroke-width="1"/>
<text x="54" y="209.33" font-size="12" text-anchor="end" fill="#8b949e">250</text>
