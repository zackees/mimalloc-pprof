<text x="620" y="264" font-size="12" text-anchor="end" fill="#1f2328">0</text>
<text x="780" y="264" font-size="12" text-anchor="end" fill="#1f2328">94,208</text>
<text x="940" y="264" font-size="12" text-anchor="end" fill="#59636e">+94,208</text>
<rect x="16" y="272" width="968" height="26" fill="#d8dee4" opacity="0.25"/>
