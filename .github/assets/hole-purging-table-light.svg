<text x="620" y="186" font-size="12" text-anchor="end" fill="#1f2328">0</text>
<text x="780" y="186" font-size="12" text-anchor="end" fill="#1f2328">0</text>
<text x="940" y="186" font-size="12" text-anchor="end" fill="#59636e">0</text>
<text x="24" y="212" font-size="12" fill="#1f2328">pages ineligible for discard (last sweep)</text>
<text x="620" y="212" font-size="12" text-anchor="end" fill="#1f2328">0</text>
<text x="780" y="212" font-size="12" text-anchor="end" fill="#1f2328">0</text>
<text x="940" y="212" font-size="12" text-anchor="end" fill="#59636e">0</text>
<rect x="16" y="220" width="968" height="26" fill="#d8dee4" opacity="0.25"/>
