<text x="780" y="316" font-size="12" text-anchor="end" fill="#1f2328">350,361</text>
<text x="940" y="316" font-size="12" text-anchor="end" fill="#59636e">+350,361</text>
<rect x="16" y="324" width="968" height="26" fill="#d8dee4" opacity="0.25"/>
