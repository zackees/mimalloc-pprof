<text x="620" y="342" font-size="12" text-anchor="end" fill="#1f2328">0</text>
<text x="780" y="342" font-size="12" text-anchor="end" fill="#1f2328">320,766</text>
<text x="940" y="342" font-size="12" text-anchor="end" fill="#59636e">+320,766</text>
