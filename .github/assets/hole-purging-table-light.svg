<text x="780" y="160" font-size="12" text-anchor="end" fill="#1f2328">165,052,416</text>
<text x="940" y="160" font-size="12" text-anchor="end" fill="#59636e">+165,052,416</text>
<rect x="16" y="168" width="968" height="26" fill="#d8dee4" opacity="0.25"/>
