<text x="620" y="290" font-size="12" text-anchor="end" fill="#1f2328">0</text>
<text x="780" y="290" font-size="12" text-anchor="end" fill="#1f2328">2</text>
<text x="940" y="290" font-size="12" text-anchor="end" fill="#59636e">+2</text>
