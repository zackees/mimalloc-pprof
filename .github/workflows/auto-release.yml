name: auto-release

# Cuts a release of the mimalloc-pprof C amalgamation + crates.io publish, plus the
# cross-built binary assets (#277 phase E).
#
# WHO BUILDS THE SHIPPED BINARIES -- the decision, and why it is not the one #277's
# phase table first wrote down:
#
#   Every binary release asset is CROSS-BUILT ON LINUX through soldr. Not one of them is
#   produced by the platform's own toolchain on that platform's own runner.
#
# #277 row E originally said "shipped release assets stay built by the platform's own
# toolchain". Two owner decisions since then overrode it:
#
#   1. Native Mac runners are used for opt-in full test execution, not to build
#      shipped assets. The Linux cross-built bytes remain the product under test.
#   2. Cross-compilation is a PRODUCT requirement, not a CI cost measure: mimalloc-pprof
#      ships inside cross-compiled code, so the Linux-cross-built artifact IS the product.
#      Shipping a natively-built binary while testing a cross-built one would mean the
#      thing under test and the thing shipped are different binaries.
#
# The release build uses the same cross toolchains as the full CI bundles, but a distinct
# product configuration. Its own test bundle is built in the same tree as the installed
# libraries; native release jobs compare the bytes and execute that bundle.
#
# What that costs, stated rather than hidden:
#   - macOS assets are built by soldr's clang 21 against soldr's Apple SDK, NOT by Xcode's
#     clang against Xcode's SDK (docs/ci-gates.md, "macOS").
#   - The `windows-x64-msvc` asset is MSVC-ABI, but built by clang-cl + lld-link with the
#     CRT pinned to /MD -- it is not a `cl` binary. c-unit.yml keeps one native `cl`
#     Release ctest job as the correctness gate for `cl` (CLAUDE.md rule 3); that job ships
#     nothing, and never did. There has never been a natively-built release asset here to
#     "retain".
#   - The `windows-x64-gnu` asset is mingw-w64 gcc 15 UCRT. `mimalloc.dll` imports
#     `libgcc_s_seh-1.dll` (for `__popcountdi2`), which a plain Windows machine does not
#     have, so the archive SHIPS that DLL beside it and the job asserts the whole import
#     closure resolves. Shipping it (rather than relinking `-static-libgcc`) keeps the
#     shipped binary byte-identical to the one `windows-bundles.yml` tests.
#   - The `windows-x64-msvc` asset imports VCRUNTIME140.dll/MSVCP140.dll: the Visual C++
#     redistributable, which is not part of Windows. Recorded in the archive's
#     PROVENANCE.txt rather than silently assumed.
#
# Trigger design (see rust/mimalloc-pprof/vendor/README.md for what gets shipped):
#   - workflow_dispatch: manual, explicit human/agent decision. Default `dry_run: true`
#     so this can be exercised safely (build + package + `cargo publish --dry-run`)
#     without creating a tag or GitHub Release.
#   - A real manual run requires a successful full macOS run on this exact candidate SHA.
#     A tag push cannot start publication.
#
# A real run freezes the issue identity before any tag, crate, or release write.
# One worker transfers the crate and GitHub assets concurrently, then verifies
# every destination before it publishes the GitHub draft.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Release attempt issue carrying the immutable directive"
        required: true
        type: number
      dry_run:
        description: "Dry run: build, package, and cargo publish --dry-run only; create no tag or release"
        required: false
        type: boolean
        default: true
      candidate_sha:
        description: "Exact merged candidate commit SHA"
        required: true
        type: string
      full_run_id:
        description: "Successful macos-bundles full run ID at candidate_sha (required for a real release)"
        required: false
        type: string
      c_unit_run_id:
        description: "Full c-unit run ID at candidate_sha"
        required: false
        type: string
      windows_bundles_run_id:
        description: "Full windows-bundles run ID at candidate_sha"
        required: false
        type: string
      cross_run_id:
        description: "Full cross run ID at candidate_sha"
        required: false
        type: string
      rust_native_run_id:
        description: "Full rust-native run ID at candidate_sha"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a real publish mid-flight

permissions:
  contents: write

env:
  IS_DRY_RUN: ${{ inputs.dry_run }}

jobs:
  validate-attempt:
    name: Validate issue directive and exact candidate SHA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Refuse unrecorded or conflicting release attempt
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 ci/release.py worker-check --issue "$ISSUE_NUMBER" --candidate-sha "$CANDIDATE_SHA"

  build-and-package:
    name: Build, validate, package (ubuntu-latest)
    # One row, not a matrix. #277's review addendum, item 5: everything this job does --
    # `xtask check`, `cargo test`, `cargo publish --dry-run`, and packaging a vendored C
    # amalgamation that is architecture-independent -- is platform-independent, so the
    # `windows-latest` row it used to carry was a second Windows queue slot per release
    # that verified nothing the ubuntu row does not. The binaries are built by
    # `build-binaries` below, on Linux, for every shipped platform.
    runs-on: ubuntu-latest
    needs: [validate-attempt]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Verify package checkout is the release candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] && test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || { echo '::error::package checkout differs from candidate_sha'; exit 1; }

      # Retried on purpose: this action has failed with a transient `write EPIPE`
      # during cache restore (issue #55), which skipped the publish job and turned a
      # tagged release into a silent no-op. A `uses:` step cannot be wrapped by a
      # retry action, so attempt it twice explicitly.
      - uses: zackees/setup-soldr@f63d8987580fd50667d95b19130e82d9691ddd75 # merged #518 audit recovery
        id: setup_soldr
        continue-on-error: true
        with:
          version: v0.9.11  # pinned: v0.9.12 archive lacks the binary (zackees/soldr#3091)
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
          build-cache-mode: full

      - name: Retry toolchain setup (first attempt failed)
        if: steps.setup_soldr.outcome == 'failure'
        uses: zackees/setup-soldr@f63d8987580fd50667d95b19130e82d9691ddd75
        with:
          version: v0.9.11  # pinned: v0.9.12 archive lacks the binary (zackees/soldr#3091)
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
          build-cache-mode: full

      - name: xtask check (vendored C amalgamation must match src/include/)
        run: soldr cargo run -p xtask -- check

      - run: soldr cargo test --locked

      - name: cargo publish --dry-run (mimalloc-pprof)
        run: soldr cargo publish --dry-run -p mimalloc-pprof --locked

      - name: Package and size-check the exact crate for the release worker
        run: |
          set -euo pipefail
          soldr cargo package -p mimalloc-pprof --locked
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("mimalloc-pprof/Cargo.toml", "rb"))["package"]["version"])')
          crate="target/package/mimalloc-pprof-${version}.crate"
          test -f "$crate" && test "$(stat -c %s "$crate")" -le 10000000
          mkdir -p dist/crate
          cp "$crate" dist/crate/

      - name: Upload exact packaged crate
        uses: actions/upload-artifact@v4
        with:
          name: release-crate-${{ inputs.candidate_sha }}
          path: rust/dist/crate/*.crate
          if-no-files-found: error

      - name: Package release ZIP (vendor/ files only)
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/mimalloc-pprof-c"
          mkdir -p "$stage"
          cp mimalloc-pprof/vendor/mimalloc-pprof-amalgamated.c "$stage/"
          cp mimalloc-pprof/vendor/mimalloc-pprof-amalgamated.h "$stage/"
          cp mimalloc-pprof/vendor/mimalloc.h "$stage/"
          cp mimalloc-pprof/vendor/mimalloc-stats.h "$stage/"
          cp mimalloc-pprof/vendor/README.md "$stage/"
          (cd "$stage" && zip -r "$RUNNER_TEMP/mimalloc-pprof-c.zip" .)
          mkdir -p dist
          cp "$RUNNER_TEMP/mimalloc-pprof-c.zip" dist/

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimalloc-pprof-c-zip
          path: rust/dist/mimalloc-pprof-c.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------------
  # The shipped binaries. Four lanes, all on Linux, all through soldr -- see this file's
  # header for why none of them runs on the platform it targets, and docs/ci-gates.md
  # ("Release assets are cross-built") for the same decision written out at length.
  #
  # These use the same toolchain files and `soldr prepare` targets as full CI. The
  # product flags differ (notably MI_DHAT=OFF), so release-local native tests below
  # execute a bundle built alongside the installed library bytes.
  build-binaries:
    name: Cross-build release binaries (${{ matrix.asset }})
    runs-on: ubuntu-latest
    needs: [validate-attempt]
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: macos-arm64
            triple: aarch64-apple-darwin
            archive: tar.gz
          - asset: macos-x86_64
            triple: x86_64-apple-darwin
            archive: tar.gz
          - asset: windows-x64-gnu
            triple: x86_64-pc-windows-gnu
            archive: zip
          - asset: windows-x64-msvc
            triple: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Verify binary checkout is the release candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] && test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || { echo '::error::binary checkout differs from candidate_sha'; exit 1; }
      - uses: astral-sh/setup-uv@v3
      - uses: zackees/setup-soldr@f63d8987580fd50667d95b19130e82d9691ddd75
        with:
          version: v0.9.11  # pinned: v0.9.12 archive lacks the binary (zackees/soldr#3091)
          # This job drives CMake directly; there is no `soldr cargo` for zccache to wrap.
          cache: false
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
      - name: Cache the prepared ${{ matrix.triple }} toolchain
        uses: actions/cache@v4
        with:
          # Deliberately the same path and key macos-bundles.yml / windows-bundles.yml use,
          # so a release run hits the cache those workflows already warmed on this commit.
          path: ~/soldr-${{ matrix.triple }}.tar.zst
          key: soldr-prepare-${{ matrix.triple }}-${{ hashFiles('rust/rust-toolchain.toml') }}
      - name: Prepare the soldr ${{ matrix.triple }} toolchain
        # `soldr prepare` resolves rustc from a rust-toolchain.toml at or above the working
        # directory, which is why this runs in rust/.
        working-directory: rust
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          archive="$HOME/soldr-$TRIPLE.tar.zst"
          args=(--target "$TRIPLE" --github-env "$GITHUB_ENV" --save "$archive")
          if [ -f "$archive" ]; then
            args=(--restore "$archive" "${args[@]}")
          fi
          soldr prepare "${args[@]}"
      - name: Configure, build and install
        # Build test executables in the very same tree as the installed product libraries.
        # The product keeps DHAT disabled; full CI's DHAT-enabled bundles are separate.
        # The install rules carry this fork's own headers (include/mimalloc/profile.h and
        # memory-events.h) as well as upstream's, plus the pkg-config and CMake package
        # files and, on Windows, mimalloc-redirect.dll -- verified on all four lanes.
        run: |
          set -euo pipefail
          # #414: every observability subsystem became opt-in, so the shipped release
          # asset names the ones it has always carried (pprof, memory-events and the
          # heap snapshot / live-heap dump) rather than inheriting them from a default.
          # DHAT and the owner gate stay out, exactly as before.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON -DMI_MEMEVT=ON -DMI_DIAGNOSTICS=ON -DMI_DHAT=OFF -DMI_BUILD_TESTS=ON \
            --toolchain cmake/toolchains/soldr-${{ matrix.triple }}.cmake \
            --log-level=VERBOSE 2>&1 | tee configure.log
          # Assert on the RESOLVED library list, not on the option that was passed in --
          # the MI_GUARDED lesson from docs/ci-gates.md. On Darwin this is load-bearing:
          # without the toolchain file's find-root confinement, CMakeLists.txt's
          # find_link_library() hands the host's ELF librt.so to a Mach-O link.
          case "${{ matrix.triple }}" in
            *-apple-darwin) want='pthread' ;;
            *)              want='psapi;shell32;user32;advapi32;bcrypt' ;;
          esac
          if ! grep -qE "^-- Link libraries *: *${want}\$" configure.log; then
            echo "::error::the ${{ matrix.triple }} link resolved unexpected libraries; expected exactly '${want}'"
            grep -E 'Link libraries' configure.log || true
            exit 1
          fi
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/stage"
      - name: Bundle release-tree tests
        run: |
          set -euo pipefail
          case '${{ matrix.triple }}' in
            x86_64-pc-windows-gnu)
              uv run ci/bundle_tests.py build release-test-bundle \
                --objdump "$MINGW_W64_CROSS_BIN/x86_64-w64-mingw32-objdump" \
                --dll-search-dir "$MINGW_W64_CROSS_ROOT/x86_64-w64-mingw32/lib"
              ;;
            x86_64-pc-windows-msvc)
              uv run ci/bundle_tests.py build release-test-bundle \
                --objdump llvm-objdump --check-dll-closure --allow-msvc-runtime
              ;;
            *) uv run ci/bundle_tests.py build release-test-bundle ;;
          esac
          tar -C release-test-bundle -czf release-test-bundle.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: release-test-bundle-${{ matrix.asset }}
          path: release-test-bundle.tar.gz
          if-no-files-found: error
      - name: Ship the toolchain runtime DLLs, and prove the import closure resolves
        # windows-gnu only in effect: soldr's mingw-w64 links mimalloc.dll against
        # libgcc_s_seh-1.dll (for __popcountdi2), which a plain Windows machine does not
        # have -- and a missing DLL is a dialog-free 0xC0000135, not a legible error. The
        # scan is the same one ci/bundle_tests.py runs for the test bundles, called
        # directly so the asset and the tested bundle make the same guarantee.
        #
        # --allow-msvc-runtime for the MSVC-ABI lane: VCRUNTIME140.dll/MSVCP140.dll are the
        # Visual C++ redistributable, not part of Windows. That is a real requirement on
        # the consumer, so it is recorded in PROVENANCE.txt below rather than papered over.
        if: startsWith(matrix.triple, 'x86_64-pc-windows')
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          if [ "$TRIPLE" = "x86_64-pc-windows-gnu" ]; then
            objdump="$MINGW_W64_CROSS_BIN/x86_64-w64-mingw32-objdump"
            search="$MINGW_W64_CROSS_ROOT/x86_64-w64-mingw32/lib"
            allow_msvc=0
          else
            objdump=llvm-objdump
            search=""
            allow_msvc=1
          fi
          OBJDUMP="$objdump" SEARCH="$search" ALLOW_MSVC="$allow_msvc" uv run python - <<'PY'
          import os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, "ci")
          from bundle_tests import resolve_runtime_dlls
          stage = Path("stage")
          staged = [p for p in stage.rglob("*") if p.suffix.lower() in (".dll", ".exe")]
          if not staged:
              sys.exit("no PE files were installed into stage/ -- nothing to ship")
          dirs = [Path(os.environ["SEARCH"])] if os.environ["SEARCH"] else []
          extra = resolve_runtime_dlls(
              staged, dirs, os.environ["OBJDUMP"], os.environ["ALLOW_MSVC"] == "1"
          )
          for src in extra:
              shutil.copy2(src, stage / "bin" / src.name)
              print(f"shipping toolchain runtime: {src}")
          print(f"import closure resolves for {len(staged)} PE file(s)")
          PY
      - name: Prove the asset is really for ${{ matrix.asset }}
        # A release that silently shipped host ELF objects under a macOS name is the
        # failure this whole cross-built design risks. Assert on the artifact.
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          echo "## ${{ matrix.asset }}" >> "$GITHUB_STEP_SUMMARY"
          case "$TRIPLE" in
            aarch64-apple-darwin)
              llvm-objdump --macho --private-headers stage/lib/libmimalloc.3*.dylib | tee hdr.txt
              grep -E 'MH_MAGIC_64 +ARM64' hdr.txt
              ;;
            x86_64-apple-darwin)
              llvm-objdump --macho --private-headers stage/lib/libmimalloc.3*.dylib | tee hdr.txt
              grep -E 'MH_MAGIC_64 +X86_64' hdr.txt
              ;;
            x86_64-pc-windows-gnu)
              "$MINGW_W64_CROSS_BIN/x86_64-w64-mingw32-objdump" -f stage/bin/mimalloc.dll | tee hdr.txt
              grep -q 'file format pei-x86-64' hdr.txt
              test -f stage/bin/mimalloc-redirect.dll
              test -f stage/bin/libgcc_s_seh-1.dll
              ;;
            x86_64-pc-windows-msvc)
              llvm-objdump -f stage/bin/mimalloc.dll | tee hdr.txt
              grep -q 'file format coff-x86-64' hdr.txt
              test -f stage/bin/mimalloc-redirect.dll
              ;;
          esac
          {
            echo '```'
            find stage -type f -o -type l | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write PROVENANCE.txt
        # The archive has to say what built it and what the consumer still needs. A user
        # who downloads `windows-x64-msvc` and finds it needs the VC++ redistributable
        # should learn that from the archive, not from a linker error.
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          {
            echo "mimalloc-pprof $(git rev-parse HEAD) -- ${{ matrix.asset }}"
            echo
            echo "commit:   $(git rev-parse HEAD)"
            echo "target:   ${TRIPLE}"
            echo "built on: ubuntu-latest (Linux), cross-compiled through soldr $(soldr --version 2>/dev/null || echo '?')"
            echo "config:   -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON -DMI_MEMEVT=ON"
            echo "          -DMI_DIAGNOSTICS=ON -DMI_DHAT=OFF -DMI_BUILD_TESTS=ON"
            echo
            echo "This binary was NOT built on the platform it targets. Every mimalloc-pprof"
            echo "release asset is cross-compiled on Linux, deliberately: mimalloc-pprof ships"
            echo "inside cross-compiled code, so the cross-built artifact is the product, and"
            echo "The release test bundle is built in this same tree. Native release jobs"
            echo "compare its libraries with this archive and execute its C tests."
            echo
            case "${TRIPLE}" in
              *-apple-darwin)
                echo "compiler: soldr's clang (LLVM 21) + ld64.lld, against soldr's Apple SDK."
                echo "          Not Xcode's clang and not Xcode's SDK."
                echo "requires: nothing beyond the deployment target recorded in the Mach-O"
                echo "          load commands."
                ;;
              x86_64-pc-windows-gnu)
                echo "compiler: soldr's mingw-w64 gcc 15 (UCRT), not MSYS2's msvcrt lane."
                echo "requires: libgcc_s_seh-1.dll, SHIPPED in bin/ beside mimalloc.dll."
                echo "          mimalloc.dll imports it for __popcountdi2; keep them together."
                ;;
              x86_64-pc-windows-msvc)
                echo "compiler: clang-cl + lld-link (LLVM 21), MSVC ABI, CRT pinned to /MD."
                echo "          This is NOT a \`cl\` binary. A native \`cl\` Release ctest job"
                echo "          remains a hard CI gate for cl compatibility (CLAUDE.md rule 3),"
                echo "          but it ships nothing."
                echo "requires: the Visual C++ redistributable (VCRUNTIME140.dll, MSVCP140.dll)."
                echo "          These are not part of Windows."
                ;;
            esac
            echo
            echo "layout:   bin/ runtime DLLs (Windows), lib/ import+static libraries and the"
            echo "          CMake package + pkg-config files, include/ headers (this fork's"
            echo "          mimalloc/profile.h and mimalloc/memory-events.h included)."
          } > stage/PROVENANCE.txt
          cat stage/PROVENANCE.txt
      - name: Archive
        # tar.gz for macOS: the libmimalloc.dylib -> libmimalloc.3.dylib SONAME chain is
        # symlinks, which zip does not preserve. zip for Windows, where nothing is a
        # symlink and a .zip is what a Windows consumer can open with no extra tool.
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="mimalloc-pprof-${ASSET}"
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -C stage -czf "dist/${name}.tar.gz" .
          else
            (cd stage && zip -r "$GITHUB_WORKSPACE/dist/${name}.zip" .)
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  test-shipped-assets:
    name: Test packaged library (${{ matrix.asset }})
    needs: [build-binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: macos-arm64
            runner: macos-15
            extension: tar.gz
          - asset: macos-x86_64
            runner: macos-15-intel
            extension: tar.gz
          - asset: windows-x64-gnu
            runner: windows-latest
            extension: zip
          - asset: windows-x64-msvc
            runner: windows-latest
            extension: zip
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries-${{ matrix.asset }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-test-bundle-${{ matrix.asset }}
          path: test-input
      - name: Verify packaged bytes and execute the release-configuration C suite
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ASSET: ${{ matrix.asset }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          archive="dist/mimalloc-pprof-${ASSET}.${EXTENSION}"
          bundle=test-input/release-test-bundle.tar.gz
          python3 ci/verify_release_test_bundle.py --archive "$archive" --bundle "$bundle" --asset "$ASSET"
          mkdir -p release-test-bundle
          tar -C release-test-bundle -xzf "$bundle"
          if [[ "$ASSET" == macos-* ]]; then
            # task_for_pid is deliberately denied to an ordinary hosted-macOS user.
            # Run the other 54 tests with normal privileges, then exercise the one
            # out-of-process zone-enumeration test as root instead of skipping it.
            python3 ci/run_test_bundle.py release-test-bundle \
              --exclude test-osx-zone-introspect-remote
            sudo -n "$(command -v python3)" ci/run_test_bundle.py release-test-bundle \
              --only test-osx-zone-introspect-remote
          else
            python3 ci/run_test_bundle.py release-test-bundle
          fi

  preflight-assets:
    name: Collate and validate exact release archives
    needs: [build-and-package, build-binaries, test-shipped-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mimalloc-pprof-c-zip
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: release-binaries-*
          merge-multiple: true
          path: dist
      - name: Name the five archives for the source version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust/mimalloc-pprof/Cargo.toml", "rb"))["package"]["version"])')
          tag="v${version}"
          mv dist/mimalloc-pprof-c.zip "dist/mimalloc-pprof-c-${tag}.zip"
          for asset in macos-arm64 macos-x86_64 windows-x64-gnu windows-x64-msvc; do
            case "$asset" in macos-*) ext=tar.gz ;; *) ext=zip ;; esac
            mv "dist/mimalloc-pprof-${asset}.${ext}" "dist/mimalloc-pprof-${asset}-${tag}.${ext}"
          done
      - name: Record and verify exact archive identities
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 ci/release.py preflight-artifacts --issue "$ISSUE_NUMBER" --candidate-sha "$CANDIDATE_SHA" --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-preflight-${{ inputs.candidate_sha }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release + publish to crates.io
    # build-binaries is a hard dependency, not a best-effort extra: a release that
    # published to crates.io and then shipped three of its four platform archives would be
    # a release nobody can tell is incomplete. `release-outcome` says so out loud too.
    needs: [preflight-assets, smoke-shipped-assets]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0 # origin/main is needed to prove a real candidate was merged

      - name: Verify release checkout is the candidate even in a dry run
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] && test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || { echo '::error::release checkout differs from candidate_sha'; exit 1; }

      - name: Require exact-SHA full native macOS evidence before any release write
        if: env.IS_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FULL_RUN_ID: ${{ inputs.full_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::candidate_sha must be a full commit SHA'; exit 1; }
          [[ "$FULL_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::full_run_id is required'; exit 1; }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || { echo '::error::checkout HEAD differs from candidate_sha'; exit 1; }
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main || { echo '::error::release candidate is not merged into origin/main'; exit 1; }
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FULL_RUN_ID")
          workflow_id=$(jq -er '.workflow_id' <<< "$run_json")
          workflow_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id")
          test "$(jq -r '.path' <<< "$workflow_json")" = '.github/workflows/macos-bundles.yml' || { echo '::error::full_run_id is not macos-bundles.yml'; exit 1; }
          test "$(jq -r '.event' <<< "$run_json")" = workflow_dispatch || { echo '::error::release evidence must be an explicit full dispatch'; exit 1; }
          test "$(jq -r '.head_branch' <<< "$run_json")" = main || { echo '::error::full run workflow source must be main'; exit 1; }
          test "$(jq -r '.display_title' <<< "$run_json")" = "macos-bundles/full/$CANDIDATE_SHA" || { echo '::error::full run candidate title differs from release candidate'; exit 1; }
          test "$(jq -r '.conclusion' <<< "$run_json")" = success || { echo '::error::full run did not succeed'; exit 1; }
          # Fetch all pages. Matrix jobs can exceed the default API page size.
          jobs_json=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$FULL_RUN_ID/jobs?per_page=100" --jq '.jobs[] | {name, status, conclusion}')
          verifier_name='resolve-candidate (exact SHA)'
          verifier_count=$(jq -s --arg name "$verifier_name" '[.[] | select(.name == $name)] | length' <<< "$jobs_json")
          verifier_success=$(jq -s --arg name "$verifier_name" '[.[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length' <<< "$jobs_json")
          test "$verifier_count" = 1 && test "$verifier_success" = 1 || { echo '::error::full run candidate identity verifier is missing, incomplete, duplicate, or failed'; exit 1; }
          for arch in arm64 x64; do
            name="run-macos-native-full ($arch)"
            count=$(jq -s --arg name "$name" '[.[] | select(.name == $name)] | length' <<< "$jobs_json")
            success_count=$(jq -s --arg name "$name" '[.[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length' <<< "$jobs_json")
            test "$count" = 1 && test "$success_count" = 1 || { echo "::error::required full macOS job $name is missing, incomplete, duplicate, or failed"; exit 1; }
          done
          echo "full native macOS evidence: run $FULL_RUN_ID, candidate $CANDIDATE_SHA"

      - name: Require versioned all-platform exact-SHA CI evidence before publication
        if: env.IS_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MACOS_RUN_ID: ${{ inputs.full_run_id }}
          C_UNIT_RUN_ID: ${{ inputs.c_unit_run_id }}
          WINDOWS_BUNDLES_RUN_ID: ${{ inputs.windows_bundles_run_id }}
          CROSS_RUN_ID: ${{ inputs.cross_run_id }}
          RUST_NATIVE_RUN_ID: ${{ inputs.rust_native_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for id in "$MACOS_RUN_ID" "$C_UNIT_RUN_ID" "$WINDOWS_BUNDLES_RUN_ID" "$CROSS_RUN_ID" "$RUST_NATIVE_RUN_ID"; do
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || { echo '::error::all five full CI run IDs are required'; exit 1; }
          done
          run_ids=$(jq -cn \
            --argjson macos "$MACOS_RUN_ID" --argjson c "$C_UNIT_RUN_ID" \
            --argjson windows "$WINDOWS_BUNDLES_RUN_ID" --argjson cross "$CROSS_RUN_ID" \
            --argjson rust "$RUST_NATIVE_RUN_ID" \
            '{"macos-bundles.yml": $macos, "c-unit.yml": $c, "windows-bundles.yml": $windows, "cross.yml": $cross, "rust-native.yml": $rust}')
          python3 ci/release_full_ci_gate.py --candidate-sha "$CANDIDATE_SHA" --run-ids-json "$run_ids"

      # Retried on purpose: this action has failed with a transient `write EPIPE`
      # during cache restore (issue #55), which skipped the publish job and turned a
      # tagged release into a silent no-op. A `uses:` step cannot be wrapped by a
      # retry action, so attempt it twice explicitly.
      - uses: zackees/setup-soldr@f63d8987580fd50667d95b19130e82d9691ddd75
        id: setup_soldr
        continue-on-error: true
        with:
          version: v0.9.11  # pinned: v0.9.12 archive lacks the binary (zackees/soldr#3091)
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
          build-cache-mode: full

      - name: Retry toolchain setup (first attempt failed)
        if: steps.setup_soldr.outcome == 'failure'
        uses: zackees/setup-soldr@f63d8987580fd50667d95b19130e82d9691ddd75
        with:
          version: v0.9.11  # pinned: v0.9.12 archive lacks the binary (zackees/soldr#3091)
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
          build-cache-mode: full

      - name: Download archives already tested on native hosts
        uses: actions/download-artifact@v4
        with:
          name: release-preflight-${{ inputs.candidate_sha }}
          path: dist
      - name: Download exact packaged crate
        uses: actions/download-artifact@v4
        with:
          name: release-crate-${{ inputs.candidate_sha }}
          path: release-crate
      - name: Verify the release worker received the exact tested archives
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 ci/release.py verify-artifacts --issue "$ISSUE_NUMBER" --candidate-sha "$CANDIDATE_SHA" --dist dist

      - name: Verify Cargo dry-run and package bytes on the publisher runner
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          soldr cargo publish --dry-run -p mimalloc-pprof --locked
          soldr cargo package -p mimalloc-pprof --locked
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("mimalloc-pprof/Cargo.toml", "rb"))["package"]["version"])')
          crate="mimalloc-pprof-${version}.crate"
          test -f "../release-crate/$crate"
          test -f "target/package/$crate"
          cmp "../release-crate/$crate" "target/package/$crate"
          test "$(stat -c %s "../release-crate/$crate")" -le 10000000

      - name: Read-only destination and issue-freeze preflight
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust/mimalloc-pprof/Cargo.toml", "rb"))["package"]["version"])')
          python3 -m ci.release_destinations --issue "$ISSUE_NUMBER" --candidate-sha "$CANDIDATE_SHA" \
            --dist dist --crate "release-crate/mimalloc-pprof-${version}.crate"

      - name: Authenticate with crates.io
        if: env.IS_DRY_RUN != 'true'
        id: crates_io_auth
        # v1 pinned to its verified commit: this action handles the publish credential.
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish frozen crate and GitHub assets, then finalize the release
        if: env.IS_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust/mimalloc-pprof/Cargo.toml", "rb"))["package"]["version"])')
          python3 -m ci.release_live --real --issue "$ISSUE_NUMBER" --candidate-sha "$CANDIDATE_SHA" \
            --dist dist --crate "release-crate/mimalloc-pprof-${version}.crate"

  # Both dry and real attempts smoke the exact archived library before any release write.
  smoke-shipped-assets:
    name: Smoke shipped archive (${{ matrix.asset }})
    needs: [preflight-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: macos-arm64
            runner: macos-15
          - asset: macos-x86_64
            runner: macos-15-intel
          - asset: windows-x64-gnu
            runner: windows-latest
          - asset: windows-x64-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact worker preflight archive and info.json
        uses: actions/download-artifact@v4
        with:
          name: release-preflight-${{ inputs.candidate_sha }}
          path: dist
      - name: Verify checkout and smoke packaged library
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 ci/smoke_release_archive.py --dist dist --asset "$ASSET" --candidate-sha "$CANDIDATE_SHA"

  # Issue #55: the publish job is gated on every build job, so a single transient runner
  # failure silently turns a tagged release into a no-op. This job makes that outcome
  # impossible to miss and says exactly how to recover. (The "three OS builds" this comment
  # used to name are gone: #277 phase E made `build-and-package` one ubuntu row and moved
  # the platform binaries into `build-binaries`, four Linux cross lanes.)
  release-outcome:
    name: Release outcome check
    needs: [build-and-package, build-binaries, release]
    if: always() && inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      - name: Fail loudly if the candidate did not produce a release
        shell: bash
        run: |
          build='${{ needs.build-and-package.result }}'
          binaries='${{ needs.build-binaries.result }}'
          release='${{ needs.release.result }}'
          echo "build-and-package: ${build}"
          echo "build-binaries: ${binaries}"
          echo "release: ${release}"
          if [ "$release" = "success" ]; then
            echo "candidate ${{ inputs.candidate_sha }} released successfully"
            exit 0
          fi
          echo "::error::Candidate ${{ inputs.candidate_sha }} was NOT released (build=${build}, binaries=${binaries}, release=${release}). Check destination state before retrying run ${GITHUB_RUN_ID}."
          exit 1

  record-attempt-outcome:
    name: Record release attempt outcome on issue
    needs: [validate-attempt, build-and-package, build-binaries, test-shipped-assets, preflight-assets, smoke-shipped-assets, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Append run URL and outcome to the release control issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          VALIDATE: ${{ needs.validate-attempt.result }}
          PACKAGE: ${{ needs.build-and-package.result }}
          BINARIES: ${{ needs.build-binaries.result }}
          TEST_SHIPPED: ${{ needs.test-shipped-assets.result }}
          PREFLIGHT: ${{ needs.preflight-assets.result }}
          RELEASE: ${{ needs.release.result }}
          SMOKE: ${{ needs.smoke-shipped-assets.result }}
          IS_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          state=blocked
          if [[ "$VALIDATE" == success && "$PACKAGE" == success && "$BINARIES" == success && "$TEST_SHIPPED" == success && "$PREFLIGHT" == success && "$SMOKE" == success && "$RELEASE" == success ]]; then
            if [[ "$IS_DRY_RUN" == true ]]; then
              state=dry-passed
            elif [[ "$IS_DRY_RUN" != true ]]; then
              state=real-passed
            fi
          fi
          results="validate=$VALIDATE,package=$PACKAGE,binaries=$BINARIES,test-shipped=$TEST_SHIPPED,preflight=$PREFLIGHT,smoke=$SMOKE,release=$RELEASE"
          python3 ci/release.py record-outcome --issue "$ISSUE_NUMBER" --candidate-sha "$CANDIDATE_SHA" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --state "$state" --results "$results"
          [[ "$state" != blocked ]]
