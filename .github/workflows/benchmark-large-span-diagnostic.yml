name: benchmark-large-span-diagnostic

# Manual-only #543 investigation. All measurements and contextual references share one
# ubuntu-24.04 job/VM; this is not a promise of stable physical hardware or zero hypervisor noise.
# It does not publish charts, update a site, or dispatch another workflow.
on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: "Full 40-character old-fork baseline commit"
        required: true
        type: string
      candidate_sha:
        description: "Full 40-character candidate commit to check out and measure"
        required: true
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RUN_LOCAL_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      OUTPUT_DIR: ${{ github.workspace }}/.large-span-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: validate exact source commits and describe runner identity
        run: |
          set -euo pipefail
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse --verify "$BASELINE_SHA^{commit}")" = "$BASELINE_SHA"
          mkdir -p "$OUTPUT_DIR"
          {
            printf '%s\n' '# Run context' ''
            printf '%s\n' "- Baseline: $BASELINE_SHA"
            printf '%s\n' "- Candidate: $CANDIDATE_SHA"
            printf '%s\n' "- Run-local host/job ID: $RUN_LOCAL_ID"
            printf '%s\n' '- Runner: ubuntu-24.04, one workflow job/VM for all measurements.'
            printf '%s\n' '- Isolation claim: fresh GitHub-hosted VM; not a stable physical-host identity, and hypervisor/host noise may remain.'
            printf '%s\n' '- Publication: disabled; this workflow has contents-read permissions and only uploads a raw artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '{"baseline_sha":"%s","candidate_sha":"%s","run_local_id":"%s","runner":"ubuntu-24.04","isolation_claim":"fresh GitHub-hosted VM; physical host may vary and hypervisor noise may remain","publication":"disabled"}\n' \
            "$BASELINE_SHA" "$CANDIDATE_SHA" "$RUN_LOCAL_ID" > "$OUTPUT_DIR/run-context.json"
      - uses: zackees/setup-soldr@62d1596b70168e422156f12273a2ed476d3a16dc
        with:
          cache-preset: full
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
      - name: build current five-allocator producer and benchmark suite
        run: |
          set -euxo pipefail
          python3 ci/build_benchmark_allocators.py --build-root rust/target/release --jobs "$(nproc)"
          cp rust/target/release/allocator-provenance.json "$OUTPUT_DIR/current-allocator-provenance.json"
          cp rust/benchmark-suite/allocators/allocator-lock.json "$OUTPUT_DIR/allocator-lock.json"
          cd rust
          soldr cargo build -p benchmark-suite --release --locked
      - name: build baseline pprof child against historical source and headers
        run: |
          set -euxo pipefail
          python3 ci/build_old_fork_latency_provenance.py \
            --old-sha "$BASELINE_SHA" \
            --provenance rust/target/release/allocator-provenance.json \
            --build-root rust/target/release \
            --output-dir "$OUTPUT_DIR/old-fork-build"
      - name: prepare process-scoped perf collector and probe runner events
        run: |
          set -euo pipefail
          python3 ci/perf_access.py \
            --directory "$RUNNER_TEMP/large-span-perf-${{ github.run_id }}-${{ github.run_attempt }}" \
            --output "$OUTPUT_DIR/perf-access.json" \
            --github-env "$GITHUB_ENV"
          printf 'MIMALLOC_PERF_ACCESS_REPORT=%s\n' "$OUTPUT_DIR/perf-access.json" >> "$GITHUB_ENV"
      - name: run seven paired large-span repetitions and untimed deep diagnostics
        run: |
          set -euxo pipefail
          python3 ci/large_span_diagnostic.py \
            --base "$BASELINE_SHA" \
            --candidate "$CANDIDATE_SHA" \
            --reps 7 \
            --isolation isolated \
            --stable-host-id "$RUN_LOCAL_ID" \
            --raw "$OUTPUT_DIR/large-span-raw.json" \
            --summary "$OUTPUT_DIR/large-span-summary.txt" \
            --deep-output "$OUTPUT_DIR/large-span-paired-deep.json" \
            --deep-profile-prefix "$OUTPUT_DIR/profile"
      - name: run matched latency sidecar
        run: |
          set -euxo pipefail
          cd rust
          soldr cargo run -p benchmark-suite --bin benchmark-latency-run --release -- \
            --blocks 7 \
            --run-seed "$GITHUB_RUN_ID" \
            --build-root target/release \
            --diagnostic-large-object \
            --diagnostic-old-fork-provenance "$OUTPUT_DIR/old-fork-build/allocator-provenance.json" \
            --stable-host-id "$RUN_LOCAL_ID" \
            --output-dir "$OUTPUT_DIR/latency"
      - name: run same-job diagnostic scaling references
        run: |
          set -euxo pipefail
          cd rust
          soldr cargo run -p benchmark-suite --bin benchmark-scaling-run --release -- \
            --diagnostic \
            --blocks 7 \
            --run-seed "$GITHUB_RUN_ID" \
            --shard-index 0 \
            --shard-count 1 \
            --patterns random-large,large-class-persistent,larson \
            --thread-points 8 \
            --build-root target/release \
            --output-dir "$OUTPUT_DIR/scaling"
      - name: link same-run latency and contextual scaling artifacts
        run: |
          set -euxo pipefail
          python3 ci/large_span_latency_link.py \
            --large-span "$OUTPUT_DIR/large-span-raw.json" \
            --latency "$OUTPUT_DIR/latency/latency-large-object-diagnostic.json" \
            --output "$OUTPUT_DIR/large-span-latency-link.json" \
            --summary "$OUTPUT_DIR/large-span-combined-summary.txt"
          python3 ci/large_span_refs.py \
            --large-span "$OUTPUT_DIR/large-span-raw.json" \
            --scaling "$OUTPUT_DIR/scaling/scaling-raw-run.json" \
            --candidate-sha "$CANDIDATE_SHA" \
            --output "$OUTPUT_DIR/large-span-scaling-refs.json"
      - name: upload raw diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: large-span-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          path: |
            ${{ github.workspace }}/.large-span-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/run-context.json
            ${{ github.workspace }}/.large-span-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/current-allocator-provenance.json
            ${{ github.workspace }}/.large-span-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/allocator-lock.json
            ${{ github.workspace }}/.large-span-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/perf-access.json
            ${{ github.workspace }}/.large-span-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/old-fork-build/allocator-provenance.json
            ${{ github.workspace }}/.large-span-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/old-fork-build/old-libmimalloc.a
            ${{ github.workspace }}/.large-span-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/old-fork-build/benchmark-child-old-fork
            ${{ github.workspace }}/.large-span-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/large-span-*
            ${{ github.workspace }}/.large-span-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/profile*
            ${{ github.workspace }}/.large-span-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/latency/
            ${{ github.workspace }}/.large-span-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/scaling/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
