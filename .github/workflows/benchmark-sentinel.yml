name: benchmark-sentinel

# PR sentinel tier from #171: fork-only, 5 scenario cards, ≤10 min budget.
# Produces JSON + HTML report uploaded as a CI artifact.
# Hosted-runner results are labelled informational — not accepted for
# small-timing claims (requires stable reference host per #170).

on:
  pull_request:
    paths:
      - rust/**
      - src/**
      - include/**
      - .github/workflows/benchmark-sentinel.yml
  workflow_dispatch:

env:
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

concurrency:
  # PR-tier sentinel; artifact-only, publishes nothing (see #171).
  group: benchmark-sentinel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sentinel:
    name: benchmark-sentinel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # TODO(#277 phase D, added 2026-09-02): DELETE the windows-latest row after ten pushes
    # have compared it against the `PR benchmark sentinel` step in windows-bundles.yml's
    # `run-windows`, which runs a Linux-cross-built `dashboard.exe` on the shared Windows
    # VM. Informational until then. The numbers were already labelled informational (#171,
    # #170: hosted runners are not a stable reference host) and no gate reads them, which
    # is what makes it acceptable for the replacement to measure on a VM that has just run
    # four ctest suites. The ubuntu-latest row is NOT affected.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
        with:
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
          build-cache-mode: full
      - name: Run PR sentinel benchmarks
        run: soldr cargo run -p dashboard --release
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ matrix.os }}
          path: rust/benchmark-report.html
          if-no-files-found: error
      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-json-${{ matrix.os }}
          path: rust/target/release/*.json
          if-no-files-found: warn
