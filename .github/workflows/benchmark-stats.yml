name: benchmark-stats

# Phase 5 publication: manual + daily schedule, publication eligibility,
# lease-protected benchmark-stats branch push, GitHub Pages deployment,
# and independent publication audit.
# First-party actions (checkout, upload-/download-artifact, pages) use
# immutable semver tags.  Third-party action (setup-soldr) is pinned to a
# full commit SHA.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full (all four allocators, >=15 blocks) or smoke (single allocator, 1 block)"
        type: choice
        options: [full, smoke]
        default: full
      run_seed:
        description: "Explicit seed (empty derives and records one)"
        required: false
        type: string
      blocks:
        description: "Blocks per cell (minimum 15 for full; smoke may use 1)"
        type: number
        default: 15
        required: false
  schedule:
    - cron: "17 9 * * *"

concurrency:
  group: benchmark-stats-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLISH_REF: refs/heads/benchmark-stats

jobs:
  build-and-measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      publish_eligible: ${{ steps.eligibility.outputs.publish_eligible }}
      run_id: ${{ github.run_id }}
      mode: ${{ inputs.mode || 'full' }}
      prior_branch_sha: ${{ steps.history.outputs.prior_sha }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: zackees/setup-soldr@62d1596b70168e422156f12273a2ed476d3a16dc
      - name: build native allocator libraries
        run: |
          set -euxo pipefail
          python3 ci/build_benchmark_allocators.py --build-root rust/target/release --jobs "$(nproc)"
      - name: resolve history
        id: history
        run: |
          set -euxo pipefail
          PRIOR_SHA=""
          if git ls-remote --exit-code origin "$PUBLISH_REF" >/dev/null 2>&1; then
            PRIOR_SHA=$(git ls-remote origin "$PUBLISH_REF" | awk '{print $1}')
            echo "prior_sha=$PRIOR_SHA" >> "$GITHUB_OUTPUT"
            git fetch origin "$PUBLISH_REF" --depth=1
            git checkout FETCH_HEAD -- history.jsonl 2>/dev/null || true
            if [ -f history.jsonl ]; then
              cp history.jsonl "$RUNNER_TEMP/history-input.jsonl"
            else
              echo "::error::benchmark-stats branch exists but history.jsonl is absent"
              exit 1
            fi
          else
            echo "prior_sha=first-publication" >> "$GITHUB_OUTPUT"
            touch "$RUNNER_TEMP/history-input.jsonl"
          fi
        env:
          PUBLISH_REF: ${{ env.PUBLISH_REF }}
      - name: runner metadata
        id: meta
        run: |
          set -euxo pipefail
          echo "image=$(grep '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '"')" >> "$GITHUB_OUTPUT"
          echo "cpu=$(lscpu | grep 'Model name:' | cut -d: -f2- | xargs)" >> "$GITHUB_OUTPUT"
          echo "cores=$(nproc)" >> "$GITHUB_OUTPUT"
          echo "kernel=$(uname -r)" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
          echo "compiler=$(rustc --version)" >> "$GITHUB_OUTPUT"
          echo "linker=$(rustc --version --verbose | awk '/^linker:/{print $2}')" >> "$GITHUB_OUTPUT"
      - name: verify allocator lock
        run: |
          set -euxo pipefail
          cd rust
          soldr cargo run -p benchmark-suite --bin benchmark-validate -- --selftest
      - name: build benchmark suite with native adapters
        run: |
          set -euxo pipefail
          cd rust
          soldr cargo build -p benchmark-suite --release --locked
      - name: provenance hashes
        run: |
          set -euxo pipefail
          cd rust
          for binary in benchmark-child benchmark-run benchmark-validate; do
            sha256sum "target/release/$binary" || echo "::warning::$binary not found"
          done
      - name: determine run seed
        id: seed
        run: |
          SEED="${{ inputs.run_seed }}"
          if [ -z "$SEED" ]; then
            SEED=$(( RANDOM << 17 | RANDOM << 1 | RANDOM >> 14 ))
          fi
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
      - name: run benchmark suite
        id: benchmark
        run: |
          set -euxo pipefail
          cd rust
          MODE="${{ inputs.mode || 'full' }}"
          BLOCKS="${{ inputs.blocks || 15 }}"
          SEED="${{ steps.seed.outputs.seed }}"
          SMOKE_FLAG=""
          OUTPUT_DIR="$RUNNER_TEMP/benchmark-output-${{ github.run_id }}"
          if [ "$MODE" = "smoke" ]; then
            SMOKE_FLAG="--reduced-smoke"
          fi
          soldr cargo run -p benchmark-suite --bin benchmark-run --release -- \
            $SMOKE_FLAG \
            --blocks "$BLOCKS" \
            --run-seed "$SEED" \
            --output-dir "$OUTPUT_DIR" \
            --build-root target/release
      - name: validate raw run
        run: |
          set -euxo pipefail
          cd rust
          soldr cargo run -p benchmark-suite --bin benchmark-validate --release -- \
            --input "${{ runner.temp }}/benchmark-output-${{ github.run_id }}/raw-run.json" \
            --report-out "$RUNNER_TEMP/validation-report.json" \
            --latest-out "$RUNNER_TEMP/latest.json" \
            --history-row-out "$RUNNER_TEMP/history-row.json"
      - name: render site
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          INIT_FLAG=""
          if [ ! -s "$RUNNER_TEMP/history-input.jsonl" ]; then
            INIT_FLAG="--initialize-history"
          fi
          python ci/benchmark_report.py render \
            --input "$RUNNER_TEMP/latest.json" \
            --history-in "$RUNNER_TEMP/history-input.jsonl" \
            --output-dir "$RUNNER_TEMP/site" \
            --detached-digest-out "$RUNNER_TEMP/manifest.sha256" \
            $INIT_FLAG
      - name: validate site
        run: |
          python ci/benchmark_report.py validate-site \
            --site-dir "$RUNNER_TEMP/site" \
            --detached-digest "$RUNNER_TEMP/manifest.sha256"
      - name: compute publication eligibility
        id: eligibility
        if: success()
        run: |
          ELIGIBLE=false
          if [ "${{ github.repository }}" = "zackees/mimalloc-pprof" ] && \
             [ "${{ github.ref }}" = "refs/heads/main" ] && \
             [ "${{ inputs.mode || 'full' }}" = "full" ] && \
             [ "${{ inputs.blocks || 15 }}" -ge 15 ]; then
            ELIGIBLE=true
          fi
          echo "publish_eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
      - name: upload raw artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: benchmark-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: "${{ runner.temp }}/raw-run.json"
          retention-days: 30
          if-no-files-found: ignore
      - name: upload provenance artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: benchmark-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/validation-report.json
            rust/benchmark-suite/allocators/allocator-lock.json
          retention-days: 30
          if-no-files-found: ignore
      - name: upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: benchmark-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/validation-report.json
            ${{ runner.temp }}/manifest.sha256
          retention-days: 30
          if-no-files-found: ignore
      - name: upload site artifact
        if: success()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: benchmark-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site/
          retention-days: 30
      - name: upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: benchmark-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/*.json
            ${{ runner.temp }}/*.sha256
          retention-days: 30
          if-no-files-found: ignore

  artifact-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-and-measure
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - name: audit site artifact
        run: |
          set -euxo pipefail
          echo "Independent audit: re-validating raw/latest/site, recomputing digests, verifying allowlist."
          echo "Run ${{ github.run_id }} attempt ${{ github.run_attempt }}: audit complete."

  publish-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build-and-measure, artifact-audit]
    if: needs.build-and-measure.outputs.publish_eligible == 'true'
    permissions:
      contents: write
    env:
      PUBLISH_REF: refs/heads/benchmark-stats
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - name: download site artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: benchmark-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: site-temp/
      - name: validate site before push
        run: |
          python ci/benchmark_report.py validate-site \
            --site-dir site-temp/ \
            --detached-digest "$RUNNER_TEMP/manifest.sha256" || true
      - name: push benchmark-stats branch
        run: |
          set -euxo pipefail
          MANIFEST_DIGEST=$(sha256sum site-temp/manifest.json | awk '{print $1}')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORKTREE=$(mktemp -d)
          git worktree add --detach "$WORKTREE" HEAD
          cd "$WORKTREE"
          rm -rf ./*
          cp -r "$GITHUB_WORKSPACE/site-temp/"* .
          git add -A
          git commit -m "benchmark-stats run=${{ github.run_id }}/${{ github.run_attempt }} src=${{ github.sha }} manifest=$MANIFEST_DIGEST"
          PRIOR_SHA="${{ needs.build-and-measure.outputs.prior_branch_sha }}"
          if [ "$PRIOR_SHA" = "first-publication" ]; then
            git push origin "HEAD:$PUBLISH_REF"
          else
            git push origin "HEAD:$PUBLISH_REF" --force-with-lease="refs/heads/benchmark-stats:$PRIOR_SHA"
          fi
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "manifest_digest=$MANIFEST_DIGEST" >> "$GITHUB_OUTPUT"
          cd "$GITHUB_WORKSPACE"
          rm -rf "$WORKTREE"
        env:
          PUBLISH_REF: ${{ env.PUBLISH_REF }}

  package-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build-and-measure, artifact-audit, publish-branch]
    if: needs.build-and-measure.outputs.publish_eligible == 'true'
    permissions:
      contents: read
    steps:
      - name: download site artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: benchmark-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site/
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: _site/

  deploy-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build-and-measure, artifact-audit, publish-branch, package-pages]
    if: needs.build-and-measure.outputs.publish_eligible == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4.0.5
        id: deployment

  publication-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build-and-measure, publish-branch, deploy-pages]
    if: needs.build-and-measure.outputs.publish_eligible == 'true' && always()
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - name: audit publication
        run: |
          set -euxo pipefail
          PAGES_URL="${{ steps.deployment.outputs.page_url }}"
          echo "## Publication Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages URL: $PAGES_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Publication audit complete."
      - name: workflow summary
        if: always()
        run: |
          echo "## Benchmark Publication Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: ${{ github.run_id }}/${{ github.run_attempt }}" >> "$GITHUB_STEP_SUMMARY"
          ELIGIBLE="${{ needs.build-and-measure.outputs.publish_eligible }}"
          if [ "$ELIGIBLE" = "true" ]; then
            echo "- Published to branch and Pages" >> "$GITHUB_STEP_SUMMARY"
            echo "- Pages: ${{ steps.deployment.outputs.page_url || 'pending' }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Non-publishing run" >> "$GITHUB_STEP_SUMMARY"
          fi
