name: c-unit

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - '.github/workflows/c-unit.yml'

jobs:
  ctest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  ctest-pprof-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=OFF && cmake --build build && ctest --test-dir build --output-on-failure

  ctest-debug-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_DEBUG_FULL=ON && cmake --build build && ctest --test-dir build --output-on-failure

  # TEMPORARY (debug/v3-stress-heaps): does STOCK upstream/dev3 also segfault in
  # test-stress-heaps under the same MinGW/GCC-16 toolchain? This isolates whether the
  # failure belongs to the fork's port or to upstream. Not for merge.
  upstream-dev3-control:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja git
      - name: build and run STOCK upstream/dev3
        run: |
          set +e
          gcc --version | head -1
          git clone --no-checkout https://github.com/microsoft/mimalloc.git stock
          cd stock
          git fetch origin dev3
          # Compare the pinned base against the CURRENT dev3 tip: dev3 has landed
          # "fix heap delete for OS allocated pages" (c8c65741) and "fix
          # mi_heap_delete_pages with a NULL theap target" (cb0c26e4) since 579f8c0e,
          # and test-stress-heaps is exactly the rolling-heaps/mi_heap_delete test.
          for rev in 579f8c0e93a0468a20dd20fac861bc3580b1735e origin/dev3; do
            git checkout -q --detach $rev
            echo "######## STOCK dev3 @ $rev ($(git rev-parse --short HEAD)) ########"
            rm -rf build
            cmake -B build -G Ninja > /dev/null 2>&1
            cmake --build build > /dev/null 2>&1 || { echo "BUILD FAILED"; continue; }
            fails=0
            for i in 1 2 3 4 5 6; do
              ./build/mimalloc-test-stress-heaps.exe > /dev/null 2>&1
              [ $? -ne 0 ] && fails=$((fails+1))
            done
            echo ">>>> STOCK $rev: $fails failures / 6 runs"
          done

  ctest-win-gnu:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-gdb
      # Keep the EXACT failing configuration (no CMAKE_BUILD_TYPE, as in the real job)
      # and only add -g, so debugging does not change what is being debugged.
      - run: cmake -B build -G Ninja -DMI_PPROF=ON -DCMAKE_C_FLAGS=-g
      - run: cmake --build build
      # MI_DEBUG_FULL (MI_DEBUG=3, full internal invariant checking -- note mimalloc
      # uses its own _mi_assert_fail gated on MI_DEBUG, so NDEBUG is irrelevant) did
      # NOT trip any assertion; it segfaults outright. So this is not allocator
      # metadata corruption that mimalloc's own invariants can see. Get the exact
      # faulting instruction instead.
      #
      # -g1 (line tables only) keeps debug info small: full -g produced a
      # ".debug_loclists is too large" BFD error that made gdb useless.
      # Every run is bounded so the step always completes and the log survives.
      - name: probe - faulting instruction at -O2 -g1
        timeout-minutes: 30
        run: |
          set +e
          cmake -B b-bt -G Ninja -DMI_PPROF=ON -DCMAKE_C_FLAGS="-O2 -g1 -fno-omit-frame-pointer" > /dev/null 2>&1
          cmake --build b-bt > /dev/null 2>&1 || { echo "BUILD FAILED"; exit 0; }
          for i in 1 2 3; do
            echo "===== attempt $i ====="
            timeout 300 gdb -batch               -ex run               -ex "echo 
==== FRAME ====
" -ex "bt 40"               -ex "echo 
==== FAULTING INSN ====
" -ex "x/i \$rip"               -ex "echo 
==== REGS ====
" -ex "info registers rip rsp rbp rax rbx"               --args ./b-bt/mimalloc-test-stress-heaps.exe > bt.log 2>&1
            echo "gdb exit=$?"
            if grep -qiE "SIGSEGV|Segmentation" bt.log; then
              echo "*** reproduced on attempt $i ***"
              grep -avE "^\[New Thread|^\[Thread" bt.log | tail -60
              exit 0
            fi
            echo "no crash on attempt $i"
          done
