name: c-unit

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - '.github/workflows/c-unit.yml'

jobs:
  ctest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  ctest-pprof-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=OFF && cmake --build build && ctest --test-dir build --output-on-failure

  ctest-debug-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_DEBUG_FULL=ON && cmake --build build && ctest --test-dir build --output-on-failure

  # Shared-library build (issue #62). Our src/static.c amalgamation compiles
  # everything as one TU, which hides link errors that only appear when the library
  # is built as a real DLL/so -- conda-forge carries a patch making
  # `_mi_theap_malloc_zero` extern inline for exactly this reason on v3.4.1.
  # Runs on both Windows toolchains because that is where the reported failure was.
  #
  # MSVC-shared (windows-latest) is deliberately NOT in this matrix yet: it found a real
  # bug -- MIMALLOC_MEMORY_EVENTS env activation fails in an MSVC DLL build, tracked in
  # issue #69 -- and adding it red, or with continue-on-error, is how a gate becomes
  # decoration. It goes in with the fix. win-gnu shared runs below and is green.
  ctest-shared:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=ON -DMI_BUILD_SHARED=ON -DMI_BUILD_STATIC=OFF -DMI_BUILD_OBJECT=OFF
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  ctest-shared-win-gnu:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - run: cmake -B build -G Ninja -DMI_PPROF=ON -DMI_BUILD_SHARED=ON -DMI_BUILD_STATIC=OFF -DMI_BUILD_OBJECT=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # Memory + counter regression gate (issue #63). The test's own inline assertions are
  # self-relative and gate on every runner unconditionally. The committed baselines add
  # cross-COMMIT drift detection, which a per-run ratio cannot see: a leak introduced
  # 3% at a time over ten PRs passes every self-relative check and still doubles memory.
  #
  # Baselines are per platform AND per MI_PPROF setting, never shared: lazy zeroing makes
  # Linux RSS and Windows commit incomparable for identical behavior, and rule 4 puts the
  # profiler's own arena in process memory so an ON build legitimately peaks higher.
  memory-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=ON
      - run: cmake --build build --config Release
      - name: Run the gate
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -C Release -R test-memory-gate --output-on-failure
      - name: Emit JSON and compare against baseline
        shell: bash
        run: |
          set -uo pipefail
          exe=$(find build -name 'mimalloc-test-memory-gate*' -type f -perm -u+x | head -1)
          MI_BENCH_JSON=result.json "$exe" > /dev/null
          cat result.json
          python3 ci/memory_gate.py check result.json
          rc=$?
          if [ $rc -eq 2 ]; then
            echo "::warning::No committed baseline for this platform yet -- bootstrap it from this run's artifact."
            exit 0
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: memory-gate-${{ matrix.os }}
          path: result.json
          if-no-files-found: error

  ctest-win-gnu:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - run: cmake -B build -G Ninja -DMI_PPROF=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
