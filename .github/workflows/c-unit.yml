name: c-unit

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - '.github/workflows/c-unit.yml'

jobs:
  ctest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  ctest-pprof-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=OFF && cmake --build build && ctest --test-dir build --output-on-failure

  ctest-debug-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_DEBUG_FULL=ON && cmake --build build && ctest --test-dir build --output-on-failure

  # TEMPORARY (debug/v3-stress-heaps): does STOCK upstream/dev3 also segfault in
  # test-stress-heaps under the same MinGW/GCC-16 toolchain? This isolates whether the
  # failure belongs to the fork's port or to upstream. Not for merge.
  upstream-dev3-control:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja git
      - name: build and run STOCK upstream/dev3
        run: |
          set +e
          gcc --version | head -1
          git clone --no-checkout https://github.com/microsoft/mimalloc.git stock
          cd stock
          git fetch origin dev3
          # Compare the pinned base against the CURRENT dev3 tip: dev3 has landed
          # "fix heap delete for OS allocated pages" (c8c65741) and "fix
          # mi_heap_delete_pages with a NULL theap target" (cb0c26e4) since 579f8c0e,
          # and test-stress-heaps is exactly the rolling-heaps/mi_heap_delete test.
          for rev in 579f8c0e93a0468a20dd20fac861bc3580b1735e origin/dev3; do
            git checkout -q --detach $rev
            echo "######## STOCK dev3 @ $rev ($(git rev-parse --short HEAD)) ########"
            rm -rf build
            cmake -B build -G Ninja > /dev/null 2>&1
            cmake --build build > /dev/null 2>&1 || { echo "BUILD FAILED"; continue; }
            fails=0
            for i in 1 2 3 4 5 6; do
              ./build/mimalloc-test-stress-heaps.exe > /dev/null 2>&1
              [ $? -ne 0 ] && fails=$((fails+1))
            done
            echo ">>>> STOCK $rev: $fails failures / 6 runs"
          done

  ctest-win-gnu:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-gdb
      # Keep the EXACT failing configuration (no CMAKE_BUILD_TYPE, as in the real job)
      # and only add -g, so debugging does not change what is being debugged.
      - run: cmake -B build -G Ninja -DMI_PPROF=ON -DCMAKE_C_FLAGS=-g
      - run: cmake --build build
      # MI_DEBUG_FULL turns on mimalloc's internal invariant assertions, so we learn
      # WHICH invariant breaks instead of only seeing the later segfault victim.
      - name: probe - MI_DEBUG_FULL on win-gnu
        timeout-minutes: 20
        run: |
          set +e
          cmake -B b-dbgfull -G Ninja -DMI_PPROF=ON -DMI_DEBUG_FULL=ON > /dev/null 2>&1
          cmake --build b-dbgfull > /dev/null 2>&1 || { echo "BUILD FAILED"; exit 0; }
          for i in 1 2 3; do
            echo "===== attempt $i ====="
            ./b-dbgfull/mimalloc-test-stress-heaps.exe > out.log 2>&1
            echo "exit=$?"
            tail -15 out.log
          done
      - name: probe - backtrace at -O1
        timeout-minutes: 20
        run: |
          set +e
          cmake -B b-o1 -G Ninja -DMI_PPROF=ON -DCMAKE_C_FLAGS="-O1 -g -fno-omit-frame-pointer" > /dev/null 2>&1
          cmake --build b-o1 > /dev/null 2>&1 || { echo "BUILD FAILED"; exit 0; }
          for i in 1 2 3; do
            gdb -batch -ex run -ex bt --args ./b-o1/mimalloc-test-stress-heaps.exe > bt.log 2>&1
            if grep -qiE "SIGSEGV|Segmentation" bt.log; then
              echo "=== reproduced at -O1, attempt $i ==="
              grep -avE "^\[New Thread|^\[Thread" bt.log | tail -40
              exit 0
            fi
            echo "attempt $i: no crash at -O1"
          done
      - run: ctest --test-dir build --output-on-failure
