name: c-unit

on:
  push:
    branches: [main, v4]
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'ci/**'
      - '.github/workflows/c-unit.yml'

jobs:
  ctest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  # Distro packagers build for a generic CPU. Verify a MI_NO_OPT_ARCH=ON build really
  # is baseline-clean, by scanning the shipped instruction stream rather than trusting
  # the flags.
  #
  # Runners are both Linux on purpose: x64 covers the x86-64-v1 baseline, and
  # ubuntu-24.04-arm covers Debian's armv8.0-a arm64 baseline -- the case that actually
  # bites, since CMakeLists.txt force-enables MI_OPT_ARCH on arm64. macOS is NOT used
  # here: Apple Silicon is the baseline on that platform, so LSE atomics are expected
  # there and a "clean" result would mean nothing.
  isa-baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The disassembly parser is itself a thing that can silently break (it did, on
      # arm64). Fixtures for both layouts, checked on every runner.
      - name: Disassembly parser selftest
        run: python3 ci/check_isa_baseline.py --selftest
      - name: Portable build must contain no above-baseline instructions
        run: |
          cmake -B build-portable -DMI_PPROF=ON -DMI_NO_OPT_ARCH=ON
          cmake --build build-portable --target mimalloc-static
          python3 ci/check_isa_baseline.py "$(ls build-portable/libmimalloc*.a | head -1)"
      # A check that has never been observed to fail proves nothing. Build with the
      # optimizations deliberately on and require the same scanner to catch it.
      - name: Positive control -- scanner must fire on an MI_OPT_ARCH=ON build
        run: |
          cmake -B build-arch -DMI_PPROF=ON -DMI_OPT_ARCH=ON
          cmake --build build-arch --target mimalloc-static
          python3 ci/check_isa_baseline.py "$(ls build-arch/libmimalloc*.a | head -1)" --expect-dirty
      - name: Upload portable library
        uses: actions/upload-artifact@v4
        with:
          name: mimalloc-portable-${{ matrix.os }}
          path: build-portable/libmimalloc*.a

  # MI_GUARDED places guard pages behind sampled allocations. It was documented as
  # default-on in debug builds and was NEVER enabled -- two dead CMake constructs (see
  # #116). Now that it can turn on, it needs a job that actually builds with it, or we
  # have simply moved the flag from "silently off" to "on and untested".
  ctest-guarded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and prove MI_GUARDED survived
        run: |
          set -euo pipefail
          cmake -B build-guarded -DCMAKE_BUILD_TYPE=Debug -DMI_PPROF=ON -DMI_GUARDED=ON 2>&1 | tee cfg.log
          # The whole point of #116 is that the flag silently did not reach the compiler.
          # Assert on the resolved defines, not on the option we passed in.
          if ! grep -qE "Compiler defines *:.*MI_GUARDED=1" cfg.log; then
            echo "::error::MI_GUARDED=1 did not reach mi_defines -- the flag is not actually enabled."
            grep -i "guard\|Compiler defines" cfg.log || true
            exit 1
          fi
      - run: cmake --build build-guarded --parallel
      - run: ctest --test-dir build-guarded --output-on-failure --timeout 900
      # Guard every in-range allocation instead of 1-in-4000, so the guarded path is
      # actually exercised rather than sampled into. Withheld earlier over two problems,
      # both now resolved: the count assertion was T7's size-class scoping breaking under
      # guarding (fixed in #133), and the "double free detected" line turned out to be
      # EXPECTED output -- test-memory-events deliberately double-frees to verify
      # mimalloc's detector no-ops before our hook runs (#131).
      - name: Suite with guarding forced on every allocation
        env:
          MIMALLOC_GUARDED_SAMPLE_RATE: "1"
        run: ctest --test-dir build-guarded --output-on-failure --timeout 900

  ctest-pprof-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=OFF && cmake --build build && ctest --test-dir build --output-on-failure

  ctest-debug-full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=ON -DMI_DEBUG_FULL=ON && cmake --build build --config Debug && ctest --test-dir build -C Debug --output-on-failure

  ctest-debug-full-win-gnu:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - run: cmake -B build -G Ninja -DMI_PPROF=ON -DMI_DEBUG_FULL=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  diagnostic-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Internal-state inventory and positive controls
        run: |
          python3 ci/check_internal_state.py
          python3 ci/check_internal_state.py --selftest
      - name: Release diagnostic/layout/data firewall and positive control
        run: python3 ci/check_release_equivalence.py --selftest
      - name: Diagnostic source and symbols are absent from release libraries
        run: |
          set -euo pipefail
          for pprof in ON OFF; do
            build="build-release-${pprof,,}"
            cmake -S . -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DMI_DEBUG=OFF -DMI_PPROF="$pprof" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            if grep -q 'diagnostic.c' "$build/compile_commands.json"; then
              echo "::error::diagnostic.c entered the MI_DEBUG=0 $pprof build"
              exit 1
            fi
            cmake --build "$build" --target mimalloc-static
            if nm -a "$build"/libmimalloc*.a | grep -q -e '_mi_.*diagnostic' -e '_mi_lock_debug'; then
              echo "::error::diagnostic symbols entered the MI_DEBUG=0 $pprof library"
              exit 1
            fi
          done

  # Shared-library build (issue #62). Our src/static.c amalgamation compiles
  # everything as one TU, which hides link errors that only appear when the library
  # is built as a real DLL/so -- conda-forge carries a patch making
  # `_mi_theap_malloc_zero` extern inline for exactly this reason on v3.4.1.
  # Runs on both Windows toolchains because that is where the reported failure was.
  #
  # #69 (MIMALLOC_MEMORY_EVENTS env activation failing in an MSVC DLL build) is
  # RESOLVED: windows-latest was confirmed green here on main (runs 33565889274,
  # 33546799862) well before #266, so the stale note this comment used to carry --
  # claiming windows-latest was a deliberate known-red diagnostic for #69 -- no longer
  # describes reality and was corrected during #266's review (it was misleading anyone
  # who saw this job red and assumed it was the old, expected #69 failure rather than a
  # new regression).
  #
  # Do NOT add continue-on-error if this job goes red again -- see the note below on why
  # a permanently-yellow job is worse than an absent one. Confirm any new failure is a
  # real regression (as #266 round 2 did for test-profile/-accum/-auto's cross-thread
  # sampled-free reclamation, fixed on this branch) before landing, per the same
  # "confirm on CI, don't guess" discipline #69 was fixed under.
  ctest-shared:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=ON -DMI_BUILD_SHARED=ON -DMI_BUILD_STATIC=OFF -DMI_BUILD_OBJECT=OFF
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  ctest-shared-win-gnu:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - run: cmake -B build -G Ninja -DMI_PPROF=ON -DMI_BUILD_SHARED=ON -DMI_BUILD_STATIC=OFF -DMI_BUILD_OBJECT=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # Memory + counter regression gate (issue #63). The test's own inline assertions are
  # self-relative and gate on every runner unconditionally. The committed baselines add
  # cross-COMMIT drift detection, which a per-run ratio cannot see: a leak introduced
  # 3% at a time over ten PRs passes every self-relative check and still doubles memory.
  #
  # Baselines are per platform AND per MI_PPROF setting, never shared: lazy zeroing makes
  # Linux RSS and Windows commit incomparable for identical behavior, and rule 4 puts the
  # profiler's own arena in process memory so an ON build legitimately peaks higher.
  memory-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=ON
      - run: cmake --build build --config Release
      - name: Run the gate
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -C Release -R test-memory-gate --output-on-failure
      - name: Emit JSON and compare against baseline
        shell: bash
        run: |
          # NOTE: GitHub invokes `bash -e`, so a plain `set -uo pipefail` does NOT
          # disable errexit -- the script would die on the gate's non-zero exit before
          # the rc check could run. `set +e` is required, not decorative.
          set +e
          set -uo pipefail
          exe=$(find build -name 'mimalloc-test-memory-gate*' -type f -perm -u+x | head -1)
          # Peak memory is noisy; the gate compares the minimum of several runs. Four
          # is what the committed baselines are built from.
          for i in 1 2 3 4; do
            MI_BENCH_JSON="result-$i.json" "$exe" > /dev/null
          done
          cat result-1.json
          python3 ci/memory_gate.py check result-*.json
          rc=$?
          if [ $rc -eq 2 ]; then
            echo "::warning::No committed baseline for this platform yet -- bootstrap it from this run's artifact."
            exit 0
          fi
          exit $rc
      # A gate that has never been observed to fire proves nothing -- it can be broken
      # for months while every run stays green. Build a deliberately leaky copy and
      # require the same comparison to catch it. This step failing means the gate above
      # is decoration, so it is a hard failure, not a warning.
      - name: Positive control -- the gate must catch an injected leak
        shell: bash
        run: |
          set -euo pipefail
          cmake -B build-leak -DMI_PPROF=ON -DMI_BENCH_INJECT_LEAK=200000
          cmake --build build-leak --config Release --target mimalloc-test-memory-gate
          exe=$(find build-leak -name 'mimalloc-test-memory-gate*' -type f -perm -u+x | head -1)
          for i in 1 2 3 4; do
            MI_BENCH_JSON="leak-$i.json" "$exe" > /dev/null || true
          done
          python3 ci/memory_gate.py control leak-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: memory-gate-${{ matrix.os }}
          path: result-*.json
          if-no-files-found: error

  ctest-win-gnu:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - run: cmake -B build -G Ninja -DMI_PPROF=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
