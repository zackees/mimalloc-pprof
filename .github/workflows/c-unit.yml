name: c-unit

# Two stages, one build per configuration (issue #307).
#
# This workflow used to be 16 jobs that each checked out, configured and REBUILT the
# library for one configuration and then ran one slice of the suite. Run 33699111919 was
# 20 jobs and 74 billed runner-minutes, most of it the same compile over and over. The
# owner's direction was blunt: "All the tests need to be created all at once, all the
# time, and then the runners need to run all the tests all at the same time, not a bunch
# of tests that rebuild the product over and over."
#
# So:
#
#   1. `build` compiles every configuration exactly once, in parallel, and uploads a
#      portable *test bundle* (`ci/bundle_tests.py`, #277 phase A) plus the
#      `ctest --show-only=json-v1` enumeration of what that tree registers.
#   2. `run-linux` downloads every Linux bundle and executes ALL of them in one wave
#      (`ci/run_test_bundle.py --bundles ... --jobs 4`), then the gates that need the
#      machine to itself. No CMake, no compiler, no build tree.
#      Its twin `run-linux-serial` runs the `RUN_SERIAL` group -- the tests that measure
#      process-wide RSS or a wall-clock deadline -- on a runner of its own, at the same
#      time. A separate VM is exclusive by construction, which is exactly the guarantee
#      "run them last, alone" gives, without adding their 8.5 min to the critical path.
#      `coverage` then requires the two halves together to account for every test.
#
# The two rules that keep this honest:
#
#   * No test may be dropped. `ci/bundle_coverage.py` compares each build job's
#     `show-only` name list against the names the run stage actually EXECUTED (from its
#     JUnit) and fails on anything missing. A bundle that silently contains fewer tests
#     than its tree registered, or a run that silently skips one, is red.
#   * Concurrency must not change what a test asserts. Tests that measure process-wide
#     RSS or a wall-clock deadline carry `RUN_SERIAL` in CMakeLists.txt; the bundler
#     lowers that to a `serial` flag and the runner holds them back and runs them alone
#     after the parallel wave. That is the mechanism for a test that passes serially and
#     fails under load -- not a retry.
#
# Windows: CLAUDE.md rule 3's native `cl` gate is preserved by name and by toolchain
# (`build-windows-native` compiles it with Microsoft's compiler, `run-windows-native`
# runs it and is still called `ctest (windows-latest)`). Everything win-gnu, and the
# cross-built MSVC-ABI comparison arms, live in `windows-bundles.yml` and are untouched.

on:
  push:
    branches: [main, v4]
  pull_request:
    # No `paths` filter (#360): every job here is a required status check on `main`, and a
    # filtered workflow never reports on a PR outside its paths, leaving that PR BLOCKED.

concurrency:
  # The macOS/Windows queue hog (#277). A superseded push's ctest result is worthless.
  group: c-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------------------
  # STAGE 1 -- every configuration, built exactly once, in parallel.
  # ------------------------------------------------------------------------------------
  #
  # `kind` says what the job produces:
  #
  #   bundle  a `ci/bundle_tests.py` test bundle + its `show-only` enumeration. The run
  #           stage executes it.
  #   lib     a static library (and, for the diagnostic rows, `compile_commands.json`).
  #           The run stage scans it; there is nothing to execute.
  #   control a full bundle that must NOT be executed -- the deliberately leaky build the
  #           memory gate's positive control needs. Same shape as windows-bundles.yml's
  #           `*-leak` rows, and for the same reason: MI_BENCH_INJECT_LEAK is a separate
  #           BUILD, so it cannot be an extra entry in another bundle's manifest.
  build:
    name: build (${{ matrix.config }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            container: ''
            python: uv run
            cmake: -DMI_PPROF=ON
            build_config: Release
            kind: bundle
          - config: pprof-off
            container: ''
            python: uv run
            cmake: -DMI_PPROF=OFF
            kind: bundle
          - config: debug-full
            container: ''
            python: uv run
            # The awkward config: 6 `cmake -P run-negative.cmake` negative controls and a
            # `cmake -E env` LD_PRELOAD wrapper, none of which is a plain argv. If the
            # bundle format can carry this one it can carry anything (#277 phase A).
            cmake: -DMI_PPROF=ON -DMI_DEBUG_FULL=ON
            build_config: Debug
            kind: bundle
          - config: guarded
            container: ''
            python: uv run
            # MI_GUARDED was documented as default-on in debug builds and had never once
            # been enabled -- two dead CMake constructs (#116). The configure output is
            # asserted below because the original bug was the flag not reaching the
            # compiler at all, which no test could have caught.
            cmake: -DCMAKE_BUILD_TYPE=Debug -DMI_PPROF=ON -DMI_GUARDED=ON
            assert_defines: MI_GUARDED=1
            kind: bundle
          - config: shared
            container: ''
            python: uv run
            # Our src/static.c amalgamation compiles everything as one TU, which hides
            # link errors that only appear when the library is a real DLL/so (#62).
            cmake: -DMI_PPROF=ON -DMI_BUILD_SHARED=ON -DMI_BUILD_STATIC=OFF -DMI_BUILD_OBJECT=OFF
            build_config: Release
            kind: bundle
          - config: gated
            container: ''
            python: uv run
            # #366: the owner gate (docs/purge-all-implementation.md §10). The WHOLE suite
            # runs under it, not just test-purge-all: every allocator entry is a gate site,
            # so every test is a test of the gate. Asserted on the resolved defines like
            # `guarded`, and for the same reason.
            cmake: -DMI_PPROF=ON -DMI_OWNER_GATE=ON
            build_config: Release
            assert_defines: MI_OWNER_GATE=1
            kind: bundle
          - config: musl
            # Bun ships musl builds (`MI_LIBC_MUSL=1`, `-ftls-model=local-dynamic`);
            # our CMake option compiled but nothing ran it, so "compiles" was not
            # evidence (#273 8a). Alpine has no `uv`, and the node the runner injects for
            # actions is the musl one, so this row drives the bundler with the container's
            # own `python3` -- every ci/ script involved is stdlib-only by design.
            container: alpine:3.20
            python: python3
            generator: -G Ninja
            cmake: -DMI_LIBC_MUSL=ON -DMI_PPROF=ON -DCMAKE_C_FLAGS=-ftls-model=local-dynamic
            kind: bundle
          - config: musl-pprof-off
            container: alpine:3.20
            python: python3
            generator: -G Ninja
            cmake: -DMI_LIBC_MUSL=ON -DMI_PPROF=OFF -DCMAKE_C_FLAGS=-ftls-model=local-dynamic
            kind: bundle
          - config: memory-gate-leak
            container: ''
            python: uv run
            # 600000, not the 200000 this job inherited. #298 made the gate's structural
            # peak deterministic with a barrier, which raised the linux baseline from
            # ~23 MB to 58.0 MB; the same injected leak therefore became a much smaller
            # *relative* signal. Measured locally, min-of-4 peak against that 58.0 MB
            # baseline: 200000 -> 82.3 MB (+42%), 400000 -> 116.3 MB (+101%),
            # 600000 -> 166.1 MB (+186%). 600000 restores roughly the margin the control
            # was documented at before (+212%), so "the gate fired" stays unambiguous
            # rather than sitting a few noisy samples above a 5% tolerance. Confirmed on
            # CI (run 33707744137): `peak_rss regressed: 156.5 MB vs baseline 58.0 MB
            # (+169.8%, allowed +5%)` -- 34x the tolerance.
            cmake: -DMI_PPROF=ON -DMI_BENCH_INJECT_LEAK=600000
            build_config: Release
            kind: control
          - config: isa-portable
            container: ''
            python: uv run
            # Distro packagers build for a generic CPU. The run stage scans the shipped
            # instruction stream rather than trusting the flag.
            cmake: -DMI_PPROF=ON -DMI_NO_OPT_ARCH=ON
            target: mimalloc-static
            kind: lib
          - config: isa-arch
            container: ''
            python: uv run
            # The positive control: a check that has never been observed to fail proves
            # nothing, so the same scanner must fire on this one.
            cmake: -DMI_PPROF=ON -DMI_OPT_ARCH=ON
            target: mimalloc-static
            kind: lib
          - config: diag-pprof-on
            container: ''
            python: uv run
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_DEBUG=OFF -DMI_PPROF=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            target: mimalloc-static
            kind: lib
          - config: diag-pprof-off
            container: ''
            python: uv run
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_DEBUG=OFF -DMI_PPROF=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            target: mimalloc-static
            kind: lib
          - config: debug3-extra
            container: ''
            python: uv run
            # #312: MI_DEBUG=3 arriving through MI_EXTRA_CPPDEFS (not the MI_DEBUG_FULL
            # option) used to leave src/diagnostic.c out of the build while atomic.h
            # still called its `_mi_lock_debug_*` hooks -- an undefined reference that
            # only a *test executable* link exposes (a static archive tolerates it),
            # hence the target. Link-only; debug-full runs the suite for this define.
            cmake: -DCMAKE_BUILD_TYPE=Debug -DMI_PPROF=ON -DMI_EXTRA_CPPDEFS=MI_DEBUG=3
            assert_defines: MI_DEBUG=3
            target: mimalloc-test-api
            kind: lib
    steps:
      # Before checkout: actions/checkout needs `git` on PATH, which alpine's base image
      # does not carry. `tar` too -- busybox's applet cannot write the gzip archive the
      # run stage unpacks with GNU tar.
      - name: Install build dependencies (alpine only)
        if: matrix.container != ''
        run: apk add --no-cache build-base cmake ninja python3 git tar
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        if: matrix.container == ''
      - name: Configure
        shell: sh
        run: |
          set -e
          # Redirect rather than pipe through `tee`: this runs under alpine's `sh`, which
          # has no `pipefail`, so a pipeline would report cmake's failure as success.
          if ! cmake -B build ${{ matrix.generator }} ${{ matrix.cmake }} > configure.log 2>&1; then
            cat configure.log
            exit 1
          fi
          cat configure.log
      - name: Prove the flag survived configure
        if: matrix.assert_defines
        shell: sh
        run: |
          set -e
          # Assert on the RESOLVED defines, not on the option that was passed in: the
          # whole point of #116 is that the flag silently did not reach the compiler.
          if ! grep -qE "Compiler defines *:.*${{ matrix.assert_defines }}" configure.log; then
            echo "::error::${{ matrix.assert_defines }} did not reach mi_defines"
            grep -i "guard\|Compiler defines" configure.log || true
            exit 1
          fi
      - name: Build
        shell: sh
        run: |
          set -e
          cmake --build build --parallel \
            ${{ matrix.build_config && format('--config {0}', matrix.build_config) || '' }} \
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Enumerate the suite this tree registers
        if: matrix.kind == 'bundle'
        shell: sh
        run: |
          set -e
          # Written from ctest itself, NOT derived from the bundle: this is the reference
          # side of the coverage comparison, so it has to come from an independent source
          # or the check would be the bundle agreeing with itself.
          ctest --test-dir build --show-only=json-v1 \
            ${{ matrix.build_config && format('-C {0}', matrix.build_config) || '' }} \
            > show-only-${{ matrix.config }}.json
      - name: Bundle the tests
        if: matrix.kind == 'bundle' || matrix.kind == 'control'
        shell: sh
        run: |
          set -e
          ${{ matrix.python }} ci/bundle_tests.py build bundle \
            ${{ matrix.build_config && format('--config {0}', matrix.build_config) || '' }}
      - name: Pack the bundle
        if: matrix.kind == 'bundle' || matrix.kind == 'control'
        # tar, not a plain artifact upload: upload-artifact@v4 drops the executable bit
        # and flattens the `libmimalloc-debug.so -> .so.3` SONAME symlink chain, either of
        # which turns the bundle into something that cannot start on the run job.
        shell: sh
        run: tar -C bundle -czf ${{ matrix.config }}.tar.gz .
      - name: Upload the bundle
        if: matrix.kind == 'bundle' || matrix.kind == 'control'
        uses: actions/upload-artifact@v4
        with:
          name: c-unit-bundle-${{ matrix.config }}
          path: |
            ${{ matrix.config }}.tar.gz
            show-only-${{ matrix.config }}.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload the library
        if: matrix.kind == 'lib'
        uses: actions/upload-artifact@v4
        with:
          name: c-unit-lib-${{ matrix.config }}
          path: |
            build/libmimalloc*.a
            build/compile_commands.json
          if-no-files-found: error
          retention-days: 1

  # Bun's `scripts/build/deps/mimalloc.ts` DirectBuild never runs our CMake, so a green
  # ctest proves nothing about whether Bun could link against this tree (#274, P9a). The
  # compile half runs here so the run stage links prebuilt objects instead of rebuilding
  # `src/static.c` -- the one thing #307 exists to stop doing.
  build-bun-objects:
    name: build-bun-objects (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: glibc
            container: ''
            python: uv run
            args: ''
          - name: musl
            container: alpine:3.20
            python: python3
            args: --musl
    steps:
      - name: Install build dependencies (alpine only)
        if: matrix.container != ''
        run: apk add --no-cache build-base git python3
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        if: matrix.container == ''
      - name: Compile the probe's objects with Bun's exact define set
        shell: sh
        run: ${{ matrix.python }} ci/check_bun_surface.py --emit-objects bun-objects ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: c-unit-bun-objects-${{ matrix.name }}
          path: bun-objects
          if-no-files-found: error
          retention-days: 1

  # THE RETAINED NATIVE MSVC GATE (#277 phase D, CLAUDE.md rule 3). Every other
  # windows-latest row in this repository is replaced by Linux-cross-built bundles that
  # windows-bundles.yml's `run-windows` executes on one shared VM. This one is not, and
  # must not become so without the owner amending rule 3 ("MSVC and win-gnu are priority
  # platforms -- both, always"): those bundles are built by clang-cl, and a clang-cl
  # binary is not a `cl` binary. clang-cl accepts `__attribute__`s cl rejects, and cl's
  # codegen, TLS lowering and DLL runtime are its own. This job is the only thing in CI
  # that compiles this tree with Microsoft's compiler; `run-windows-native` runs what it
  # produces. Do NOT add continue-on-error to either.
  #
  # #307 split it into build + run for the same reason as Linux -- the configuration is
  # compiled once and the result is what gets executed -- not to weaken it.
  build-windows-native:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: cmake -B build -DMI_PPROF=ON
      - run: cmake --build build --config Release
      - name: Enumerate the suite this tree registers
        run: ctest --test-dir build --show-only=json-v1 -C Release > show-only-windows-native.json
      - name: Bundle the tests
        # No --check-dll-closure here, unlike the cross lanes: the machine that builds
        # this bundle is the machine that runs it, so "can it load somewhere else" is not
        # the question this job answers.
        run: uv run ci/bundle_tests.py build bundle --config Release
      # #366: the owner-gate configuration, compiled by the same `cl` and run by the same
      # runner. A second tree inside this job rather than a matrix: the job names
      # `build-windows-native` / `ctest (windows-latest)` are load-bearing (CLAUDE.md rule
      # 3, branch protection), and a matrix would rename them. The gate touches every
      # allocator entry and cl's codegen/TLS lowering are its own, so "clang-cl ran the
      # gated suite" (windows-bundles.yml) does not stand in for this.
      - name: Configure and build the owner-gate tree (MI_OWNER_GATE=ON)
        run: |
          set -euo pipefail
          cmake -B build-gated -DMI_PPROF=ON -DMI_OWNER_GATE=ON | tee configure-gated.log
          if ! grep -qE "Compiler defines *:.*MI_OWNER_GATE=1" configure-gated.log; then
            echo "::error::MI_OWNER_GATE=1 did not reach mi_defines"
            exit 1
          fi
          cmake --build build-gated --config Release
      - name: Enumerate and bundle the owner-gate suite
        run: |
          set -euo pipefail
          ctest --test-dir build-gated --show-only=json-v1 -C Release > show-only-windows-native-gated.json
          uv run ci/bundle_tests.py build-gated bundle-gated --config Release
      - name: The bundle must carry the DLLs its executables load
        # `build_tests.py` copies these by glob rather than because a test names them on
        # its command line, so a layout change would drop them silently and the tests
        # would exit 0xC0000135 -- a dialog-free exit code, not a failure that says what
        # happened. windows-bundles.yml makes the same assertion for the same reason.
        run: |
          set -euo pipefail
          if grep -nE '"(/|[A-Za-z]:[\\/])' bundle/tests.json; then
            echo "::error::the bundle manifest contains an absolute path"
            exit 1
          fi
          ls bundle | grep -q '^mimalloc\.dll$'
          ls bundle | grep -q '^mimalloc-redirect\.dll$'
          uv run python -c "import json; d=json.load(open('bundle/tests.json')); print(len(d['tests']), 'tests')"
          ls bundle-gated | grep -q '^mimalloc\.dll$'
          ls bundle-gated | grep -q '^mimalloc-redirect\.dll$'
          uv run python -c "import json; d=json.load(open('bundle-gated/tests.json')); print(len(d['tests']), 'gated tests')"
      - name: Pack the bundles
        run: |
          set -euo pipefail
          tar -C bundle -czf windows-native.tar.gz .
          tar -C bundle-gated -czf windows-native-gated.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: c-unit-bundle-windows-native
          path: |
            windows-native.tar.gz
            windows-native-gated.tar.gz
            show-only-windows-native.json
            show-only-windows-native-gated.json
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------------------------
  # STAGE 2 -- every test, at once.
  # ------------------------------------------------------------------------------------
  run-linux:
    needs: [build, build-bun-objects]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: c-unit-bundle-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: c-unit-lib-*
          path: libs
      - uses: actions/download-artifact@v4
        with:
          pattern: c-unit-bun-objects-*
          path: bun-objects
      - name: Unpack the bundles
        run: |
          set -euo pipefail
          mkdir -p bundle manifests
          for archive in artifacts/*/*.tar.gz; do
            name=$(basename "$archive" .tar.gz)
            mkdir -p "bundle/$name"
            tar -C "bundle/$name" -xzf "$archive"
          done
          cp artifacts/*/show-only-*.json manifests/
          # A download that silently produced fewer bundles would otherwise surface as a
          # confusing `No such file` in the middle of a gate, or -- worse -- as a green
          # run over less.
          for expected in release pprof-off debug-full guarded shared gated musl musl-pprof-off \
                          memory-gate-leak; do
            if [ ! -d "bundle/$expected" ]; then
              echo "::error::bundle/$expected was not downloaded"
              ls bundle
              exit 1
            fi
          done
          ls bundle
          ls manifests

      # ---- the wave -------------------------------------------------------------------
      - name: Run every glibc bundle at once
        # --jobs 4 is the runner's vCPU count. Inside this one invocation bundles run
        # alongside each other AND tests run alongside each other. `--select parallel`
        # leaves the `serial` group (RUN_SERIAL in CMakeLists.txt) to `run-linux-serial`,
        # which is running on its own VM at the same moment -- exclusive by construction,
        # so those tests still measure a quiet machine.
        #
        # The guarded second pass -- every eligible allocation guarded instead of
        # 1-in-4000 -- is an env VARIANT of the guarded bundle, scoped to it. It used to
        # be a whole second serial `ctest` run of that config; here it joins the same
        # wave, and scoping matters because an unscoped variant would double all five
        # bundles including the part that does not divide by --jobs.
        run: |
          set -euo pipefail
          uv run ci/run_test_bundle.py \
            --bundles bundle/release bundle/pprof-off bundle/debug-full bundle/guarded bundle/shared bundle/gated \
            --jobs 4 --select parallel \
            --env-variant guarded:sample-rate-1 MIMALLOC_GUARDED_SAMPLE_RATE=1 \
            --junit-dir results

      - name: Run the musl bundles inside alpine
        # Verified rather than assumed: a musl-linked executable from this tree requests
        # `/lib/ld-musl-x86_64.so.1` as its program interpreter, which a glibc host does
        # not have, so it cannot be executed on the runner directly. `python3 libstdc++`
        # is the complete runtime set (checked by running the whole suite in a container
        # with nothing else installed). ci/run_test_bundle.py is stdlib-only by design,
        # which is what makes that possible.
        #
        # A separate step, so its serial group still runs with nothing else on the box.
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE":/w -w /w alpine:3.20 sh -c '
            set -e
            apk add --no-cache python3 libstdc++ > /dev/null
            python3 ci/run_test_bundle.py \
              --bundles bundle/musl bundle/musl-pprof-off \
              --jobs 4 --select parallel --junit-dir results
          '

      # ---- gates that need the machine to themselves ----------------------------------
      - name: Memory gate -- 8 runs from the release bundle
        # Peak memory is noisy; the gate compares the minimum of several runs.
        # `ci/memory_gate.py`'s RUNS_EXPECTED is 8, which is what this step runs. The
        # baseline this lane is compared against -- `linux-pprof1.json` -- is recorded
        # min-of-16 (#298/#309): deliberately a *lower* number than a min-of-8 sample of
        # the same distribution can be expected to reach, so comparing a min-of-8 run
        # against it errs toward reporting a regression rather than hiding one. (The
        # other committed baselines are not min-of-16 -- windows is min-of-8, macos
        # min-of-4 -- and are compared by their own lanes in windows-/macos-bundles.yml.) #298 also made the structural peak
        # deterministic (a barrier in test/test-memory-gate.c) and set PEAK_TOLERANCE to
        # 0.05. The run count and the CLI here are unchanged from the job this replaces:
        # this PR moves the gate, it does not retune it.
        run: |
          # NOTE: GitHub invokes `bash -e`, so a plain `set -uo pipefail` does NOT disable
          # errexit -- the script would die on the gate's non-zero exit before the rc
          # check could run. `set +e` is required, not decorative.
          set +e
          set -uo pipefail
          exe="$GITHUB_WORKSPACE/bundle/release/mimalloc-test-memory-gate"
          for i in 1 2 3 4 5 6 7 8; do
            MI_BENCH_JSON="result-$i.json" "$exe" > /dev/null
          done
          cat result-1.json
          uv run ci/memory_gate.py check result-*.json
          rc=$?
          if [ $rc -eq 2 ]; then
            echo "::warning::No committed baseline for this platform yet -- bootstrap it from this run's artifact."
            exit 0
          fi
          exit $rc
      - name: Positive control -- the gate must catch an injected leak
        # A gate that has never been observed to fire proves nothing. The leaky build is
        # a whole separate configuration, built once by the `memory-gate-leak` row; its
        # tests are never executed (they would fail by construction), only this binary.
        run: |
          set -euo pipefail
          exe="$GITHUB_WORKSPACE/bundle/memory-gate-leak/mimalloc-test-memory-gate"
          for i in 1 2 3 4 5 6 7 8; do
            MI_BENCH_JSON="leak-$i.json" "$exe" > /dev/null || true
          done
          uv run ci/memory_gate.py control leak-*.json

      - name: Diagnostic gates -- internal state, release firewall, positive controls
        run: |
          set -euo pipefail
          uv run ci/check_internal_state.py
          uv run ci/check_internal_state.py --selftest
          uv run ci/check_release_equivalence.py --selftest
      - name: Diagnostic source and symbols are absent from release libraries
        # The two `diag-*` build rows resolved MI_DEBUG=0 with MI_PPROF on and off; this
        # is the scan over what they produced.
        run: |
          set -euo pipefail
          for pprof in on off; do
            dir="libs/c-unit-lib-diag-pprof-$pprof"
            if grep -q 'diagnostic.c' "$dir/compile_commands.json"; then
              echo "::error::diagnostic.c entered the MI_DEBUG=0 $pprof build"
              exit 1
            fi
            if nm -a "$dir"/libmimalloc*.a | grep -q -e '_mi_.*diagnostic' -e '_mi_lock_debug'; then
              echo "::error::diagnostic symbols entered the MI_DEBUG=0 $pprof library"
              exit 1
            fi
          done
      - name: ISA baseline (x64) -- portable build, and the scanner's positive control
        run: |
          set -euo pipefail
          # The disassembly parser is itself a thing that can silently break (it did, on
          # arm64). Fixtures for both layouts, checked on every runner.
          uv run ci/check_isa_baseline.py --selftest
          uv run ci/check_isa_baseline.py "$(ls libs/c-unit-lib-isa-portable/libmimalloc*.a | head -1)"
          uv run ci/check_isa_baseline.py "$(ls libs/c-unit-lib-isa-arch/libmimalloc*.a | head -1)" --expect-dirty

      - name: Bun consumer surface -- link the prebuilt glibc objects
        run: uv run ci/check_bun_surface.py --objects bun-objects/c-unit-bun-objects-glibc
      - name: Bun consumer surface -- link the prebuilt musl objects inside alpine
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE":/w -w /w alpine:3.20 sh -c '
            set -e
            apk add --no-cache build-base python3 > /dev/null
            python3 ci/check_bun_surface.py --musl --objects bun-objects/c-unit-bun-objects-musl
          '

      # The coverage job needs this half's JUnit; `if: always()` so a red wave still
      # uploads what it managed to run.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c-unit-results-parallel
          path: |
            results
            result-*.json
            leak-*.json
          if-no-files-found: warn
          retention-days: 1

  # The RSS- and deadline-sensitive tests, on a runner of their own. Splitting them out
  # rather than running them last on `run-linux` costs one small VM and takes ~8.5 min off
  # the critical path, and it weakens nothing: what those tests need is a machine with
  # nothing else on it, and a separate runner is exactly that. The list itself is
  # unchanged and still lives in CMakeLists.txt as `RUN_SERIAL`.
  run-linux-serial:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: c-unit-bundle-*
          path: artifacts
      - name: Unpack the bundles
        run: |
          set -euo pipefail
          mkdir -p bundle
          for archive in artifacts/*/*.tar.gz; do
            name=$(basename "$archive" .tar.gz)
            mkdir -p "bundle/$name"
            tar -C "bundle/$name" -xzf "$archive"
          done
          for expected in release pprof-off debug-full guarded shared gated musl musl-pprof-off; do
            if [ ! -d "bundle/$expected" ]; then
              echo "::error::bundle/$expected was not downloaded"
              ls bundle
              exit 1
            fi
          done
      - name: Run the serial group, one test at a time
        # --jobs 1 is belt and braces: a `serial` item is run alone regardless.
        run: |
          set -euo pipefail
          uv run ci/run_test_bundle.py \
            --bundles bundle/release bundle/pprof-off bundle/debug-full bundle/guarded bundle/shared bundle/gated \
            --jobs 1 --select serial \
            --env-variant guarded:sample-rate-1 MIMALLOC_GUARDED_SAMPLE_RATE=1 \
            --junit-dir results
      - name: Run the musl serial group inside alpine
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE":/w -w /w alpine:3.20 sh -c '
            set -e
            apk add --no-cache python3 libstdc++ > /dev/null
            python3 ci/run_test_bundle.py \
              --bundles bundle/musl bundle/musl-pprof-off \
              --jobs 1 --select serial --junit-dir results
          '
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c-unit-results-serial
          path: results
          if-no-files-found: warn
          retention-days: 1

  # ---- no test may be dropped ---------------------------------------------------------
  # The replacement for `bundle-roundtrip`. That job proved a bundle reproduces its tree's
  # own ctest run by moving the build tree away first; here there IS no build tree on the
  # machines that ran the tests, so the RPATH escape hatch it guarded against cannot exist.
  # What is left to prove is the coverage half: for every configuration, each name
  # `ctest --show-only` listed in the build job was executed -- by one half of the run
  # stage or the other. The reference side comes from ctest, the candidate side from the
  # JUnit the runs wrote; neither is derived from the other.
  #
  # It is its own job because the two halves finish on two different runners. Splitting the
  # run stage without this would have left each half able to report green on its own share,
  # which is precisely the "gate that verifies less" shape docs/ci-gates.md exists to stop.
  coverage:
    needs: [run-linux, run-linux-serial]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: c-unit-bundle-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: c-unit-results-parallel
          path: parallel
      - uses: actions/download-artifact@v4
        with:
          name: c-unit-results-serial
          path: serial
      - name: Merge the two halves per configuration
        run: |
          set -euo pipefail
          mkdir -p manifests executed
          cp artifacts/*/show-only-*.json manifests/
          # `find`, not a fixed path: download-artifact strips the common root, so an
          # artifact uploaded with one `path:` lands as `<dest>/<file>` while one uploaded
          # with several lands as `<dest>/results/<file>`. Locating the file makes this
          # step independent of that, and a missing half is a named error rather than a
          # bare `cp: No such file`.
          for config in release pprof-off debug-full guarded shared gated musl musl-pprof-off; do
            mkdir -p "executed/$config"
            for half in parallel serial; do
              found=$(find "$half" -type f -name "$config.xml" | head -1)
              if [ -z "$found" ]; then
                echo "::error::the $half half produced no JUnit for $config"
                find "$half" -type f | head -20
                exit 1
              fi
              cp "$found" "executed/$config/$half.xml"
            done
          done
          ls -R executed | head -40
      - name: Every registered test was really executed
        # `ci/bundle_coverage.py` reads a directory as the union of the files in it, so
        # each configuration is compared against both halves at once.
        run: |
          set -euo pipefail
          uv run ci/bundle_coverage.py \
            --compare release manifests/show-only-release.json executed/release \
            --compare pprof-off manifests/show-only-pprof-off.json executed/pprof-off \
            --compare debug-full manifests/show-only-debug-full.json executed/debug-full \
            --compare guarded manifests/show-only-guarded.json executed/guarded \
            --compare shared manifests/show-only-shared.json executed/shared \
            --compare gated manifests/show-only-gated.json executed/gated \
            --compare musl manifests/show-only-musl.json executed/musl \
            --compare musl-pprof-off manifests/show-only-musl-pprof-off.json executed/musl-pprof-off \
            --heading "Coverage: registered by ctest vs executed by the run stage" \
            --names "ctest --show-only" executed \
            --summary "$GITHUB_STEP_SUMMARY"

  # The name is load-bearing: CLAUDE.md rule 3, docs/ci-gates.md and #277/#298 all refer
  # to `ctest (windows-latest)`. It still means the same thing -- Microsoft's `cl`
  # compiled this tree and this runner executed the result -- and it is still a hard gate.
  run-windows-native:
    name: ctest (windows-latest)
    needs: build-windows-native
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/download-artifact@v4
        with:
          name: c-unit-bundle-windows-native
          path: artifacts
      - name: Unpack the bundles
        run: |
          set -euo pipefail
          mkdir -p bundle/windows-native bundle/windows-native-gated
          tar -C bundle/windows-native -xzf artifacts/windows-native.tar.gz
          tar -C bundle/windows-native-gated -xzf artifacts/windows-native-gated.tar.gz
          ls bundle/windows-native | head -40
      - name: Run the suite
        run: uv run ci/run_test_bundle.py --bundles bundle/windows-native --jobs 4 --junit-dir results
      - name: Run the owner-gate suite (#366)
        # Its own step, after the default suite: test-purge-all's G2 bound and the RSS tests
        # are RUN_SERIAL either way, and the report for "the gate broke X" should not be
        # interleaved with the default configuration's.
        run: uv run ci/run_test_bundle.py --bundles bundle/windows-native-gated --jobs 4 --junit-dir results
      - name: Coverage -- every registered test was really executed
        run: |
          set -euo pipefail
          uv run ci/bundle_coverage.py \
            --compare windows-native artifacts/show-only-windows-native.json results/windows-native.xml \
            --compare windows-native-gated artifacts/show-only-windows-native-gated.json results/windows-native-gated.xml \
            --heading "Coverage: registered by native cl ctest vs executed" \
            --names "ctest --show-only" executed \
            --summary "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c-unit-windows-native-results
          path: results
          if-no-files-found: warn
          retention-days: 1

  # #366: the default build's fast path must be byte-identical to the base revision
  # (docs/purge-all-implementation.md §10). A self-contained job like isa-baseline-arm64
  # below, because it needs a compiler: it builds `mimalloc-static` three times (base
  # default, HEAD default, HEAD gated) and diffs the address-normalised disassembly of
  # mi_malloc / mi_zalloc / mi_free / mi_heap_malloc_small / mi_malloc_small. The third
  # build is the positive control -- the gate MUST change those bytes -- so a normaliser
  # that had gone blind fails here rather than reporting "identical" forever.
  fastpath-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # the base revision must be reachable for the worktree the script builds
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - name: Normaliser and slicer self-test
        run: uv run ci/check_fastpath_identity.py --selftest
      - name: Default build byte-identical to the base; gated build differs
        # On a PR the base is the PR's base commit; on a push to main it is the previous
        # main (the merge commit's first parent).
        run: uv run ci/check_fastpath_identity.py --base "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"

  # Debian's arm64 baseline is armv8.0-a and CMakeLists.txt force-enables MI_OPT_ARCH on
  # arm64, so this is the case that actually bites. It stays a self-contained build+scan
  # job rather than joining the build/run split: the scan disassembles the library, and
  # the host's objdump is single-target -- an x86_64 runner cannot disassemble aarch64, so
  # there is no run stage to hand this artifact to. macOS is deliberately NOT covered
  # here: Apple Silicon is the baseline there, so LSE atomics are expected and a "clean"
  # result would mean nothing.
  isa-baseline-arm64:
    name: isa-baseline (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Disassembly parser selftest
        run: uv run ci/check_isa_baseline.py --selftest
      - name: Portable build must contain no above-baseline instructions
        run: |
          set -euo pipefail
          cmake -B build-portable -DMI_PPROF=ON -DMI_NO_OPT_ARCH=ON
          cmake --build build-portable --target mimalloc-static
          uv run ci/check_isa_baseline.py "$(ls build-portable/libmimalloc*.a | head -1)"
      - name: Positive control -- scanner must fire on an MI_OPT_ARCH=ON build
        run: |
          set -euo pipefail
          cmake -B build-arch -DMI_PPROF=ON -DMI_OPT_ARCH=ON
          cmake --build build-arch --target mimalloc-static
          uv run ci/check_isa_baseline.py "$(ls build-arch/libmimalloc*.a | head -1)" --expect-dirty
