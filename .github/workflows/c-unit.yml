name: c-unit

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - '.github/workflows/c-unit.yml'

jobs:
  ctest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  ctest-pprof-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=OFF && cmake --build build && ctest --test-dir build --output-on-failure

  ctest-debug-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_DEBUG_FULL=ON && cmake --build build && ctest --test-dir build --output-on-failure

  # TEMPORARY (debug/v3-stress-heaps): does STOCK upstream/dev3 also segfault in
  # test-stress-heaps under the same MinGW/GCC-16 toolchain? This isolates whether the
  # failure belongs to the fork's port or to upstream. Not for merge.
  upstream-dev3-control:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja git
      - name: build and run STOCK upstream/dev3
        run: |
          set +e
          gcc --version | head -1
          git clone --no-checkout https://github.com/microsoft/mimalloc.git stock
          cd stock
          git fetch origin 579f8c0e93a0468a20dd20fac861bc3580b1735e --depth 1
          git checkout 579f8c0e93a0468a20dd20fac861bc3580b1735e
          echo "=== stock dev3 HEAD: $(git rev-parse HEAD) ==="
          cmake -B build -G Ninja
          cmake --build build
          fails=0
          for i in 1 2 3 4 5 6; do
            ./build/mimalloc-test-stress-heaps.exe > out-$i.log 2>&1
            code=$?
            echo "STOCK attempt $i exit=$code"
            if [ $code -ne 0 ]; then fails=$((fails+1)); tail -5 out-$i.log; fi
          done
          echo "=========================================="
          echo "STOCK upstream/dev3 test-stress-heaps: $fails failures / 6 runs"
          echo "=========================================="

  ctest-win-gnu:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-gdb
      # Keep the EXACT failing configuration (no CMAKE_BUILD_TYPE, as in the real job)
      # and only add -g, so debugging does not change what is being debugged.
      - run: cmake -B build -G Ninja -DMI_PPROF=ON -DCMAKE_C_FLAGS=-g
      - run: cmake --build build
      # TEMPORARY (debug/v3-stress-heaps): capture a backtrace for the win-gnu-only
      # test-stress-heaps segfault. Not for merge.
      - name: stress-heaps under gdb
        # NOTE: the msys2 shell runs with -e, so every failing command must be
        # guarded or the step dies before printing anything.
        run: |
          set +e
          which gdb; gdb --version | head -1
          for i in 1 2 3 4 5 6; do
            echo "=========== ATTEMPT $i ==========="
            gdb -batch -ex run -ex "thread apply all bt" --args ./build/mimalloc-test-stress-heaps.exe > gdb-$i.log 2>&1
            echo "gdb exit=$?"
            if grep -qiE "SIGSEGV|Segmentation|access violation|unknown target exception|Assertion" gdb-$i.log; then
              echo "!!!!!!! CRASH REPRODUCED on attempt $i !!!!!!!"
              cat gdb-$i.log
              exit 1
            fi
            echo "--- tail of attempt $i ---"
            tail -20 gdb-$i.log
          done
          echo "no crash in 6 attempts"
      - run: ctest --test-dir build --output-on-failure
