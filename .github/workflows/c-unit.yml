name: c-unit

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'ci/**'
      - '.github/workflows/c-unit.yml'

jobs:
  ctest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  # Distro packagers build for a generic CPU. Verify a MI_NO_OPT_ARCH=ON build really
  # is baseline-clean, by scanning the shipped instruction stream rather than trusting
  # the flags.
  #
  # Runners are both Linux on purpose: x64 covers the x86-64-v1 baseline, and
  # ubuntu-24.04-arm covers Debian's armv8.0-a arm64 baseline -- the case that actually
  # bites, since CMakeLists.txt force-enables MI_OPT_ARCH on arm64. macOS is NOT used
  # here: Apple Silicon is the baseline on that platform, so LSE atomics are expected
  # there and a "clean" result would mean nothing.
  isa-baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The disassembly parser is itself a thing that can silently break (it did, on
      # arm64). Fixtures for both layouts, checked on every runner.
      - name: Disassembly parser selftest
        run: python3 ci/check_isa_baseline.py --selftest
      - name: Portable build must contain no above-baseline instructions
        run: |
          cmake -B build-portable -DMI_PPROF=ON -DMI_NO_OPT_ARCH=ON
          cmake --build build-portable --target mimalloc-static
          python3 ci/check_isa_baseline.py "$(ls build-portable/libmimalloc*.a | head -1)"
      # A check that has never been observed to fail proves nothing. Build with the
      # optimizations deliberately on and require the same scanner to catch it.
      - name: Positive control -- scanner must fire on an MI_OPT_ARCH=ON build
        run: |
          cmake -B build-arch -DMI_PPROF=ON -DMI_OPT_ARCH=ON
          cmake --build build-arch --target mimalloc-static
          python3 ci/check_isa_baseline.py "$(ls build-arch/libmimalloc*.a | head -1)" --expect-dirty
      - name: Upload portable library
        uses: actions/upload-artifact@v4
        with:
          name: mimalloc-portable-${{ matrix.os }}
          path: build-portable/libmimalloc*.a

  ctest-pprof-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=OFF && cmake --build build && ctest --test-dir build --output-on-failure

  ctest-debug-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_DEBUG_FULL=ON && cmake --build build && ctest --test-dir build --output-on-failure

  # Shared-library build (issue #62). Our src/static.c amalgamation compiles
  # everything as one TU, which hides link errors that only appear when the library
  # is built as a real DLL/so -- conda-forge carries a patch making
  # `_mi_theap_malloc_zero` extern inline for exactly this reason on v3.4.1.
  # Runs on both Windows toolchains because that is where the reported failure was.
  #
  # MSVC-shared (windows-latest) is deliberately NOT in this matrix yet: it found a real
  # bug -- MIMALLOC_MEMORY_EVENTS env activation fails in an MSVC DLL build, tracked in
  # issue #69 -- and adding it red, or with continue-on-error, is how a gate becomes
  # decoration. It goes in with the fix. win-gnu shared runs below and is green.
  ctest-shared:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=ON -DMI_BUILD_SHARED=ON -DMI_BUILD_STATIC=OFF -DMI_BUILD_OBJECT=OFF
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      # DIAGNOSTIC (#69): ctest reported the env-activation test as Failed with no output
      # at all, despite --output-on-failure, so the five distinct stderr messages the test
      # emits never reached the log. Run the binary directly and print everything, so the
      # exit code alone tells us which branch fired.
      - name: "#69 diagnostic: run the env-activation check directly"
        if: always()
        shell: bash
        run: |
          set +e
          exe=$(find build -name 'mimalloc-test-memory-events*' -type f | grep -iE '\.exe$|memory-events$' | head -1)
          echo "binary: $exe"
          echo "--- does the shell itself export it? ---"
          export MIMALLOC_MEMORY_EVENTS=1
          env | grep -i mimalloc || echo "(nothing in env)"
          echo "--- exported, run via bash ---"
          "$exe" --env-enabled-check
          echo "exit code: $?  (1=env not set  2=alloc failed  3=tracking not enabled  4=second alloc failed  5=callback did not fire)"
          echo "--- run via cmd.exe, which sets the variable itself ---"
          cmd //c "set MIMALLOC_MEMORY_EVENTS=1 && $(cygpath -w "$exe") --env-enabled-check"
          echo "exit code: $?"

  ctest-shared-win-gnu:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - run: cmake -B build -G Ninja -DMI_PPROF=ON -DMI_BUILD_SHARED=ON -DMI_BUILD_STATIC=OFF -DMI_BUILD_OBJECT=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # Memory + counter regression gate (issue #63). The test's own inline assertions are
  # self-relative and gate on every runner unconditionally. The committed baselines add
  # cross-COMMIT drift detection, which a per-run ratio cannot see: a leak introduced
  # 3% at a time over ten PRs passes every self-relative check and still doubles memory.
  #
  # Baselines are per platform AND per MI_PPROF setting, never shared: lazy zeroing makes
  # Linux RSS and Windows commit incomparable for identical behavior, and rule 4 puts the
  # profiler's own arena in process memory so an ON build legitimately peaks higher.
  memory-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DMI_PPROF=ON
      - run: cmake --build build --config Release
      - name: Run the gate
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -C Release -R test-memory-gate --output-on-failure
      - name: Emit JSON and compare against baseline
        shell: bash
        run: |
          # NOTE: GitHub invokes `bash -e`, so a plain `set -uo pipefail` does NOT
          # disable errexit -- the script would die on the gate's non-zero exit before
          # the rc check could run. `set +e` is required, not decorative.
          set +e
          set -uo pipefail
          exe=$(find build -name 'mimalloc-test-memory-gate*' -type f -perm -u+x | head -1)
          # Peak memory is noisy; the gate compares the minimum of several runs. Four
          # is what the committed baselines are built from.
          for i in 1 2 3 4; do
            MI_BENCH_JSON="result-$i.json" "$exe" > /dev/null
          done
          cat result-1.json
          python3 ci/memory_gate.py check result-*.json
          rc=$?
          if [ $rc -eq 2 ]; then
            echo "::warning::No committed baseline for this platform yet -- bootstrap it from this run's artifact."
            exit 0
          fi
          exit $rc
      # A gate that has never been observed to fire proves nothing -- it can be broken
      # for months while every run stays green. Build a deliberately leaky copy and
      # require the same comparison to catch it. This step failing means the gate above
      # is decoration, so it is a hard failure, not a warning.
      - name: Positive control -- the gate must catch an injected leak
        shell: bash
        run: |
          set -euo pipefail
          cmake -B build-leak -DMI_PPROF=ON -DMI_BENCH_INJECT_LEAK=200000
          cmake --build build-leak --config Release --target mimalloc-test-memory-gate
          exe=$(find build-leak -name 'mimalloc-test-memory-gate*' -type f -perm -u+x | head -1)
          for i in 1 2 3 4; do
            MI_BENCH_JSON="leak-$i.json" "$exe" > /dev/null || true
          done
          python3 ci/memory_gate.py control leak-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: memory-gate-${{ matrix.os }}
          path: result-*.json
          if-no-files-found: error

  ctest-win-gnu:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - run: cmake -B build -G Ninja -DMI_PPROF=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
