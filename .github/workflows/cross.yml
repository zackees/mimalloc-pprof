name: cross

env:
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

on:
  pull_request:
    paths:
      - src/**
      - include/**
      - rust/**
      - .github/workflows/cross.yml
  push:
    branches: [main, v4]
    paths:
      - src/**
      - include/**
      - rust/**
      - .github/workflows/cross.yml

concurrency:
  # Measured ~4 h / ~5.5 h queue waits on the Apple rows (#277).
  group: cross-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      # The profiler walks frame pointers on non-Windows platforms.  Keep both
      # the Rust callers and the bundled C allocator unwindable in release.
      RUSTFLAGS: -Cforce-frame-pointers=yes
      CFLAGS: -fno-omit-frame-pointer
      CXXFLAGS: -fno-omit-frame-pointer
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # Plain cargo, not `soldr cargo`: see the comment on cmd= in build-cross.
            command: cargo test -p mimalloc-pprof --no-run
            cflags: ""
          - target: aarch64-unknown-linux-gnu
            command: soldr cargo zigbuild -p mimalloc-pprof --tests
            cflags: -Wno-error=date-time
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
          build-cache-mode: full
      - name: Build test binaries through Soldr
        env:
          TARGET: ${{ matrix.target }}
          BUILD_COMMAND: ${{ matrix.command }}
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.cflags }}
        run: |
          # pipefail is NOT on by default in GitHub's `bash -e` shell, so without it
          # this pipeline reports jq's exit status and a FAILED cargo build looks green.
          # Not hypothetical: a soldr compile-cache race (soldr#1969) killed four test
          # binaries, this step passed, a partial dist/ was uploaded, and the downstream
          # job failed with a bare `test -n "$generator"` and no output at all.
          set -euo pipefail
          # soldr#1969: an intermediate can be reclaimed while a slow link is still
          # reading it, killing individual test binaries. The tool's own advice is to
          # retry, and to bypass the cache if that fails -- reruns alone do NOT help,
          # because the restored cache carries the same poisoned entry back in.
          # Keep the raw JSON. Piping cargo straight into jq discards every
          # `compiler-message` record, which is where the actual error text lives -- so a
          # failing build printed only "could not compile (test ...)" with no reason, on
          # every retry. Render the diagnostics on failure instead of dropping them.
          run_build() {
            local rc=0
            eval "$1 --target $TARGET --release --message-format=json" > cargo.json || rc=$?
            jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' cargo.json > bins.txt
            if [ "$rc" -ne 0 ]; then
              jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' cargo.json >&2
            fi
            return "$rc"
          }
          cmd="$BUILD_COMMAND"
          if ! run_build "$cmd"; then
            echo "::warning::build failed; retrying with the soldr compile cache bypassed (soldr#1969)"
            run_build "${cmd/soldr/soldr --no-cache}"
          fi
          test -s bins.txt
          mkdir -p "dist/$TARGET"
          xargs -r -a bins.txt -I{} cp {} "dist/$TARGET/"
          # The downstream test job needs t3_stats specifically. Assert it here, next to
          # the compiler output, instead of letting the consumer fail without saying why.
          if ! ls "dist/$TARGET"/t3_stats-* >/dev/null 2>&1; then
            echo "::error::t3_stats was not built for $TARGET. Staged binaries:"
            ls -1 "dist/$TARGET" || echo "  (none)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: test-bins-${{ matrix.target }}
          path: rust/dist/${{ matrix.target }}
          if-no-files-found: error

  build-cross:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-unknown-linux-musl
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
          build-cache-mode: full
      - name: Prepare blessed cross toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: soldr prepare --target "$TARGET" --github-env "$GITHUB_ENV"
      - name: Add the musl target to the pinned toolchain (#273 8a)
        # rust-toolchain.toml's `targets` list does not carry x86_64-unknown-linux-musl
        # (it would then be fetched for every contributor, not just this CI job), and
        # `soldr prepare --target x86_64-unknown-linux-musl` provisions the musl-gcc
        # cross toolchain and its env vars but does NOT itself add the target to the
        # pinned rustc's sysroot -- confirmed locally: without this step, `cargo build
        # --target x86_64-unknown-linux-musl` fails E0463 "can't find crate for `core`"
        # even right after a successful `soldr prepare`.
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: soldr rustup target add x86_64-unknown-linux-musl
      - name: Keep the Apple + musl builds unwindable (frame pointers)
        # #277 §4: build-linux sets RUSTFLAGS/CFLAGS at job level and this job set
        # neither, so the Apple test binaries were built without frame pointers while the
        # profiler walks frame pointers on every non-Windows platform. Copying
        # build-linux's job-level `env:` here would be dead -- `soldr prepare` has already
        # exported CARGO_ENCODED_RUSTFLAGS (which cargo lets shadow RUSTFLAGS entirely)
        # and CFLAGS_<triple> (which cc-rs prefers over plain CFLAGS) -- so both are
        # appended to. Apple and musl targets only: the profiler does not walk frame
        # pointers on Windows, and whether clang-cl accepts the flag is a #277 phase D
        # question. musl needs the same treatment as Apple here (#273 8a): `soldr
        # prepare` exports CARGO_ENCODED_RUSTFLAGS and a musl-triple CFLAGS_* of its own
        # (the `--sysroot=...` needed to find musl's headers), both of which would
        # otherwise silently drop frame pointers the same way the Apple rows did.
        #
        # Kept in step with macos-bundles.yml's build-rust-apple: while the Apple rows
        # below are the informational control arm for #277 phase B, both arms must build
        # the same way or a divergence has two possible causes instead of one.
        if: contains(matrix.target, 'apple-darwin') || contains(matrix.target, 'linux-musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          under="${TARGET//-/_}"
          eval "existing=\${CFLAGS_${under}:-}"
          echo "CFLAGS_${under}=${existing} -fno-omit-frame-pointer" >> "$GITHUB_ENV"
          if [ -n "${CARGO_ENCODED_RUSTFLAGS:-}" ]; then
            printf 'CARGO_ENCODED_RUSTFLAGS=%s\037-Cforce-frame-pointers=yes\n' \
              "$CARGO_ENCODED_RUSTFLAGS" >> "$GITHUB_ENV"
          else
            echo 'CARGO_ENCODED_RUSTFLAGS=-Cforce-frame-pointers=yes' >> "$GITHUB_ENV"
          fi
      - name: The frame-pointer flags must actually be in the build's environment
        # A flag that never reaches the compiler is this repository's most-repeated CI bug
        # (MI_GUARDED, docs/ci-gates.md). Assert on the environment the next step runs
        # with, not on what the previous step intended to write.
        if: contains(matrix.target, 'apple-darwin') || contains(matrix.target, 'linux-musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          eval "cflags=\${CFLAGS_${TARGET//-/_}:-}"
          case "$cflags" in *-fno-omit-frame-pointer*) ;; *)
            echo "::error::CFLAGS_${TARGET//-/_} lost -fno-omit-frame-pointer: '$cflags'"; exit 1;; esac
          case "${CARGO_ENCODED_RUSTFLAGS:-}" in *force-frame-pointers*) ;; *)
            echo "::error::CARGO_ENCODED_RUSTFLAGS lost -Cforce-frame-pointers"; exit 1;; esac
      - name: Build test binaries through Soldr
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # pipefail is NOT on by default in GitHub's `bash -e` shell, so without it
          # this pipeline reports jq's exit status and a FAILED cargo build looks green.
          # Not hypothetical: a soldr compile-cache race (soldr#1969) killed four test
          # binaries, this step passed, a partial dist/ was uploaded, and the downstream
          # job failed with a bare `test -n "$generator"` and no output at all.
          set -euo pipefail
          # soldr#1969: an intermediate can be reclaimed while a slow link is still
          # reading it, killing individual test binaries. The tool's own advice is to
          # retry, and to bypass the cache if that fails -- reruns alone do NOT help,
          # because the restored cache carries the same poisoned entry back in.
          # Keep the raw JSON. Piping cargo straight into jq discards every
          # `compiler-message` record, which is where the actual error text lives -- so a
          # failing build printed only "could not compile (test ...)" with no reason, on
          # every retry. Render the diagnostics on failure instead of dropping them.
          run_build() {
            local rc=0
            eval "$1 --target $TARGET --release --message-format=json" > cargo.json || rc=$?
            jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' cargo.json > bins.txt
            if [ "$rc" -ne 0 ]; then
              jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' cargo.json >&2
            fi
            return "$rc"
          }
          # Plain `cargo`, NOT `soldr cargo`. setup-soldr still provisions the
          # toolchain above; only the build wrapper is dropped.
          #
          # Every `soldr cargo test --no-run` target has been failing to link since
          # ~23:10 with `undefined reference to mi_prof_is_enabled` and friends, while
          # the two targets that do NOT use it (aarch64-linux via zigbuild, and the
          # MinGW job) keep passing. build.rs defines MI_PPROF=1 unconditionally and the
          # vendored amalgamation contains every missing symbol, so the C is right and
          # something in the wrapper is dropping it.
          #
          # Already tested and disproved: build-cache:false, linker:platform-default,
          # and cache:false (the action's own "skip zccache wrapping entirely" switch).
          cmd="cargo test -p mimalloc-pprof --no-run"
          if ! run_build "$cmd"; then
            echo "::warning::build failed; retrying with the soldr compile cache bypassed (soldr#1969)"
            run_build "${cmd/soldr/soldr --no-cache}"
          fi
          test -s bins.txt
          mkdir -p "dist/$TARGET"
          xargs -r -a bins.txt -I{} cp {} "dist/$TARGET/"
          # The downstream test job needs t3_stats specifically. Assert it here, next to
          # the compiler output, instead of letting the consumer fail without saying why.
          if ! ls "dist/$TARGET"/t3_stats-* >/dev/null 2>&1; then
            echo "::error::t3_stats was not built for $TARGET. Staged binaries:"
            ls -1 "dist/$TARGET" || echo "  (none)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: test-bins-${{ matrix.target }}
          path: rust/dist/${{ matrix.target }}
          if-no-files-found: error

  build-win-gnu:
    name: build (x86_64-pc-windows-gnu)
    runs-on: windows-latest
    # TODO(#277 phase C, added 2026-09-02): DELETE this job -- and the
    # x86_64-pc-windows-gnu row of test-binaries below -- after ten pushes have compared
    # them against windows-bundles.yml's `build-rust (x86_64-pc-windows-gnu)` +
    # `run-windows`, which build the same test binaries on ubuntu-latest through
    # soldr's Linux-hosted mingw-w64 and run them on the shared Windows VM. Informational
    # until then. A permanently-yellow job is worse than an absent one.
    continue-on-error: true
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
        with:
          # The embedded cache expects MSVC-style .pdb outputs even though this
          # target is GNU, then fails while materializing files that do not exist.
          # Keep Soldr's managed MinGW toolchain but bypass zccache for this job.
          cache: false
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
      - name: Prepare managed MinGW through Soldr
        shell: pwsh
        run: soldr prepare --target x86_64-pc-windows-gnu --github-env $env:GITHUB_ENV
      - name: Build test binaries through Soldr
        shell: pwsh
        run: |
          $metadata = Join-Path $PWD 'bins.jsonl'
          soldr --no-cache cargo test -p mimalloc-pprof --no-run --target x86_64-pc-windows-gnu --release --message-format=json | Tee-Object -FilePath $metadata
          if ($LASTEXITCODE -ne 0) { throw 'Soldr test build failed' }
          $bins = Get-Content $metadata | ForEach-Object {
            try { $_ | ConvertFrom-Json } catch { $null }
          } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable } | ForEach-Object executable
          if (-not $bins) { throw 'No test executables were produced' }
          $dist = Join-Path $PWD 'dist/x86_64-pc-windows-gnu'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $bins | ForEach-Object { Copy-Item $_ -Destination $dist }
      - uses: actions/upload-artifact@v4
        with:
          name: test-bins-x86_64-pc-windows-gnu
          path: rust/dist/x86_64-pc-windows-gnu
          if-no-files-found: error

  test-binaries:
    name: test (${{ matrix.target }})
    needs: [build-linux, build-cross, build-win-gnu]
    runs-on: ${{ matrix.runner }}
    # The two apple-darwin rows are GONE (#277 phase B2). Nothing Apple is executed on a
    # native macOS runner anywhere in this repository any more: the x86_64 test binaries
    # `build-cross` still stages are executed by macos-bundles.yml's `run-macos-x64-recovery`
    # inside a dockurr/macos guest on a Linux runner, and aarch64 is compile-only. The
    # rows that used to be here measured 8-14 s of execution behind up to 5h26m / 6h13m of
    # queue wait.
    #
    # TODO(#277 phase C, added 2026-09-02): DELETE the x86_64-pc-windows-gnu row -- and
    # `build-win-gnu` above -- after ten pushes have compared them against
    # windows-bundles.yml's `build-rust (x86_64-pc-windows-gnu)` + `run-windows`, which
    # build the same binaries on ubuntu-latest through soldr's Linux-hosted mingw-w64 and
    # run them on the shared Windows VM. Informational until then.
    #
    # TODO(#277 phase D, added 2026-09-02): DELETE the x86_64-pc-windows-msvc row on the
    # same terms, against windows-bundles.yml's `build-rust (x86_64-pc-windows-msvc)` +
    # `run-windows`. That job builds the WHOLE workspace (not just `-p mimalloc-pprof`),
    # because it also stands in for rust-native.yml's `test (windows-latest)`. NOTE:
    # `build-cross`'s x86_64-pc-windows-msvc row above must go with it, but
    # aarch64-pc-windows-msvc must NOT -- that one is build-only and has no runner.
    # A permanently-yellow job is worse than an absent one.
    continue-on-error: ${{ matrix.target == 'x86_64-pc-windows-gnu' || matrix.target == 'x86_64-pc-windows-msvc' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            pprof: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            pprof: false
          # #273 8a: the musl test binaries are statically linked (verified locally),
          # so they run directly on the glibc ubuntu-latest runner with no musl runtime
          # installed -- no separate execution environment needed.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            pprof: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            pprof: true
          - target: x86_64-pc-windows-gnu
            runner: windows-latest
            pprof: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-bins-${{ matrix.target }}
          path: dist/${{ matrix.target }}
      - name: Run every staged test binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/${{ matrix.target }}/*
          for test_binary in dist/${{ matrix.target }}/*; do
            "$test_binary" --test-threads=4
          done
      - name: Run every staged test binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist/${{ matrix.target }} | ForEach-Object {
            & $_.FullName --test-threads=4
            if ($LASTEXITCODE -ne 0) { throw "test failed: $($_.Name)" }
          }
      - uses: actions/setup-go@v5
        if: matrix.pprof
        with:
          go-version: stable
      - name: Install pprof
        if: matrix.pprof
        run: go install github.com/google/pprof@latest
      - name: Prove pprof parses a native dump
        if: matrix.pprof && runner.os != 'Windows'
        shell: bash
        run: |
          generator=$(find dist/${{ matrix.target }} -maxdepth 1 -type f -name 't3_stats-*' | head -n 1)
          test -n "$generator"
          MIMALLOC_PPROF_CI_DUMP="$PWD/heap.prof" "$generator"
          "$(go env GOPATH)/bin/pprof" -raw heap.prof > raw.txt
          grep -Eq 'PeriodType: space|heap_v2|inuse_space' raw.txt
      - name: Prove pprof parses a native dump
        if: matrix.pprof && runner.os == 'Windows'
        shell: pwsh
        run: |
          $generator = Get-ChildItem dist/${{ matrix.target }} -Filter 't3_stats-*' | Select-Object -First 1
          if (-not $generator) { throw 't3_stats test binary was not staged' }
          $env:MIMALLOC_PPROF_CI_DUMP = Join-Path $PWD 'heap.prof'
          & $generator.FullName
          if ($LASTEXITCODE -ne 0) { throw 'profile generator failed' }
          & (Join-Path (go env GOPATH) 'bin/pprof.exe') -raw heap.prof | Tee-Object raw.txt
          if ($LASTEXITCODE -ne 0) { throw 'pprof could not parse heap.prof' }
          if (-not (Select-String -Path raw.txt -Pattern 'PeriodType: space|heap_v2|inuse_space')) { throw 'pprof output did not contain a heap profile' }
      - name: Prove pprof parses a proto dump
        if: matrix.pprof && runner.os != 'Windows'
        shell: bash
        run: |
          generator=$(find dist/${{ matrix.target }} -maxdepth 1 -type f -name 't12_proto-*' | head -n 1)
          test -n "$generator"
          MIMALLOC_PROF_PROTO_PATH="$PWD/heap.pb" "$generator"
          "$(go env GOPATH)/bin/pprof" -raw heap.pb > raw-pb.txt
          grep -Eq 'inuse_space|alloc_space' raw-pb.txt
      - name: Prove pprof parses a proto dump
        if: matrix.pprof && runner.os == 'Windows'
        shell: pwsh
        run: |
          $generator = Get-ChildItem dist/${{ matrix.target }} -Filter 't12_proto-*' | Select-Object -First 1
          if (-not $generator) { throw 't12_proto test binary was not staged' }
          $env:MIMALLOC_PROF_PROTO_PATH = Join-Path $PWD 'heap.pb'
          & $generator.FullName
          if ($LASTEXITCODE -ne 0) { throw 'proto profile generator failed' }
          & (Join-Path (go env GOPATH) 'bin/pprof.exe') -raw heap.pb | Tee-Object raw-pb.txt
          if ($LASTEXITCODE -ne 0) { throw 'pprof could not parse heap.pb' }
          if (-not (Select-String -Path raw-pb.txt -Pattern 'inuse_space|alloc_space')) { throw 'pprof output did not contain heap sample types' }
