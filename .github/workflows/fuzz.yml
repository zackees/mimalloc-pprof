name: fuzz

# Issue #87. Short bounded runs per PR for regression only, plus a longer scheduled
# run. A per-PR fuzz job long enough to find NEW bugs is also long enough to be flaky
# and get disabled, which is how fuzzing quietly stops happening.
#
# The oracle is AddressSanitizer (#86). Without a sanitizer, fuzzing an allocator
# mostly proves it does not segfault.

on:
  push:
    branches: [main, v4]
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/fuzz/**'
      - 'CMakeLists.txt'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '0 4 * * *'   # nightly, longer budget

concurrency:
  # event_name is in the group on purpose: a scheduled run carries ref=refs/heads/main,
  # so without it the nightly 2,000,000-iteration run and a main push would cancel each
  # other. Same-event runs on the same ref still supersede.
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Build harnesses (libFuzzer + ASan)
        run: |
          set -euo pipefail
          # MI_TRACK_ASAN=ON is REQUIRED, not optional: without it a block handed out by
          # mimalloc lives inside mimalloc's own arena, so ASan cannot see an overflow
          # within it -- the planted-bug control could never fire and real finds would be
          # invisible. MI_OVERRIDE=OFF because ASan installs its own malloc interceptors
          # and mimalloc replacing malloc underneath them is what SIGSEGV'd the first run
          # (bare segfault, no ASan report, no crash- file: the process died rather than
          # the sanitizer reporting). The harnesses call mi_* explicitly, so overriding
          # the global allocator buys nothing here.
          cmake -B build-fuzz -DCMAKE_BUILD_TYPE=Debug -DMI_PPROF=ON -DMI_FUZZ=ON                 -DMI_TRACK_ASAN=ON -DMI_OVERRIDE=OFF
          cmake --build build-fuzz --parallel

      # A short deterministic budget on PRs; the nightly run gets the real one.
      - name: Fuzz
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then RUNS=2000000; else RUNS=60000; fi
          for h in alloc-ops prof-dump; do
            echo "::group::$h ($RUNS runs)"
            ./build-fuzz/mimalloc-fuzz-$h test/fuzz/corpus/$h -runs=$RUNS -print_final_stats=1
            echo "::endgroup::"
          done

      # A fuzzer that has never found anything is indistinguishable from one that is
      # not running the code under test. Plant a reachable bug and require it be found.
      - name: Positive control -- the fuzzer must find a planted bug
        run: |
          set -uo pipefail
          cmake -B build-fuzz-bug -DCMAKE_BUILD_TYPE=Debug -DMI_PPROF=ON -DMI_FUZZ=ON                 -DMI_TRACK_ASAN=ON -DMI_OVERRIDE=OFF -DMI_FUZZ_PLANT_BUG=ON
          cmake --build build-fuzz-bug --parallel --target mimalloc-fuzz-alloc-ops
          set +e
          out=$(./build-fuzz-bug/mimalloc-fuzz-alloc-ops test/fuzz/corpus/alloc-ops -runs=200000 2>&1)
          rc=$?
          set -e
          echo "$out" | tail -40
          if [ $rc -eq 0 ]; then
            echo "::error::the fuzzer did NOT find the planted overflow -- the harness is not exercising the allocator."
            exit 1
          fi
          # ANCHORED, and deliberately not case-insensitive. The previous form was
          #     grep -qiE "AddressSanitizer|heap-buffer-overflow"
          # which matched libFuzzer's own boilerplate:
          #     "Combine libFuzzer with AddressSanitizer or similar for better crash reports."
          # -- i.e. the string that satisfied "ASan is working" was libFuzzer telling us
          # ASan was NOT the detector. Every run since this control landed passed on a
          # bare "SUMMARY: libFuzzer: deadly signal" (mimalloc's mi_check_padding calling
          # abort()), with zero AddressSanitizer reports. Second time this exact control
          # was fooled by that NOTE, so match only a real report header.
          if ! echo "$out" | grep -qE "^(==[0-9]+==)?(ERROR|SUMMARY): AddressSanitizer:"; then
            echo "::error::the harness failed (rc=$rc) but produced no AddressSanitizer report -- ASan is not the oracle here, so this control proves nothing about the sanitizer."
            exit 1
          fi
          # "use-after-poison", not "heap-use-after-free": mimalloc's blocks come out of
          # its own arena and MI_OVERRIDE=OFF, so ASan never saw an allocation it owns --
          # it knows the block only through mimalloc's manual ASAN_POISON_MEMORY_REGION
          # in mi_track_free_size. use-after-poison IS the correct verdict here. Both
          # spellings accepted so this does not turn red if the override setting or the
          # tracking path changes; either one means ASan saw the freed block.
          if ! echo "$out" | grep -qE "AddressSanitizer: (heap-)?use-after-(free|poison)"; then
            echo "::error::got an AddressSanitizer report, but not the planted use-after-free; that is a different bug."
            exit 1
          fi
          echo "positive control fired: ASan reported the planted use-after-free (rc=$rc)"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore
