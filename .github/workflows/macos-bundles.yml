name: macos-bundles
run-name: macos-bundles/${{ inputs.ci-mode || 'event' }}/${{ inputs.candidate_sha || github.sha }}

# Issue #277 phase B/B2: build the macOS test binaries on Linux, and execute them on a
# Linux runner inside a dockurr/macos guest. Issue #444 permits hosted native execution
# of the same Linux-built bundles for external-author PRs, opt-in ci-full PRs,
# and explicit full dispatch.
#
# The motivation is not build time. Measured over 20 runs per workflow (#277 phase 0),
# cross.yml's Apple rows EXECUTE in 8-14 seconds and WAIT up to 5h26m (arm64) / 6h13m
# (Intel) for a runner, p90 1h29m / 2h32m, while every ubuntu row waits 4-5 s. Per push
# there are 5-6 macOS jobs, each spinning up its own VM to check out, build and run a
# slice of the suite. This workflow replaces all of that with two Linux build jobs and one
# macOS job -- and phase B2 then removed that macOS job too, on the owner's requirement
# that not one Mac build run on a native Mac device.
#
# What replaces it: both Apple architectures are cross-built here on Linux, and the
# x86_64 bundle is EXECUTED under emulation (dockurr/macos, QEMU+KVM) on ubuntu-24.04.
# aarch64 is compile-only on internal minimal events -- there is no arm64 dockur image,
# and Apple ships no arm64 macOS VM that runs on Linux. Selected full runs execute it on hosted Apple
# Silicon. Its test suite is still checked for parity against the executed x86_64 one
# (`ci/bundle_coverage.py`), so an arm64-only test cannot be silently dropped.
#
# The Linux side needs no Apple hardware and no Xcode: `soldr prepare --target
# aarch64-apple-darwin` provisions clang 21 + ld64.lld + an Apple SDK, and
# cmake/toolchains/soldr-aarch64-apple-darwin.cmake feeds CMake nothing but what soldr
# exported. `ci/bundle_tests.py` then turns the build tree into a directory that runs with
# no CMake and no checkout (see docs/ci-gates.md, "Test bundles").
#
# The control arm those jobs formed is gone with them: c-unit.yml's, cross.yml's and
# rust-native.yml's macOS rows are deleted, not muted. That is deliberate and it is a real
# trade -- see docs/ci-gates.md "macOS" for what is and is not covered now, in particular
# that nothing compiles this code with *Apple's* clang or against Xcode's SDK any more.

env:
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

on:
  # The Recovery *execution* job (`run-macos-x64-recovery`) is manual-only: a full run is
  # ~25 min when the guest cooperates and up to the 90-min job timeout when it does not,
  # which is too slow for a per-PR gate (owner decision, 2026-09-03). Push/PR events still
  # cross-compile every macOS bundle (both arches) so a build break is caught at once;
  # trigger this workflow from the Actions tab (or `gh workflow run macos-bundles.yml
  # --ref <branch>`) to execute the x86_64 bundles inside the Recovery guest.
  workflow_dispatch:
    inputs:
      ci-mode:
        description: Run the native full Apple matrix or the existing Recovery diagnostic
        type: choice
        options: [recovery, full]
        default: recovery
        required: true
      candidate_sha:
        description: Exact 40-character commit SHA required for ci-mode=full
        type: string
        required: false
      run-timeout:
        description: seconds the guest gets to run the bundles
        default: '3600'
        required: false
  push:
    branches: [main, v4]
  pull_request:
    # No `paths` filter (#360): every job here is a required status check on `main`, and a
    # filtered workflow never reports on a PR outside its paths, leaving that PR BLOCKED.
    # `labeled` so adding `needs-macos` to an open PR re-runs `decide` (#339).
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  # The macOS pool is the scarce one this whole workflow exists to stop wasting (#277).
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pr-ci-mode:
    uses: ./.github/workflows/pr-ci-mode.yml

  resolve-candidate:
    name: resolve-candidate (exact SHA)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - id: candidate
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.ci-mode }}
          DISPATCH_SHA: ${{ inputs.candidate_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch && "$MODE" == full ]]; then
            sha="$DISPATCH_SHA"
          elif [[ "$EVENT" == pull_request ]]; then
            sha="$EVENT_SHA"
          else
            sha="$EVENT_SHA"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::candidate_sha must be a complete lowercase 40-hex SHA'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
      - name: Verify checked-out candidate identity
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$CANDIDATE_SHA" || { echo "::error::checked out $actual, expected $CANDIDATE_SHA"; exit 1; }
          echo "exact candidate_sha=$actual" >> "$GITHUB_STEP_SUMMARY"

  pr-test-gate:
    name: PR test gate (macos-bundles)
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [pr-ci-mode, resolve-candidate, decide, build-macos, build-rust-apple, run-macos-x64-selective, run-macos-native-full]
    uses: ./.github/workflows/pr-ci-gate.yml
    with:
      workflow: macos-bundles
      needs-json: ${{ toJSON(needs) }}
      ci-test: ${{ contains(github.event.pull_request.labels.*.name, 'ci-test') }}
      ci-full: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}

  build-macos:
    needs: [resolve-candidate, decide, pr-ci-mode]
    # Keep this matrix job present on every PR: branch protection requires each of its
    # six named rows. Expensive steps run only for full or selective Mac validation.
    env:
      RUN_MACOS_BUILD: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-full') || needs.pr-ci-mode.outputs.external == 'true' || needs.decide.outputs.run == 'true')) }}
    # The golden-image / unattended-install question (#277, #283) that this
    # lane was parked behind is settled by not needing an installed macOS at all: the
    # x86_64 bundles execute in macOS Recovery, booted off the image on an ordinary
    # Linux runner, so there is nothing to install, cache, or keep alive. The
    # no-native-macOS lint (ci/lint_no_macos_runners.py) stays active.
    name: build-macos (${{ matrix.bundle }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both Apple architectures, three configs each. arm64 stops after the build +
        # Mach-O evidence (compile-only); x86_64 is carried on to `run-macos-x64-recovery`
        # and actually executed.
        include:
          # Exactly today's macOS C coverage, no more: `ctest (macos-latest)` and
          # `ctest-debug-full (macos-latest)`. #277's review found the first draft
          # smuggling ~8 new configs in under the word "parity"; adding shared/guarded/
          # pprof-off/Intel configs is a separate, deliberate decision.
          #
          # CMAKE_BUILD_TYPE is Release in both because that is what the native jobs
          # actually compile: they pass no CMAKE_BUILD_TYPE and CMakeLists.txt (~137-145)
          # then defaults it to Release unless the *binary directory name* ends in
          # "debug"/"asan"/... . MI_DEBUG_FULL sets MI_DEBUG=3 independently of the build
          # type, and the registered test set is identical either way (verified: 32 tests
          # both ways) -- so this is parity with the job being replaced, not a downgrade.
          # -DMI_DHAT=ON on the release and debug-full bundles of BOTH arches: DHAT is
          # opt-in (default OFF since 2026-09-18), these keep test-dhat built and run, and
          # the arm64 test-name set is compared against x86_64's so the two must agree.
          # The leak bundles stay at the default (compiled out).
          # #414: -DMI_MEMEVT=ON -DMI_DIAGNOSTICS=ON on the same four bundles, for the same
          # reason -- both subsystems became opt-in, and without naming them Darwin would
          # stop building and running test-memory-events / test-snapshot* /
          # test-heap-dump-json entirely. Applied to BOTH arches so the name sets agree.
          - bundle: macos-arm64-release
            arch: arm64
            triple: aarch64-apple-darwin
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON -DMI_DHAT=ON -DMI_MEMEVT=ON -DMI_DIAGNOSTICS=ON
          - bundle: macos-arm64-debug-full
            arch: arm64
            triple: aarch64-apple-darwin
            # -DMI_TLS_MODEL_FIXED=ON rides on this bundle only (compile-only, arm64):
            # #273 8c's fixed pthread TSD slots 96/97 (prim-tls.h) otherwise have zero
            # compile coverage on macOS -- no other lane passes this flag. It exercises
            # test-tls-slots-heap and test-threadlocal-growth under the fixed model; the
            # TSD-slot guard above is the runtime-drift check for the same feature.
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON -DMI_DEBUG_FULL=ON -DMI_DHAT=ON -DMI_MEMEVT=ON -DMI_DIAGNOSTICS=ON -DMI_TLS_MODEL_FIXED=ON
          # The memory gate's positive control. It is a separate *build*
          # (MI_BENCH_INJECT_LEAK), not a separate run, so it cannot be an entry in
          # another bundle's manifest; it gets its own bundle rather than being dropped
          # on macOS, because a gate whose control never runs is a gate nobody has seen
          # fire (docs/ci-gates.md).
          - bundle: macos-arm64-leak
            arch: arm64
            triple: aarch64-apple-darwin
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON -DMI_BENCH_INJECT_LEAK=200000
          # x86_64: the executed lane.
          - bundle: macos-x64-release
            arch: x86_64
            triple: x86_64-apple-darwin
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON -DMI_DHAT=ON -DMI_MEMEVT=ON -DMI_DIAGNOSTICS=ON
          - bundle: macos-x64-debug-full
            arch: x86_64
            triple: x86_64-apple-darwin
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON -DMI_DEBUG_FULL=ON -DMI_DHAT=ON -DMI_MEMEVT=ON -DMI_DIAGNOSTICS=ON
          - bundle: macos-x64-leak
            arch: x86_64
            triple: x86_64-apple-darwin
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON -DMI_BENCH_INJECT_LEAK=200000
    steps:
      - name: Report minimal-mode skip
        if: env.RUN_MACOS_BUILD != 'true'
        run: echo '${{ matrix.bundle }} is reserved for selective macOS or ci-full validation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.RUN_MACOS_BUILD == 'true'
        with:
          ref: ${{ needs.resolve-candidate.outputs.sha }}
      - uses: zackees/setup-soldr@v0
        if: env.RUN_MACOS_BUILD == 'true'
        with:
          # zccache wraps `soldr cargo`; this job drives CMake directly, so there is
          # nothing for it to wrap. Only the toolchain provisioning is wanted here.
          cache: false
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
      - name: Cache the prepared Darwin toolchain
        if: env.RUN_MACOS_BUILD == 'true'
        uses: actions/cache@v4
        with:
          path: ~/soldr-${{ matrix.triple }}.tar.zst
          key: soldr-prepare-${{ matrix.triple }}-${{ hashFiles('rust/rust-toolchain.toml') }}
      - name: Prepare the soldr Darwin toolchain
        if: env.RUN_MACOS_BUILD == 'true'
        # `soldr prepare` resolves rustc from a rust-toolchain.toml at or above the
        # working directory, which is why this runs in rust/ like cross.yml does.
        working-directory: rust
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          archive="$HOME/soldr-$TRIPLE.tar.zst"
          args=(--target "$TRIPLE" --github-env "$GITHUB_ENV" --save "$archive")
          # --restore on a nonexistent archive is not a documented no-op, so only pass it
          # on a cache hit.
          if [ -f "$archive" ]; then
            args=(--restore "$archive" "${args[@]}")
          fi
          soldr prepare "${args[@]}"
      - name: macOS fixed TLS slots 96/97 must still be unassigned (#273 8c)
        # This fork uses fixed pthread TSD slots 96/97 for the theap pointer on Apple
        # platforms when MI_TLS_MODEL_FIXED is opted into (see include/mimalloc/prim-tls.h)
        # -- 96/97 sit in the never-assigned gap between __PTK_FRAMEWORK_CORETEXT_KEY0 (95)
        # and __PTK_FRAMEWORK_SWIFT_KEY0 (100). A slot Apple later assigns is silent memory
        # corruption, not a build failure, so this is checked in CI rather than trusted.
        #
        # There is no public Apple SDK -- not even soldr's -- that ships
        # pthread/tsd_private.h: it is a *private* darwin-libpthread header, confirmed absent
        # from $SDKROOT/usr/include here (soldr's Apple SDK 14.5) by direct search. This step
        # also greps soldr's $SDKROOT copy below, in case a future SDK bundles it -- belt and
        # suspenders, not the primary source. The authoritative source both this fork and
        # Bun's own comment cite is Apple's opensource release, now published at
        # apple-oss-distributions/libpthread (the apple/darwin-libpthread mirror this step
        # used to pin predates that rename). This fetches `main`, not a pinned commit: a
        # pinned commit can never observe a slot Apple assigns *after* that commit, which
        # defeats the point of a drift check -- confirmed by a review of the first version of
        # this step (#273 8c). `main` was verified byte-identical to the old pin's content at
        # the time this step was written; if Apple's own history ever diverges, that is
        # exactly the drift this step exists to catch.
        #
        # A fetch that merely greps for 96/97 and passes on curl failure would be a
        # tautology (nothing to grep -> nothing found -> false green), so this also asserts
        # the fetched file has the shape the 96/97 choice depends on: key 95
        # (__PTK_FRAMEWORK_CORETEXT_KEY0) and key 100 (__PTK_FRAMEWORK_SWIFT_KEY0) must both
        # be present, proving the real header was fetched and the gap is still exactly where
        # this fork's comment says it is. The slot assertion itself is anchored to a
        # `#define NAME 96|97` line so a bare "96" or "97" in a comment or rdar:// reference
        # elsewhere in the file cannot false-positive it. Runs once (this matrix entry
        # only), not once per bundle -- the header does not vary by architecture or build
        # config.
        if: env.RUN_MACOS_BUILD == 'true' && matrix.bundle == 'macos-arm64-release'
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/apple-oss-distributions/libpthread/main/private/pthread/tsd_private.h"
          if ! curl -fsSL "$url" -o tsd_private.h; then
            echo "::error::could not fetch apple-oss-distributions/libpthread's tsd_private.h; cannot verify slots 96/97 are still unassigned"
            exit 1
          fi
          if ! grep -qE '__PTK_FRAMEWORK_CORETEXT_KEY0[[:space:]]+95' tsd_private.h || \
             ! grep -qE '__PTK_FRAMEWORK_SWIFT_KEY0[[:space:]]+100' tsd_private.h; then
            echo "::error::tsd_private.h does not have the expected shape (CORETEXT_KEY0=95, SWIFT_KEY0=100) -- fetch likely broken, not a real assertion"
            exit 1
          fi
          assert_slots_free() {
            local file="$1" source="$2"
            if grep -qE '^#define[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]+9[67]\b' "$file"; then
              echo "::error::Apple appears to have assigned TSD slot 96 or 97 ($source) -- this fork's MI_TLS_MODEL_FIXED_DEFAULT/_CACHED (prim-tls.h) collide with an in-use slot, silent memory corruption on macOS. Update the fixed slots before this build is trusted."
              grep -nE '^#define[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]+9[67]\b' "$file"
              exit 1
            fi
          }
          assert_slots_free tsd_private.h "apple-oss-distributions/libpthread@main"
          sdk_copy="${SDKROOT:-}/usr/include/pthread/tsd_private.h"
          if [ -n "${SDKROOT:-}" ] && [ -f "$sdk_copy" ]; then
            assert_slots_free "$sdk_copy" "soldr's \$SDKROOT copy"
            echo "OK: also checked soldr's \$SDKROOT copy at $sdk_copy"
          fi
          echo "OK: slots 96 and 97 remain unassigned in apple-oss-distributions/libpthread's tsd_private.h"
      - name: Configure for ${{ matrix.triple }}
        if: env.RUN_MACOS_BUILD == 'true'
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja ${{ matrix.cmake }} \
            --toolchain cmake/toolchains/soldr-${{ matrix.triple }}.cmake \
            --log-level=VERBOSE 2>&1 | tee configure.log
          # The find-root fix in the toolchain file is the difference between linking
          # `pthread` and silently handing the host's ELF librt.so to a Mach-O link.
          # Assert on the resolved list, not on the option that was passed in -- the
          # MI_GUARDED lesson from docs/ci-gates.md.
          if ! grep -qE '^-- Link libraries *: *pthread$' configure.log; then
            echo "::error::the Darwin link picked up host libraries; expected exactly 'pthread'"
            grep -E 'Link libraries' configure.log || true
            exit 1
          fi
      - run: cmake --build build --parallel
        if: env.RUN_MACOS_BUILD == 'true'
      - name: Prove the output is ${{ matrix.arch }} Mach-O with the profiler's Darwin sections
        if: env.RUN_MACOS_BUILD == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          lib=$(ls build/libmimalloc*.dylib | head -1)
          echo "## ${{ matrix.bundle }}" >> "$GITHUB_STEP_SUMMARY"
          llvm-objdump --macho --private-headers "$lib" > headers.txt
          # MI_OSX_INTERPOSE puts the malloc replacements in __DATA,__interpose. If a
          # cross build silently dropped that section the dylib would load in the guest
          # and override nothing, which no test failure would obviously explain.
          llvm-objdump --macho --section-headers "$lib" | grep -q '__interpose'
          llvm-objdump --macho --section-headers "$lib" | grep -q '__thread_vars'
          if [ "$ARCH" = "arm64" ]; then
            grep -E 'MH_MAGIC_64 +ARM64' headers.txt
            grep -A3 'cmd LC_BUILD_VERSION' headers.txt | tee -a "$GITHUB_STEP_SUMMARY"
            # ld64.lld ad-hoc signs arm64 images. Without a signature every process is
            # killed by the kernel on arm64 macOS before main(), with no diagnostic.
            grep -q 'cmd LC_CODE_SIGNATURE' headers.txt
          else
            grep -E 'MH_MAGIC_64 +X86_64' headers.txt
            # NOT LC_BUILD_VERSION and NOT LC_CODE_SIGNATURE, and neither is an oversight:
            # soldr's x86_64 lane targets -mmacosx-version-min=10.12, which predates
            # LC_BUILD_VERSION, so ld64.lld emits the older LC_VERSION_MIN_MACOSX; and
            # only arm64 macOS requires every image to carry a signature. Accept either
            # version load command rather than pinning the one today's soldr happens to
            # emit -- a soldr bump that raises minos would otherwise break this build for
            # no real reason.
            grep -A3 -E 'cmd (LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION)' headers.txt \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Bundle the tests
        if: env.RUN_MACOS_BUILD == 'true'
        run: python3 ci/bundle_tests.py build bundle
      - name: Every Darwin-only test carries the `macos` label (#339)
        if: env.RUN_MACOS_BUILD == 'true'
        # The selective lane runs `--label macos`; a `test-osx-*` without the label
        # would ship in the bundle and never execute anywhere. Red here, on Linux.
        run: python3 ci/check_macos_labels.py bundle/tests.json
      - name: The manifest must carry no absolute path
        if: env.RUN_MACOS_BUILD == 'true'
        # bundle_tests.py already refuses these; this is the independent check, because
        # the whole portability claim rests on it and this is the first phase where the
        # bundle leaves the machine that built it.
        run: |
          set -euo pipefail
          if grep -nE '"(/|[A-Za-z]:[\\/])' bundle/tests.json; then
            echo "::error::the bundle manifest contains an absolute path"
            exit 1
          fi
          python3 -c "import json,sys; d=json.load(open('bundle/tests.json')); print(len(d['tests']), 'tests')"
          ls bundle | grep -q '\.dylib$'
      - name: Pack the bundle
        if: env.RUN_MACOS_BUILD == 'true'
        # tar, not a plain artifact upload: upload-artifact@v4 drops the executable bit
        # and does not preserve symlinks, and this bundle needs both (every test exe, and
        # the libmimalloc.dylib -> libmimalloc.3.dylib SONAME chain).
        run: tar -C bundle -czf "${{ matrix.bundle }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: env.RUN_MACOS_BUILD == 'true'
        with:
          name: bundle-${{ matrix.bundle }}
          path: ${{ matrix.bundle }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-rust-apple:
    needs: [resolve-candidate, pr-ci-mode]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-full') || needs.pr-ci-mode.outputs.external == 'true'))
    # The golden-image / unattended-install question (#277, #283) that this
    # lane was parked behind is settled by not needing an installed macOS at all: the
    # x86_64 bundles execute in macOS Recovery, booted off the image on an ordinary
    # Linux runner, so there is nothing to install, cache, or keep alive. The
    # no-native-macOS lint (ci/lint_no_macos_runners.py) stays active.
    name: build-rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-candidate.outputs.sha }}
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
          build-cache-mode: full
      - name: Prepare blessed cross toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: soldr prepare --target "$TARGET" --github-env "$GITHUB_ENV"
      - name: Keep the cross-built code unwindable (frame pointers)
        # Pre-existing gap #277 §4 asks phase B to close: build-linux sets RUSTFLAGS and
        # CFLAGS at job level, build-cross sets neither, so the Apple test binaries are
        # built without frame pointers while the profiler walks frame pointers on every
        # non-Windows platform.
        #
        # Copying build-linux's job-level `env:` here would be dead: `soldr prepare` has
        # already exported CARGO_ENCODED_RUSTFLAGS (which cargo lets shadow RUSTFLAGS
        # entirely) and CFLAGS_<triple> (which cc-rs prefers over plain CFLAGS). So both
        # have to be *appended to*, not set. CARGO_ENCODED_RUSTFLAGS is 0x1f-separated.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          under="${TARGET//-/_}"
          eval "existing=\${CFLAGS_${under}:-}"
          echo "CFLAGS_${under}=${existing} -fno-omit-frame-pointer" >> "$GITHUB_ENV"
          if [ -n "${CARGO_ENCODED_RUSTFLAGS:-}" ]; then
            printf 'CARGO_ENCODED_RUSTFLAGS=%s\037-Cforce-frame-pointers=yes\n' \
              "$CARGO_ENCODED_RUSTFLAGS" >> "$GITHUB_ENV"
          else
            echo 'CARGO_ENCODED_RUSTFLAGS=-Cforce-frame-pointers=yes' >> "$GITHUB_ENV"
          fi
      - name: The frame-pointer flags must actually be in the build's environment
        # A flag that never reaches the compiler is this repository's most-repeated CI
        # bug (MI_GUARDED, docs/ci-gates.md). Assert on the environment the next step
        # runs with, not on what the previous step intended to write.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          eval "cflags=\${CFLAGS_${TARGET//-/_}:-}"
          case "$cflags" in *-fno-omit-frame-pointer*) ;; *)
            echo "::error::CFLAGS_${TARGET//-/_} lost -fno-omit-frame-pointer: '$cflags'"; exit 1;; esac
          case "${CARGO_ENCODED_RUSTFLAGS:-}" in *force-frame-pointers*) ;; *)
            echo "::error::CARGO_ENCODED_RUSTFLAGS lost -Cforce-frame-pointers"; exit 1;; esac
      - name: Build test binaries through Soldr
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Same shape as cross.yml's build-cross, and for the same measured reasons:
          # pipefail is NOT on in GitHub's `bash -e`, so without it a failed cargo build
          # reports jq's exit status and looks green; and the raw JSON is kept because
          # piping cargo straight into jq discards every `compiler-message`, which is
          # where the error text lives.
          set -euo pipefail
          run_build() {
            local rc=0
            eval "$1 --target $TARGET --release --message-format=json" > cargo.json || rc=$?
            jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' cargo.json > bins.txt
            if [ "$rc" -ne 0 ]; then
              jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' cargo.json >&2
            fi
            return "$rc"
          }
          # Plain `cargo`, NOT `soldr cargo` -- see the long note in cross.yml's
          # build-cross: the wrapper drops mi_prof_* symbols at link time on these targets.
          #
          # No soldr#1969 cache-bypass retry here, deliberately: that retry re-runs
          # `${cmd/soldr/soldr --no-cache}`, and with `soldr` absent from cmd the
          # substitution is a no-op, so the "retry" would just run the identical command
          # a second time and report the same failure twice. (cross.yml carries the same
          # dead retry; it is left alone here so this PR does not change the control arm
          # of #277 phase B's comparison.)
          # #414: `default = []` since 0.12.0 -- name the features this lane used to
          # get implicitly (pprof was the default; memory-events and diagnostics were
          # unconditional C), so the Apple test-name set is unchanged.
          run_build "cargo test -p mimalloc-pprof --features pprof,memory-events,diagnostics --no-run"
          test -s bins.txt
          mkdir -p "dist/$TARGET"
          xargs -r -a bins.txt -I{} cp {} "dist/$TARGET/"
          if ! ls "dist/$TARGET"/t3_stats-* >/dev/null 2>&1; then
            echo "::error::t3_stats was not built for $TARGET. Staged binaries:"
            ls -1 "dist/$TARGET" || echo "  (none)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rust-test-bins-${{ matrix.target }}
          path: rust/dist/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7


  # ---------------------------------------------------------------------------------
  # The execution lane. No Apple hardware, no macOS runner: a macOS guest (QEMU + KVM)
  # on an ordinary Linux runner executes the x86_64 bundles, via the
  # zackees/docker-mac-x64 action.
  #
  # Why x86_64 only: there is no arm64 macOS image that boots under QEMU on Linux, so
  # arm64 is compile-only (see this file's header). Its suite is still compared against
  # this one, below, so an arm64-only test cannot go missing unnoticed.
  #
  # NO GOLDEN DISK. The previous design booted a prebuilt macOS installed once by hand
  # (ci/macos_golden_local.sh -> macos-golden-upload.yml -> Actions cache) because macOS
  # has no unattended installer. That image was never built, so this job was red by
  # design, and it carried a standing cost: a 40 GB+ cache entry that expires, needs a
  # maintainer to sit through Apple's GUI installer to rebuild, and a keep-alive workflow
  # (macos-golden-touch.yml) whose only job was to stop it expiring.
  #
  # This lane boots macOS RECOVERY instead, straight off the image, every run. Recovery
  # is a full userland with a Terminal; the bundles are static Mach-O binaries and run in
  # it unmodified. Nothing to install, nothing to cache, nothing to expire, and no
  # unauthenticated noVNC console ever exposed. Cold boot to a shell is ~6 minutes.
  #
  # What Recovery costs, stated plainly rather than left for a reviewer to find: it has
  # no dyld shared cache, so three profiler tests that assert stack PCs resolve to loaded
  # modules cannot pass there. They are NOT skipped -- the full bundle runs and
  # ci/recovery_expected_failures.py asserts the failure set is exactly those three, so a
  # new failure is red AND one of them starting to pass is also red. 42 of 45 tests in
  # the release bundle execute for real (measured).
  # ---------------------------------------------------------------------------------
  # ---------------------------------------------------------------------------------
  # Selective lane (#339). A PR that touches a Darwin-only path, or carries the
  # `needs-macos` label, boots the same Recovery guest but executes ONLY the tests
  # labelled `macos` (ci/run_test_bundle.py --label). Boot-to-shell is ~6 min, so this
  # is a ~10-12 min job and CAN gate a PR; the full run above stays manual.
  # `decide` always runs and is the required check -- a conditional job cannot be
  # required by branch protection, so the *decision* is what the rule names.
  # ---------------------------------------------------------------------------------
  decide:
    needs: resolve-candidate
    name: decide (selective macOS lane)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run || steps.no-pr.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ needs.resolve-candidate.outputs.sha }}
          fetch-depth: 0
      - id: decide
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 ci/macos_lane_decide.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --labels "${{ join(github.event.pull_request.labels.*.name, ',') }}"
      - id: no-pr
        if: github.event_name != 'pull_request'
        run: echo 'run=false' >> "$GITHUB_OUTPUT"
      - run: |
          echo "### selective macOS lane: run=${{ steps.decide.outputs.run || steps.no-pr.outputs.run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.decide.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  run-macos-x64-selective:
    name: run-macos-x64-selective (tests labelled macos, in Recovery)
    needs: [resolve-candidate, decide, build-macos]
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-candidate.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-macos-x64-*
          path: artifacts
      - name: Build the guest payload (x86_64 bundles + relocatable CPython)
        run: |
          set -euo pipefail
          mkdir -p payload share
          for archive in artifacts/*/*.tar.gz; do
            name=$(basename "$archive" .tar.gz)
            mkdir -p "payload/$name"
            tar -C "payload/$name" -xzf "$archive"
          done
          cp ci/run_test_bundle.py payload/
          # Prove on the runner that the label selects something in BOTH bundles, so a
          # guest boot is never spent on a run that would refuse to start.
          python3 ci/check_macos_labels.py payload/macos-x64-release/tests.json payload/macos-x64-debug-full/tests.json
          curl -fsSL -o cpython.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20250612/cpython-3.12.11+20250612-x86_64-apple-darwin-install_only.tar.gz"
          tar -xzf cpython.tar.gz -C payload
          python3 ci/patch_recovery_python.py payload/python/lib/libpython3.12.dylib
          tar -czf share/payload.tar.gz -C payload .
          ls -lh share/payload.tar.gz

      - name: Boot macOS Recovery and run the macos-labelled tests
        id: macos
        uses: zackees/docker-mac-x64@main
        with:
          share-dir: share
          collect: /tmp/w/out
          ram: '8'
          run-timeout: '1200'
          run: |
            set -x
            mkdir -p /tmp/w/out && cd /tmp/w
            curl -s -o payload.tar.gz http://10.0.2.2:8000/payload.tar.gz
            mkdir -p payload && tar -xzf payload.tar.gz -C payload
            cd payload
            ./python/bin/python3 -VV || exit 91
            ./python/bin/python3 run_test_bundle.py macos-x64-release \
              --label macos --junit /tmp/w/out/sel-release.xml
            echo $? > /tmp/w/out/release.rc
            ./python/bin/python3 run_test_bundle.py macos-x64-debug-full \
              --label macos --junit /tmp/w/out/sel-debug-full.xml
            echo $? > /tmp/w/out/debug-full.rc
            # #353: which of Apple's malloc-introspection CLIs does Recovery actually ship?
            # Printed to the console (the guest's stdout reaches the job log) rather than a
            # collected file, so the answer cannot go missing with the collection.
            for t in leaks vmmap heap malloc_history xcrun; do
              if command -v "$t" >/dev/null 2>&1; then echo "TOOLS: $t present at $(command -v "$t")"; else echo "TOOLS: $t absent"; fi
            done
            echo "TOOLS: $(uname -a)"
            echo "guest script complete"

      - name: Test results -- exactly the waived Recovery failures, no others
        run: |
          set -euo pipefail
          C="${{ steps.macos.outputs.workdir }}/collected"
          ls -l "$C"
          test -f "$C/sel-release.xml" || { echo "::error::no JUnit came back from the guest"; exit 1; }
          test -f "$C/sel-debug-full.xml" || { echo "::error::debug-full JUnit missing"; exit 1; }
          python3 ci/recovery_expected_failures.py "$C/sel-release.xml" "$C/sel-debug-full.xml"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-selective-results
          path: ${{ steps.macos.outputs.workdir }}/collected/
          if-no-files-found: warn
          retention-days: 7
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-selective-guest-screens
          path: ${{ steps.macos.outputs.workdir }}/results/*.ppm
          if-no-files-found: warn

  run-macos-native-full:
    name: run-macos-native-full (${{ matrix.arch }})
    needs: [resolve-candidate, build-macos, build-rust-apple, pr-ci-mode]
    # Hosted Apple hardware is approved for external-author PRs, literal ci-full PR
    # labels, and explicit full dispatch (#444, #463). Internal minimal PRs and main
    # events allocate none.
    if: >-
      (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-full') || needs.pr-ci-mode.outputs.external == 'true')) ||
      (github.event_name == 'workflow_dispatch' && inputs.ci-mode == 'full')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            triple: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            triple: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-candidate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-macos-${{ matrix.arch }}-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: rust-test-bins-${{ matrix.triple }}
          path: rust-bins
      - name: Unpack exactly the Linux-built bundles
        run: |
          set -euo pipefail
          for config in release debug-full leak; do
            archive="artifacts/bundle-macos-${{ matrix.arch }}-$config/macos-${{ matrix.arch }}-$config.tar.gz"
            test -s "$archive" || { echo "::error::missing cross-built $archive"; exit 1; }
            mkdir -p "bundles/macos-${{ matrix.arch }}-$config"
            tar -xzf "$archive" -C "bundles/macos-${{ matrix.arch }}-$config"
            test -s "bundles/macos-${{ matrix.arch }}-$config/tests.json"
          done
          test -n "$(find rust-bins -type f -print -quit)" || { echo '::error::no cross-built Rust tests'; exit 1; }
      - name: Execute the shipped C bundles on native macOS
        run: |
          set -euo pipefail
          mkdir -p results
          python="$(python3 -c 'import sys; print(sys.executable)')"
          test "${python:0:1}" = / || { echo '::error::Python interpreter is not absolute'; exit 1; }
          status=0
          for config in release debug-full; do
            name="macos-${{ matrix.arch }}-$config"
            mkdir -p "results/$name"
            "$python" ci/run_test_bundle.py "bundles/$name" \
              --exclude test-osx-zone-introspect-remote \
              --junit "results/$name/ordinary.xml" || status=1
            sudo -n "$python" ci/run_test_bundle.py "bundles/$name" \
              --only test-osx-zone-introspect-remote \
              --junit "results/$name/remote-root.xml" || status=1
            python3 ci/bundle_coverage.py --compare "$name" \
              "bundles/$name/tests.json" "results/$name" || status=1
          done
          exit "$status"
      - name: Prove the shipped leak control fires on native macOS
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            DYLD_LIBRARY_PATH="$(pwd)/bundles/macos-${{ matrix.arch }}-release:${DYLD_LIBRARY_PATH:-}" \
            MI_BENCH_JSON="$(pwd)/results/normal-$i.json" \
              "bundles/macos-${{ matrix.arch }}-release/mimalloc-test-memory-gate" > /dev/null
            DYLD_LIBRARY_PATH="$(pwd)/bundles/macos-${{ matrix.arch }}-leak:${DYLD_LIBRARY_PATH:-}" \
            MI_BENCH_JSON="$(pwd)/results/leak-$i.json" \
              "bundles/macos-${{ matrix.arch }}-leak/mimalloc-test-memory-gate" > /dev/null
          done
          python3 ci/check_macos_memory_control.py
      - name: Execute the shipped Rust tests on native macOS
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(rust-bins/*)
          test "${#bins[@]}" -gt 0
          for bin in "${bins[@]}"; do
            test -f "$bin" || exit 1
            chmod +x "$bin"
            "$bin" --test-threads=4
          done
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-${{ matrix.arch }}-results
          path: results/
          if-no-files-found: error
          retention-days: 7

  run-macos-x64-recovery:
    name: run-macos-x64 (macOS Recovery on Linux)
    needs: [resolve-candidate, build-macos, build-rust-apple]
    # Manual only -- see the `on:` block. Not a PR gate; run it before merging changes to
    # the allocator's macOS-specific paths (prim/osx, interpose, TLS slots) or on demand.
    if: github.event_name == 'workflow_dispatch' && inputs.ci-mode == 'recovery'
    runs-on: ubuntu-latest
    # Emulated guest, everything in it serial, one boot retry budgeted.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-candidate.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-macos-x64-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-macos-arm64-*
          path: arm64-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: rust-test-bins-x86_64-apple-darwin
          path: rust-bins

      - name: Unpack both arches' bundles on the runner
        # Before anything touches the guest: the coverage comparison below is a
        # property of the two bundles, not of the guest, so it still has an
        # answer worth failing on even if macOS never boots.
        run: |
          set -euo pipefail
          for archive in artifacts/*/*.tar.gz arm64-artifacts/*/*.tar.gz; do
            name=$(basename "$archive" .tar.gz)
            mkdir -p "bundles/$name"
            tar -C "bundles/$name" -xzf "$archive"
          done
          ls -1 bundles

      - name: Coverage -- the executed x86_64 bundles must run the whole arm64 suite
        # arm64 is compile-only, so it is the reference side: this is what stops a
        # test that exists only there from quietly never running anywhere.
        run: |
          set -euo pipefail
          python3 ci/bundle_coverage.py \
            --heading "macOS coverage: arm64 (compile-only) vs x86_64 (executed in macOS Recovery)" \
            --names arm64 x86_64 \
            --compare "release" bundles/macos-arm64-release/tests.json bundles/macos-x64-release/tests.json \
            --compare "debug-full" bundles/macos-arm64-debug-full/tests.json bundles/macos-x64-debug-full/tests.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Build the guest payload
        run: |
          set -euo pipefail
          mkdir -p payload share
          # Only x86_64 goes into the guest; the arm64 bundles exist on the runner
          # for the coverage comparison and are never executed anywhere.
          cp -r bundles/macos-x64-* payload/
          chmod +x rust-bins/* || true
          cp -r rust-bins payload/rust-bins
          cp ci/run_test_bundle.py ci/memory_gate.py payload/
          cp -r ci/memory-baselines payload/memory-baselines

          # A relocatable CPython: Recovery has no python3 at all, and the one in a
          # full macOS is a Command Line Tools stub that opens a GUI dialog.
          curl -fsSL -o cpython.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20250612/cpython-3.12.11+20250612-x86_64-apple-darwin-install_only.tar.gz"
          tar -xzf cpython.tar.gz -C payload
          # ...which does not load in Recovery until this one dylib reference is
          # repointed. See ci/patch_recovery_python.py for the dyld error it fixes.
          python3 ci/patch_recovery_python.py payload/python/lib/libpython3.12.dylib

          tar -czf share/payload.tar.gz -C payload .
          ls -lh share/payload.tar.gz

      - name: Boot macOS Recovery and run the bundles
        id: macos
        uses: zackees/docker-mac-x64@main
        with:
          share-dir: share
          collect: /tmp/w/out
          ram: '8'
          run-timeout: ${{ inputs.run-timeout || '3600' }}
          # One boot, everything serial inside it. Nothing here may abort the
          # script on a test failure: a red bundle still has to post its JUnit
          # back, and the runner decides pass/fail afterwards.
          run: |
            set -x
            mkdir -p /tmp/w/out && cd /tmp/w
            curl -s -o payload.tar.gz http://10.0.2.2:8000/payload.tar.gz
            mkdir -p payload && tar -xzf payload.tar.gz -C payload
            cd payload
            ./python/bin/python3 -VV || exit 91

            ./python/bin/python3 run_test_bundle.py macos-x64-release \
              --junit /tmp/w/out/bundle-release.xml
            echo $? > /tmp/w/out/release.rc

            ./python/bin/python3 run_test_bundle.py macos-x64-debug-full \
              --junit /tmp/w/out/bundle-debug-full.xml
            echo $? > /tmp/w/out/debug-full.rc

            ( cd rust-bins && chmod +x ./* && for t in ./*; do
                echo "== $t"; "$t" --test-threads=4 || exit 1
              done ) > /tmp/w/out/rust-bins.log 2>&1
            echo $? > /tmp/w/out/rust-bins.rc

            for i in 1 2 3 4 5 6 7 8; do
              MI_BENCH_JSON=/tmp/w/out/result-$i.json \
                ./macos-x64-release/mimalloc-test-memory-gate > /dev/null
            done
            for i in 1 2 3 4 5 6 7 8; do
              MI_BENCH_JSON=/tmp/w/out/leak-$i.json \
                ./macos-x64-leak/mimalloc-test-memory-gate > /dev/null || true
            done

            # memory_gate runs IN the guest so its platform/arch/compiler key is
            # computed where the numbers were produced, not on the Linux runner.
            cd /tmp/w/out
            cp /tmp/w/payload/memory_gate.py .
            cp -r /tmp/w/payload/memory-baselines .
            /tmp/w/payload/python/bin/python3 memory_gate.py where \
              --arch x86_64 --compiler soldr-clang-21 result-1.json
            echo $? > where.rc
            /tmp/w/payload/python/bin/python3 memory_gate.py check \
              --arch x86_64 --compiler soldr-clang-21 result-*.json > check.log 2>&1
            echo $? > check.rc
            /tmp/w/payload/python/bin/python3 memory_gate.py control \
              --arch x86_64 --compiler soldr-clang-21 leak-*.json > control.log 2>&1
            echo $? > control.rc
            echo "guest script complete"

      - name: Test results -- exactly the waived Recovery failures, no others
        run: |
          set -euo pipefail
          C="${{ steps.macos.outputs.workdir }}/collected"
          ls -l "$C"
          test -f "$C/bundle-release.xml" || { echo "::error::no JUnit came back from the guest"; exit 1; }
          python3 ci/recovery_expected_failures.py \
            "$C/bundle-release.xml" "$C/bundle-debug-full.xml"

      - name: Rust test binaries must pass
        run: |
          set -euo pipefail
          C="${{ steps.macos.outputs.workdir }}/collected"
          tail -40 "$C/rust-bins.log" || true
          rc=$(cat "$C/rust-bins.rc")
          test "$rc" = "0" || { echo "::error::cross-built Rust tests failed in the guest (rc=$rc)"; exit 1; }

      - name: Memory gate
        run: |
          set -euo pipefail
          C="${{ steps.macos.outputs.workdir }}/collected"
          n=$(ls "$C"/result-*.json 2>/dev/null | wc -l)
          test "$n" -eq 8 || { echo "::error::only $n of 8 memory-gate runs produced JSON"; exit 1; }
          # `where` separates "no baseline yet" (3) from "cannot read this run" (2);
          # `check` collapses both into 2, so the bootstrap path must be decided on
          # where's status, not check's.
          where=$(cat "$C/where.rc")
          case "$where" in
            0) cat "$C/check.log"
               test "$(cat "$C/check.rc")" = "0" || { echo "::error::memory gate regressed"; exit 1; }
               cat "$C/control.log"
               test "$(cat "$C/control.rc")" = "0" || { echo "::error::the leak control did not fire -- the gate is not gating"; exit 1; } ;;
            3) echo "::warning::No committed baseline for the Recovery x86_64 lane yet. Bootstrap it from this run's memory-gate artifact; until then neither the gate nor its positive control can be enforced."
               cat "$C/check.log" || true ;;
            *) echo "::error::memory_gate could not read this run's JSON (rc=$where)"; exit 1 ;;
          esac

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle-results
          path: ${{ steps.macos.outputs.workdir }}/collected/
          if-no-files-found: warn
          retention-days: 7
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-guest-screens
          path: ${{ steps.macos.outputs.workdir }}/results/*.ppm
          if-no-files-found: warn
