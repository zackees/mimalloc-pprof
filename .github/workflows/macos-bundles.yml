name: macos-bundles

# Issue #277 phase B/B2: build the macOS test binaries on Linux, and execute them on a
# Linux runner inside a dockurr/macos guest. NO NATIVE macOS RUNNER IS USED ANYWHERE IN
# THIS REPOSITORY (ci/lint_no_macos_runners.py enforces that).
#
# The motivation is not build time. Measured over 20 runs per workflow (#277 phase 0),
# cross.yml's Apple rows EXECUTE in 8-14 seconds and WAIT up to 5h26m (arm64) / 6h13m
# (Intel) for a runner, p90 1h29m / 2h32m, while every ubuntu row waits 4-5 s. Per push
# there are 5-6 macOS jobs, each spinning up its own VM to check out, build and run a
# slice of the suite. This workflow replaces all of that with two Linux build jobs and one
# macOS job -- and phase B2 then removed that macOS job too, on the owner's requirement
# that not one Mac build run on a native Mac device.
#
# What replaces it: both Apple architectures are cross-built here on Linux, and the
# x86_64 bundle is EXECUTED under emulation (dockurr/macos, QEMU+KVM) on ubuntu-24.04.
# aarch64 is compile-only -- there is no arm64 dockur image, and Apple ships no arm64
# macOS VM that runs on Linux, so a compile plus the Mach-O evidence below is the whole
# arm64 gate. Its test suite is still checked for parity against the executed x86_64 one
# (`ci/bundle_coverage.py`), so an arm64-only test cannot be silently dropped.
#
# The Linux side needs no Apple hardware and no Xcode: `soldr prepare --target
# aarch64-apple-darwin` provisions clang 21 + ld64.lld + an Apple SDK, and
# cmake/toolchains/soldr-aarch64-apple-darwin.cmake feeds CMake nothing but what soldr
# exported. `ci/bundle_tests.py` then turns the build tree into a directory that runs with
# no CMake and no checkout (see docs/ci-gates.md, "Test bundles").
#
# The control arm those jobs formed is gone with them: c-unit.yml's, cross.yml's and
# rust-native.yml's macOS rows are deleted, not muted. That is deliberate and it is a real
# trade -- see docs/ci-gates.md "macOS" for what is and is not covered now, in particular
# that nothing compiles this code with *Apple's* clang or against Xcode's SDK any more.

env:
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

on:
  push:
    branches: [main, v4]
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'rust/**'
      - 'CMakeLists.txt'
      - 'cmake/toolchains/**'
      - 'ci/**'
      - '.github/workflows/macos-bundles.yml'

concurrency:
  # The macOS pool is the scarce one this whole workflow exists to stop wasting (#277).
  group: macos-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: build-macos (${{ matrix.bundle }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both Apple architectures, three configs each. arm64 stops after the build +
        # Mach-O evidence (compile-only); x86_64 is carried on to `run-macos-x64-dockur`
        # and actually executed.
        include:
          # Exactly today's macOS C coverage, no more: `ctest (macos-latest)` and
          # `ctest-debug-full (macos-latest)`. #277's review found the first draft
          # smuggling ~8 new configs in under the word "parity"; adding shared/guarded/
          # pprof-off/Intel configs is a separate, deliberate decision.
          #
          # CMAKE_BUILD_TYPE is Release in both because that is what the native jobs
          # actually compile: they pass no CMAKE_BUILD_TYPE and CMakeLists.txt (~137-145)
          # then defaults it to Release unless the *binary directory name* ends in
          # "debug"/"asan"/... . MI_DEBUG_FULL sets MI_DEBUG=3 independently of the build
          # type, and the registered test set is identical either way (verified: 32 tests
          # both ways) -- so this is parity with the job being replaced, not a downgrade.
          - bundle: macos-arm64-release
            arch: arm64
            triple: aarch64-apple-darwin
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON
          - bundle: macos-arm64-debug-full
            arch: arm64
            triple: aarch64-apple-darwin
            # -DMI_TLS_MODEL_FIXED=ON rides on this bundle only (compile-only, arm64):
            # #273 8c's fixed pthread TSD slots 96/97 (prim-tls.h) otherwise have zero
            # compile coverage on macOS -- no other lane passes this flag. It exercises
            # test-tls-slots-heap and test-threadlocal-growth under the fixed model; the
            # TSD-slot guard above is the runtime-drift check for the same feature.
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON -DMI_DEBUG_FULL=ON -DMI_TLS_MODEL_FIXED=ON
          # The memory gate's positive control. It is a separate *build*
          # (MI_BENCH_INJECT_LEAK), not a separate run, so it cannot be an entry in
          # another bundle's manifest; it gets its own bundle rather than being dropped
          # on macOS, because a gate whose control never runs is a gate nobody has seen
          # fire (docs/ci-gates.md).
          - bundle: macos-arm64-leak
            arch: arm64
            triple: aarch64-apple-darwin
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON -DMI_BENCH_INJECT_LEAK=200000
          # x86_64: the executed lane.
          - bundle: macos-x64-release
            arch: x86_64
            triple: x86_64-apple-darwin
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON
          - bundle: macos-x64-debug-full
            arch: x86_64
            triple: x86_64-apple-darwin
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON -DMI_DEBUG_FULL=ON
          - bundle: macos-x64-leak
            arch: x86_64
            triple: x86_64-apple-darwin
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON -DMI_BENCH_INJECT_LEAK=200000
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
        with:
          # zccache wraps `soldr cargo`; this job drives CMake directly, so there is
          # nothing for it to wrap. Only the toolchain provisioning is wanted here.
          cache: false
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
      - name: Cache the prepared Darwin toolchain
        uses: actions/cache@v4
        with:
          path: ~/soldr-${{ matrix.triple }}.tar.zst
          key: soldr-prepare-${{ matrix.triple }}-${{ hashFiles('rust/rust-toolchain.toml') }}
      - name: Prepare the soldr Darwin toolchain
        # `soldr prepare` resolves rustc from a rust-toolchain.toml at or above the
        # working directory, which is why this runs in rust/ like cross.yml does.
        working-directory: rust
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          archive="$HOME/soldr-$TRIPLE.tar.zst"
          args=(--target "$TRIPLE" --github-env "$GITHUB_ENV" --save "$archive")
          # --restore on a nonexistent archive is not a documented no-op, so only pass it
          # on a cache hit.
          if [ -f "$archive" ]; then
            args=(--restore "$archive" "${args[@]}")
          fi
          soldr prepare "${args[@]}"
      - name: macOS fixed TLS slots 96/97 must still be unassigned (#273 8c)
        # This fork uses fixed pthread TSD slots 96/97 for the theap pointer on Apple
        # platforms when MI_TLS_MODEL_FIXED is opted into (see include/mimalloc/prim-tls.h)
        # -- 96/97 sit in the never-assigned gap between __PTK_FRAMEWORK_CORETEXT_KEY0 (95)
        # and __PTK_FRAMEWORK_SWIFT_KEY0 (100). A slot Apple later assigns is silent memory
        # corruption, not a build failure, so this is checked in CI rather than trusted.
        #
        # There is no public Apple SDK -- not even soldr's -- that ships
        # pthread/tsd_private.h: it is a *private* darwin-libpthread header, confirmed absent
        # from $SDKROOT/usr/include here (soldr's Apple SDK 14.5) by direct search. This step
        # also greps soldr's $SDKROOT copy below, in case a future SDK bundles it -- belt and
        # suspenders, not the primary source. The authoritative source both this fork and
        # Bun's own comment cite is Apple's opensource release, now published at
        # apple-oss-distributions/libpthread (the apple/darwin-libpthread mirror this step
        # used to pin predates that rename). This fetches `main`, not a pinned commit: a
        # pinned commit can never observe a slot Apple assigns *after* that commit, which
        # defeats the point of a drift check -- confirmed by a review of the first version of
        # this step (#273 8c). `main` was verified byte-identical to the old pin's content at
        # the time this step was written; if Apple's own history ever diverges, that is
        # exactly the drift this step exists to catch.
        #
        # A fetch that merely greps for 96/97 and passes on curl failure would be a
        # tautology (nothing to grep -> nothing found -> false green), so this also asserts
        # the fetched file has the shape the 96/97 choice depends on: key 95
        # (__PTK_FRAMEWORK_CORETEXT_KEY0) and key 100 (__PTK_FRAMEWORK_SWIFT_KEY0) must both
        # be present, proving the real header was fetched and the gap is still exactly where
        # this fork's comment says it is. The slot assertion itself is anchored to a
        # `#define NAME 96|97` line so a bare "96" or "97" in a comment or rdar:// reference
        # elsewhere in the file cannot false-positive it. Runs once (this matrix entry
        # only), not once per bundle -- the header does not vary by architecture or build
        # config.
        if: matrix.bundle == 'macos-arm64-release'
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/apple-oss-distributions/libpthread/main/private/pthread/tsd_private.h"
          if ! curl -fsSL "$url" -o tsd_private.h; then
            echo "::error::could not fetch apple-oss-distributions/libpthread's tsd_private.h; cannot verify slots 96/97 are still unassigned"
            exit 1
          fi
          if ! grep -qE '__PTK_FRAMEWORK_CORETEXT_KEY0[[:space:]]+95' tsd_private.h || \
             ! grep -qE '__PTK_FRAMEWORK_SWIFT_KEY0[[:space:]]+100' tsd_private.h; then
            echo "::error::tsd_private.h does not have the expected shape (CORETEXT_KEY0=95, SWIFT_KEY0=100) -- fetch likely broken, not a real assertion"
            exit 1
          fi
          assert_slots_free() {
            local file="$1" source="$2"
            if grep -qE '^#define[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]+9[67]\b' "$file"; then
              echo "::error::Apple appears to have assigned TSD slot 96 or 97 ($source) -- this fork's MI_TLS_MODEL_FIXED_DEFAULT/_CACHED (prim-tls.h) collide with an in-use slot, silent memory corruption on macOS. Update the fixed slots before this build is trusted."
              grep -nE '^#define[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]+9[67]\b' "$file"
              exit 1
            fi
          }
          assert_slots_free tsd_private.h "apple-oss-distributions/libpthread@main"
          sdk_copy="${SDKROOT:-}/usr/include/pthread/tsd_private.h"
          if [ -n "${SDKROOT:-}" ] && [ -f "$sdk_copy" ]; then
            assert_slots_free "$sdk_copy" "soldr's \$SDKROOT copy"
            echo "OK: also checked soldr's \$SDKROOT copy at $sdk_copy"
          fi
          echo "OK: slots 96 and 97 remain unassigned in apple-oss-distributions/libpthread's tsd_private.h"
      - name: Configure for ${{ matrix.triple }}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja ${{ matrix.cmake }} \
            --toolchain cmake/toolchains/soldr-${{ matrix.triple }}.cmake \
            --log-level=VERBOSE 2>&1 | tee configure.log
          # The find-root fix in the toolchain file is the difference between linking
          # `pthread` and silently handing the host's ELF librt.so to a Mach-O link.
          # Assert on the resolved list, not on the option that was passed in -- the
          # MI_GUARDED lesson from docs/ci-gates.md.
          if ! grep -qE '^-- Link libraries *: *pthread$' configure.log; then
            echo "::error::the Darwin link picked up host libraries; expected exactly 'pthread'"
            grep -E 'Link libraries' configure.log || true
            exit 1
          fi
      - run: cmake --build build --parallel
      - name: Prove the output is ${{ matrix.arch }} Mach-O with the profiler's Darwin sections
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          lib=$(ls build/libmimalloc*.dylib | head -1)
          echo "## ${{ matrix.bundle }}" >> "$GITHUB_STEP_SUMMARY"
          llvm-objdump --macho --private-headers "$lib" > headers.txt
          # MI_OSX_INTERPOSE puts the malloc replacements in __DATA,__interpose. If a
          # cross build silently dropped that section the dylib would load in the guest
          # and override nothing, which no test failure would obviously explain.
          llvm-objdump --macho --section-headers "$lib" | grep -q '__interpose'
          llvm-objdump --macho --section-headers "$lib" | grep -q '__thread_vars'
          if [ "$ARCH" = "arm64" ]; then
            grep -E 'MH_MAGIC_64 +ARM64' headers.txt
            grep -A3 'cmd LC_BUILD_VERSION' headers.txt | tee -a "$GITHUB_STEP_SUMMARY"
            # ld64.lld ad-hoc signs arm64 images. Without a signature every process is
            # killed by the kernel on arm64 macOS before main(), with no diagnostic.
            grep -q 'cmd LC_CODE_SIGNATURE' headers.txt
          else
            grep -E 'MH_MAGIC_64 +X86_64' headers.txt
            # NOT LC_BUILD_VERSION and NOT LC_CODE_SIGNATURE, and neither is an oversight:
            # soldr's x86_64 lane targets -mmacosx-version-min=10.12, which predates
            # LC_BUILD_VERSION, so ld64.lld emits the older LC_VERSION_MIN_MACOSX; and
            # only arm64 macOS requires every image to carry a signature. Accept either
            # version load command rather than pinning the one today's soldr happens to
            # emit -- a soldr bump that raises minos would otherwise break this build for
            # no real reason.
            grep -A3 -E 'cmd (LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION)' headers.txt \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Bundle the tests
        run: python3 ci/bundle_tests.py build bundle
      - name: The manifest must carry no absolute path
        # bundle_tests.py already refuses these; this is the independent check, because
        # the whole portability claim rests on it and this is the first phase where the
        # bundle leaves the machine that built it.
        run: |
          set -euo pipefail
          if grep -nE '"(/|[A-Za-z]:[\\/])' bundle/tests.json; then
            echo "::error::the bundle manifest contains an absolute path"
            exit 1
          fi
          python3 -c "import json,sys; d=json.load(open('bundle/tests.json')); print(len(d['tests']), 'tests')"
          ls bundle | grep -q '\.dylib$'
      - name: Pack the bundle
        # tar, not a plain artifact upload: upload-artifact@v4 drops the executable bit
        # and does not preserve symlinks, and this bundle needs both (every test exe, and
        # the libmimalloc.dylib -> libmimalloc.3.dylib SONAME chain).
        run: tar -C bundle -czf "${{ matrix.bundle }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.bundle }}
          path: ${{ matrix.bundle }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-rust-apple:
    name: build-rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
          build-cache-mode: full
      - name: Prepare blessed cross toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: soldr prepare --target "$TARGET" --github-env "$GITHUB_ENV"
      - name: Keep the cross-built code unwindable (frame pointers)
        # Pre-existing gap #277 §4 asks phase B to close: build-linux sets RUSTFLAGS and
        # CFLAGS at job level, build-cross sets neither, so the Apple test binaries are
        # built without frame pointers while the profiler walks frame pointers on every
        # non-Windows platform.
        #
        # Copying build-linux's job-level `env:` here would be dead: `soldr prepare` has
        # already exported CARGO_ENCODED_RUSTFLAGS (which cargo lets shadow RUSTFLAGS
        # entirely) and CFLAGS_<triple> (which cc-rs prefers over plain CFLAGS). So both
        # have to be *appended to*, not set. CARGO_ENCODED_RUSTFLAGS is 0x1f-separated.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          under="${TARGET//-/_}"
          eval "existing=\${CFLAGS_${under}:-}"
          echo "CFLAGS_${under}=${existing} -fno-omit-frame-pointer" >> "$GITHUB_ENV"
          if [ -n "${CARGO_ENCODED_RUSTFLAGS:-}" ]; then
            printf 'CARGO_ENCODED_RUSTFLAGS=%s\037-Cforce-frame-pointers=yes\n' \
              "$CARGO_ENCODED_RUSTFLAGS" >> "$GITHUB_ENV"
          else
            echo 'CARGO_ENCODED_RUSTFLAGS=-Cforce-frame-pointers=yes' >> "$GITHUB_ENV"
          fi
      - name: The frame-pointer flags must actually be in the build's environment
        # A flag that never reaches the compiler is this repository's most-repeated CI
        # bug (MI_GUARDED, docs/ci-gates.md). Assert on the environment the next step
        # runs with, not on what the previous step intended to write.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          eval "cflags=\${CFLAGS_${TARGET//-/_}:-}"
          case "$cflags" in *-fno-omit-frame-pointer*) ;; *)
            echo "::error::CFLAGS_${TARGET//-/_} lost -fno-omit-frame-pointer: '$cflags'"; exit 1;; esac
          case "${CARGO_ENCODED_RUSTFLAGS:-}" in *force-frame-pointers*) ;; *)
            echo "::error::CARGO_ENCODED_RUSTFLAGS lost -Cforce-frame-pointers"; exit 1;; esac
      - name: Build test binaries through Soldr
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Same shape as cross.yml's build-cross, and for the same measured reasons:
          # pipefail is NOT on in GitHub's `bash -e`, so without it a failed cargo build
          # reports jq's exit status and looks green; and the raw JSON is kept because
          # piping cargo straight into jq discards every `compiler-message`, which is
          # where the error text lives.
          set -euo pipefail
          run_build() {
            local rc=0
            eval "$1 --target $TARGET --release --message-format=json" > cargo.json || rc=$?
            jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' cargo.json > bins.txt
            if [ "$rc" -ne 0 ]; then
              jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' cargo.json >&2
            fi
            return "$rc"
          }
          # Plain `cargo`, NOT `soldr cargo` -- see the long note in cross.yml's
          # build-cross: the wrapper drops mi_prof_* symbols at link time on these targets.
          #
          # No soldr#1969 cache-bypass retry here, deliberately: that retry re-runs
          # `${cmd/soldr/soldr --no-cache}`, and with `soldr` absent from cmd the
          # substitution is a no-op, so the "retry" would just run the identical command
          # a second time and report the same failure twice. (cross.yml carries the same
          # dead retry; it is left alone here so this PR does not change the control arm
          # of #277 phase B's comparison.)
          run_build "cargo test -p mimalloc-pprof --no-run"
          test -s bins.txt
          mkdir -p "dist/$TARGET"
          xargs -r -a bins.txt -I{} cp {} "dist/$TARGET/"
          if ! ls "dist/$TARGET"/t3_stats-* >/dev/null 2>&1; then
            echo "::error::t3_stats was not built for $TARGET. Staged binaries:"
            ls -1 "dist/$TARGET" || echo "  (none)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rust-test-bins-${{ matrix.target }}
          path: rust/dist/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7


  # ---------------------------------------------------------------------------------
  # The execution lane. No Apple hardware, no macOS runner: a dockurr/macos guest
  # (QEMU + KVM) on an ordinary ubuntu-24.04 runner runs the x86_64 bundles.
  #
  # Why x86_64 only: dockur publishes no arm64 image and Apple ships no arm64 macOS that
  # boots under QEMU on Linux, so arm64 is compile-only (see this file's header). The
  # arm64 suite is still compared against this one, below, so an arm64-only test cannot
  # go missing unnoticed.
  #
  # Why a prebuilt disk: macOS has no unattended installer. Apple's Recovery installer is
  # a GUI that must be driven by a human through dockur's web viewer on :8006 (verified
  # against the image: /run/install.sh has no automation hook, and the image exposes no
  # unattended/answer-file variable the way dockur/windows does). Installing on every run
  # is therefore not an option at any price. The disk is built ONCE, on a maintainer's own
  # machine, by `ci/macos_golden_local.sh`, and published into the Actions cache by
  # `macos-golden-upload.yml`. A cache miss here is a hard error naming both, never a
  # silent skip.
  #
  # The install is deliberately NOT done on a runner. Driving Apple's Recovery GUI in CI
  # would mean exposing dockur's web viewer -- an unauthenticated noVNC console with
  # keyboard and mouse control of the VM -- to the public internet for the hours an
  # emulated install takes, from a public repository. Loopback on a maintainer's machine
  # costs nothing and risks nothing.
  #
  # CONSEQUENCE, stated plainly rather than left for a reviewer to discover: until that
  # image has been built and uploaded once, THIS JOB IS RED -- on the PR that introduces
  # it and on every push to main after it merges. That is deliberate. A gate that reports
  # "I have no disk to run on" is worth more than one that skips itself into a green tick,
  # which is the exact failure mode docs/ci-gates.md exists to prevent. It fails in about
  # two minutes and costs one Linux runner.
  # ---------------------------------------------------------------------------------
  run-macos-x64-dockur:
    name: run-macos-x64 (dockurr/macos on Linux)
    needs: [build-macos, build-rust-apple]
    runs-on: ubuntu-24.04
    # Generous on purpose: the guest is emulated, the host may be AMD (which dockur pins
    # to a single core, see below), and everything in it runs serially.
    timeout-minutes: 120
    env:
      # Bump the trailing version when the golden image is rebuilt, so a stale disk can
      # never be silently reused after the guest's toolchain or user setup changes.
      GOLDEN_KEY: macos-x64-golden-ventura-v1
      # The guest is ephemeral, reachable only on this runner's loopback, and holds
      # nothing but test binaries; a fixed local password is what the golden image is
      # built with so that this job needs no repository secret and no key distribution.
      GUEST_USER: ci
      GUEST_PASS: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-macos-x64-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-macos-arm64-*
          path: arm64-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: rust-test-bins-x86_64-apple-darwin
          path: rust-bins

      # Measured on ubuntu-24.04 (#277 phase B2 probe): one 145 GB `/dev/root` with
      # ~87 GB free, and `/mnt` on that same filesystem rather than a separate temp disk.
      # 87 GB is ample for a 64 GB sparse guest disk, but print it -- a full disk during a
      # macOS boot surfaces as an unexplained QEMU exit.
      - name: Unpack both arches' bundles on the runner
        # Done here, before anything touches the guest, because the coverage comparison
        # below is a property of the two bundles and not of the guest: if macOS never
        # boots, "do these two bundles cover the same tests" is still a question with an
        # answer, and still worth failing on. Staging into the guest copies from here.
        run: |
          set -euo pipefail
          for archive in artifacts/*/*.tar.gz arm64-artifacts/*/*.tar.gz; do
            name=$(basename "$archive" .tar.gz)
            mkdir -p "bundles/$name"
            tar -C "bundles/$name" -xzf "$archive"
          done
          ls -1 bundles

      - name: Coverage -- the executed x86_64 bundles must run the whole arm64 suite
        # There is no native macOS runner left to enumerate a ctest suite on, so the
        # reference side is the arm64 bundle: arm64 is compile-only, and this is what
        # stops a test that exists only there from quietly never running anywhere.
        run: |
          set -euo pipefail
          python3 ci/bundle_coverage.py \
            --heading "macOS coverage: arm64 (compile-only) vs x86_64 (executed under dockurr/macos)" \
            --names arm64 x86_64 \
            --compare "release" bundles/macos-arm64-release/tests.json bundles/macos-x64-release/tests.json \
            --compare "debug-full" bundles/macos-arm64-debug-full/tests.json bundles/macos-x64-debug-full/tests.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Make room for the guest disk
        run: |
          set -euo pipefail
          df -h / /mnt
          sudo mkdir -p /mnt/macstore /mnt/golden
          sudo chown "$USER" /mnt/macstore /mnt/golden

      - name: Restore the golden macOS disk
        id: golden
        uses: actions/cache/restore@v4
        with:
          path: /mnt/golden
          key: ${{ env.GOLDEN_KEY }}

      - name: A golden disk is required
        if: steps.golden.outputs.cache-hit != 'true'
        run: |
          echo "::error::No golden macOS disk under cache key '$GOLDEN_KEY'." \
               "macOS has no unattended installer, so this job cannot bootstrap itself." \
               "Build the image once on your own machine with ci/macos_golden_local.sh" \
               "(boot -> click through Apple's installer -> pack), then publish it with" \
               "the 'macos-golden-upload' workflow and re-run this job."
          exit 1

      - name: Give containers access to /dev/kvm
        # This is the sequence GitHub's nested-virtualisation documentation prescribes.
        # Measured caveat (#277 phase B2 probe on ubuntu-24.04): the rule does NOT change
        # the mode -- /dev/kvm is `crw-rw---- root kvm` before and after -- and containers
        # can open it anyway. So the rule is kept as documented-but-harmless, and the
        # `docker run` below is the check that actually decides, because it tests the
        # thing the guest needs rather than the permission bits it was assumed to need.
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          # Assert the container can really open it. Without this the failure surfaces
          # much later as an unexplained QEMU exit.
          docker run --rm --device=/dev/kvm alpine ls -l /dev/kvm

      - name: Unpack the golden disk and boot the guest
        id: boot
        run: |
          set -euo pipefail
          # NOT `zstd -d --sparse ... -c`: sparse mode cannot apply to a pipe, and zstd
          # does not ignore the flag, it fails -- `zstd: error 92 : Sparse skip error`,
          # reproduced on zstd 1.5.7, which then feeds tar a truncated stream and reports
          # "This does not look like a tar archive". The holes are preserved anyway,
          # because `macos_golden_local.sh pack` recorded them with `tar -cSf`; GNU tar
          # restores a sparse member's holes on extraction from that format on its own.
          zstd -dc /mnt/golden/macstore.tar.zst | tar -C /mnt/macstore -xSf -
          du -sh /mnt/macstore

          # dockur pins AMD hosts to one core (dockur/macos#268: the guest panics with
          # more). Detect rather than hardcode -- GitHub's Linux pool mixes Intel Xeon and
          # AMD EPYC, and picking wrong is either a panic loop or a needless 4x slowdown.
          vendor=$(lscpu | awk -F: '/Vendor ID/{gsub(/ /,"",$2); print $2}')
          if [ "$vendor" = "AuthenticAMD" ]; then cores=1; else cores=$(nproc); fi
          echo "host CPU vendor=$vendor -> CPU_CORES=$cores"
          echo "cores=$cores" >> "$GITHUB_OUTPUT"

          # CPU_MODEL is NOT dockur's default, and this is the single most load-bearing
          # line in the job. Measured on an AMD Zen 2 host (Ryzen 7 3700X): with dockur's
          # default profile for macOS 13 (`Haswell-noTSX`) the guest resets immediately
          # after "HANDOFF TO XNU" and loops forever -- 987 resets in 7 hours, 685 MB ever
          # written, no installer screen. Holding everything else identical and setting
          # `Skylake-Client-v4` boots macOS Recovery in about 5 minutes. dockur#268
          # describes the AMD symptom and the single-core mitigation; the CPU model is the
          # other half and it is not defaulted for macOS 13.
          # 127.0.0.1 explicitly: Docker's default publish address is 0.0.0.0, and the
          # guest's sshd accepts a fixed password. Nothing outside this runner has any
          # business reaching it. (Port 8006, dockur's VNC console, is not published at
          # all -- nothing here drives the GUI.)
          docker run -d --name macguest \
            --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN \
            -p 127.0.0.1:2222:22 \
            -e VERSION=13 -e RAM_SIZE=6G -e CPU_CORES="$cores" -e DISK_SIZE=64G \
            -e CPU_MODEL="Skylake-Client-v4" \
            -v /mnt/macstore:/storage \
            dockurr/macos

      - name: Wait for the guest to accept ssh
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          # A boot probe, never a fixed sleep: an emulated macOS boot is minutes and
          # varies with the host. Poll the thing that actually has to work.
          deadline=$(( $(date +%s) + 1800 ))
          until sshpass -p "$GUEST_PASS" ssh -p 2222 \
                  -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                  -o ConnectTimeout=5 -o ConnectionAttempts=1 "$GUEST_USER@127.0.0.1" true 2>/dev/null; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::the macOS guest never accepted ssh within 30 minutes"
              docker logs macguest 2>&1 | grep -viE 'BdsDxe|EXITBS|EB\.BST|B:BOOT|HANDOFF|End of efiboot' | tail -40
              # A boot LOOP and a slow boot look identical from outside; this is what
              # tells them apart in the log.
              echo "XNU handoffs (a climbing count means a panic loop, not a slow boot): \
                $(docker logs macguest 2>&1 | grep -c 'HANDOFF TO XNU' || true)"
              exit 1
            fi
            sleep 10
          done
          echo "guest is up after $SECONDS s"
          sshpass -p "$GUEST_PASS" ssh -p 2222 -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null "$GUEST_USER@127.0.0.1" \
            'sw_vers; uname -m; sysctl -n machdep.cpu.brand_string'

      - name: Stage the payload into the guest
        run: |
          set -euo pipefail
          mkdir -p payload
          # Only the x86_64 bundles go into the guest; the arm64 ones exist on the runner
          # for the coverage comparison and are never executed anywhere.
          cp -r bundles/macos-x64-* payload/
          chmod +x rust-bins/* || true
          cp -r rust-bins payload/rust-bins
          cp ci/run_test_bundle.py ci/memory_gate.py payload/
          cp -r ci/memory-baselines payload/memory-baselines

          # A relocatable CPython, because the guest's /usr/bin/python3 is a Command Line
          # Tools stub that pops a GUI dialog on a machine with no one to click it, and
          # the golden image deliberately does not carry Xcode. run_test_bundle.py and
          # memory_gate.py are stdlib-only, so a bare interpreter is enough.
          curl -fsSL -o cpython.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20250612/cpython-3.12.11+20250612-x86_64-apple-darwin-install_only.tar.gz"
          cp cpython.tar.gz payload/

          tar -czf payload.tar.gz payload
          ls -lh payload.tar.gz
          sshpass -p "$GUEST_PASS" scp -P 2222 -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null payload.tar.gz "$GUEST_USER@127.0.0.1:~/"
          sshpass -p "$GUEST_PASS" ssh -p 2222 -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null "$GUEST_USER@127.0.0.1" \
            'set -e; rm -rf ~/w; mkdir ~/w; tar -C ~/w -xzf ~/payload.tar.gz; \
             tar -C ~/w/payload -xzf ~/w/payload/cpython.tar.gz; \
             ~/w/payload/python/bin/python3 -VV; \
             file ~/w/payload/macos-x64-release/mimalloc-test-api'

      # Everything below runs INSIDE the guest. `G` is the one place the ssh incantation
      # lives; every step reuses it so a change to the transport cannot half-apply.
      - name: ctest (macOS x86_64) equivalent -- macos-x64-release
        run: |
          set -euo pipefail
          ./ci/dockur_guest.sh run \
            'cd ~/w/payload && ./python/bin/python3 run_test_bundle.py macos-x64-release --junit ~/bundle-release.xml'
      - name: ctest-debug-full (macOS x86_64) equivalent -- macos-x64-debug-full
        # Carries the six run-negative.cmake controls and the DYLD_INSERT_LIBRARIES
        # interposition test; run serially after the release bundle, never alongside it.
        run: |
          set -euo pipefail
          ./ci/dockur_guest.sh run \
            'cd ~/w/payload && ./python/bin/python3 run_test_bundle.py macos-x64-debug-full --junit ~/bundle-debug-full.xml'

      - name: Run the cross-built Rust test binaries
        # Replaces cross.yml's `test (x86_64-apple-darwin)` row. That row had
        # `pprof: false`, so there is no pprof-parses-a-dump step here either -- parity,
        # not a silent reduction. These link MI_STATIC_LIB, so no dylib interposition is
        # involved. Native x86_64 in this guest: no Rosetta anywhere, which is one whole
        # class of "is this Rosetta or is this us" ambiguity gone.
        run: |
          set -euo pipefail
          ./ci/dockur_guest.sh run \
            'set -e; cd ~/w/payload/rust-bins; chmod +x *; \
             for t in *; do echo "== $t"; ./"$t" --test-threads=4; done'

      - name: Memory gate -- 8 runs from the release bundle
        run: |
          set -euo pipefail
          # --arch/--compiler give this lane its own baseline. Without them it would be
          # compared against ci/memory-baselines/macos-pprof1.json, which Apple clang
          # recorded on a native Intel runner -- a cross-toolchain, cross-machine
          # comparison dressed as a regression check. The numbers here are additionally
          # taken under emulation, which is exactly why they need their own file.
          ./ci/dockur_guest.sh run 'set -e; cd ~/w/payload; \
            for i in 1 2 3 4 5 6 7 8; do \
              MI_BENCH_JSON="$PWD/result-$i.json" ./macos-x64-release/mimalloc-test-memory-gate > /dev/null; \
            done; \
            count=0; for f in result-*.json; do [ -e "$f" ] && count=$((count+1)); done; \
            if [ "$count" -ne 8 ]; then echo "only $count of 8 memory-gate runs produced JSON"; exit 1; fi; \
            cat result-1.json'
          # `where` distinguishes "no baseline yet" (3) from "cannot read this run" (2);
          # `check` collapses both into 2, so gating the yellow bootstrap path on check's
          # own status would report an unreadable result as a bootstrap and exit green.
          rc=0
          ./ci/dockur_guest.sh run 'cd ~/w/payload && ./python/bin/python3 memory_gate.py where \
             --arch x86_64 --compiler soldr-clang-21 result-1.json' || rc=$?
          case "$rc" in
            0) ./ci/dockur_guest.sh run 'cd ~/w/payload && ./python/bin/python3 memory_gate.py check \
                 --arch x86_64 --compiler soldr-clang-21 result-*.json' ;;
            3) echo "::warning::No committed baseline for the dockur x86_64 lane yet -- bootstrap it from this run's memory-gate artifact."
               ./ci/dockur_guest.sh run 'cd ~/w/payload && ./python/bin/python3 memory_gate.py check \
                 --arch x86_64 --compiler soldr-clang-21 result-*.json' || true ;;
            *) echo "::error::memory_gate could not read this run's JSON (rc=$rc)"; exit 1 ;;
          esac

      - name: Positive control -- the gate must catch an injected leak
        run: |
          set -euo pipefail
          ./ci/dockur_guest.sh run 'set -e; cd ~/w/payload; \
            for i in 1 2 3 4 5 6 7 8; do \
              MI_BENCH_JSON="$PWD/leak-$i.json" ./macos-x64-leak/mimalloc-test-memory-gate > /dev/null || true; \
            done; \
            count=0; for f in leak-*.json; do [ -e "$f" ] && count=$((count+1)); done; \
            if [ "$count" -ne 8 ]; then echo "only $count of 8 leak-control runs produced JSON"; exit 1; fi'
          # `control` requires `check` to FAIL. A missing baseline is not a failure, it is
          # a bootstrap, so before this lane's baseline is committed the control would go
          # red for the wrong reason.
          rc=0
          ./ci/dockur_guest.sh run 'cd ~/w/payload && ./python/bin/python3 memory_gate.py where \
             --arch x86_64 --compiler soldr-clang-21 leak-1.json' || rc=$?
          case "$rc" in
            0) ./ci/dockur_guest.sh run 'cd ~/w/payload && ./python/bin/python3 memory_gate.py control \
                 --arch x86_64 --compiler soldr-clang-21 leak-*.json' ;;
            3) echo "::warning::the dockur x86_64 lane has no committed baseline yet, so its positive control cannot run. Commit the baseline, then this becomes a hard gate." ;;
            *) echo "::error::memory_gate could not read the leak control's JSON (rc=$rc)"; exit 1 ;;
          esac

      - name: Retrieve results from the guest
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ./ci/dockur_guest.sh pull '~/bundle-release.xml' bundle-release.xml || true
          ./ci/dockur_guest.sh pull '~/bundle-debug-full.xml' bundle-debug-full.xml || true
          ./ci/dockur_guest.sh pull '~/w/payload/result-\*.json' . || true
          ./ci/dockur_guest.sh pull '~/w/payload/leak-\*.json' . || true
          ls -l bundle-*.xml result-*.json leak-*.json 2>/dev/null || true

      - name: Guest and QEMU logs
        if: ${{ !cancelled() }}
        run: |
          docker logs macguest 2>&1 \
            | grep -viE 'BdsDxe|EXITBS|EB\.BST|B:BOOT|HANDOFF|End of efiboot' \
            | tail -60 > dockur.log || true
          echo "XNU handoffs: $(docker logs macguest 2>&1 | grep -c 'HANDOFF TO XNU' || true)" >> dockur.log
          cat dockur.log

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: memory-gate-macos-x64-dockur
          path: |
            result-*.json
            leak-*.json
          if-no-files-found: warn
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle-results
          path: |
            bundle-release.xml
            bundle-debug-full.xml
            dockur.log
          if-no-files-found: warn
          retention-days: 7
