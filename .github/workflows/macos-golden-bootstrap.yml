name: macos-golden-bootstrap

# Issue #277 phase B2. Build, ONCE and by hand, the installed-macOS disk image that
# `macos-bundles.yml`'s `run-macos-x64-dockur` restores on every run.
#
# Why this job exists at all, and why it needs a human:
#
#   macOS has no unattended installer. dockur/windows takes an answer file; the macOS
#   image has no equivalent, and Apple's Recovery installer is a GUI (Disk Utility ->
#   erase the target disk -> "Reinstall macOS" -> Setup Assistant) that must be clicked
#   through. This was checked against the image rather than assumed: /run/install.sh
#   exposes no automation hook and the image declares no unattended/answer-file variable.
#
#   So the choice is not "automate the install or do it by hand", it is "do it by hand
#   once and keep the result, or have no macOS execution at all". This job is the once.
#
# It is `workflow_dispatch` only and it is expected to be run perhaps once a year -- when
# the macOS version is bumped, or when the guest's setup changes. Everyday CI never runs
# it; `run-macos-x64-dockur` fails with a pointer here if its cache entry is missing.
#
# Apple's macOS Software Licence Agreement permits running macOS in a virtual machine only
# on Apple-branded hardware. This job, and the `run-macos-x64-dockur` job it feeds, run
# macOS under QEMU on non-Apple Linux runners; dockur/macos states the same caveat in its
# own README. Recorded here as a fact for whoever owns that decision.

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: "dockur VERSION (13 = Ventura, 14 = Sonoma)"
        default: "13"
      golden_key:
        description: "cache key to publish the finished disk under"
        default: "macos-x64-golden-ventura-v1"

concurrency:
  # Two of these racing would fight over one cache key and one tunnel.
  group: macos-golden-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    # A macOS install under emulation on one core is hours, and a human has to be at the
    # other end of it. This is the longest GitHub allows.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Give containers access to /dev/kvm
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          docker run --rm --device=/dev/kvm alpine ls -l /dev/kvm

      - name: Boot the installer
        run: |
          set -euo pipefail
          df -h / /mnt
          sudo mkdir -p /mnt/macstore && sudo chown "$USER" /mnt/macstore
          vendor=$(lscpu | awk -F: '/Vendor ID/{gsub(/ /,"",$2); print $2}')
          if [ "$vendor" = "AuthenticAMD" ]; then cores=1; else cores=$(nproc); fi
          echo "host CPU vendor=$vendor -> CPU_CORES=$cores"
          lscpu | grep -Ei 'model name|vendor'
          # CPU_MODEL is NOT dockur's default, and this is the single most load-bearing
          # line in the job. Measured on an AMD Zen 2 host (Ryzen 7 3700X): with dockur's
          # default profile for macOS 13 (`Haswell-noTSX`) the guest resets immediately
          # after "HANDOFF TO XNU" and loops forever -- 987 resets in 7 hours, 685 MB ever
          # written, no installer screen. Holding everything else identical and setting
          # `Skylake-Client-v4` boots macOS Recovery in about 5 minutes. dockur#268
          # describes the AMD symptom and the single-core mitigation; the CPU model is the
          # other half and it is not defaulted for macOS 13.
          docker run -d --name macguest \
            --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN \
            -p 8006:8006 -p 2222:22 \
            -e VERSION=${{ inputs.macos_version }} -e RAM_SIZE=8G \
            -e CPU_CORES="$cores" -e DISK_SIZE=64G \
            -e CPU_MODEL="Skylake-Client-v4" \
            -v /mnt/macstore:/storage \
            dockurr/macos

      - name: Open a tunnel to dockur's web viewer, and wait for the human
        # The viewer is the install UI. cloudflared's quick tunnel needs no account and no
        # repository secret; the URL it prints is what the operator opens.
        #
        # WHAT TO DO once the viewer loads (this is the whole manual procedure):
        #   1. Disk Utility -> select the largest disk -> Erase -> APFS -> name it
        #      "macOS" -> quit Disk Utility.
        #   2. "Reinstall macOS" -> target that disk. This is the long part.
        #   3. In Setup Assistant create the account:  username `ci`, password `ci`.
        #      Those exact values -- macos-bundles.yml logs in with them.
        #   4. System Settings -> General -> Sharing -> enable **Remote Login** (ssh).
        #   5. System Settings -> Lock Screen: set every "turn display off" / sleep
        #      option to Never. A guest that sleeps mid-run looks exactly like a hang.
        #   6. Terminal:  sudo systemsetup -setremotelogin on
        #                 sudo pmset -a sleep 0 disksleep 0 displaysleep 0
        #      Nothing else. Do NOT install Xcode or the Command Line Tools: the test
        #      bundles are self-contained and the job ships its own Python, and every GB
        #      here is a GB of cache on every future run.
        # When ssh answers, this step returns on its own.
        run: |
          set -euo pipefail
          curl -fsSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:8006 --no-autoupdate > tunnel.log 2>&1 &
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          for _ in $(seq 1 30); do
            url=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1) && [ -n "$url" ] && break
            sleep 5
          done
          echo "::notice::Install macOS here: ${url:-<tunnel failed, see tunnel.log>}"
          { echo "## Drive the installer at: ${url:-tunnel failed}"; } >> "$GITHUB_STEP_SUMMARY"
          # Poll for the finished guest rather than a fixed wait: the operator decides
          # when it is done by making ssh answer, which is also exactly the condition
          # run-macos-x64-dockur will depend on.
          deadline=$(( $(date +%s) + 19800 ))
          until sshpass -p ci ssh -p 2222 -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 ci@127.0.0.1 true 2>/dev/null; do
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::no ssh from the guest; install not completed"; exit 1; }
            sleep 30
          done
          sshpass -p ci ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ci@127.0.0.1 'sw_vers; uname -m'

      - name: Shut the guest down cleanly and compress the disk
        run: |
          set -euo pipefail
          # Zero the free space first: the raw disk is sparse, and zeroed free space
          # compresses to nothing. This is the difference between a ~60 GB and a
          # single-digit-GB artifact.
          sshpass -p ci ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ci@127.0.0.1 'dd if=/dev/zero of=~/zero bs=1m 2>/dev/null || true; rm -f ~/zero; sync' || true
          sshpass -p ci ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ci@127.0.0.1 'sudo shutdown -h now' || true
          sleep 60
          docker stop -t 120 macguest || true
          echo "raw store:"; du -sh /mnt/macstore
          sudo mkdir -p /mnt/golden && sudo chown "$USER" /mnt/golden
          tar -C /mnt/macstore -cf - . | zstd -T0 -19 --sparse -o /mnt/golden/macstore.tar.zst
          ls -lh /mnt/golden/macstore.tar.zst
          size=$(stat -c%s /mnt/golden/macstore.tar.zst)
          echo "### golden image: $(numfmt --to=iec "$size")" >> "$GITHUB_STEP_SUMMARY"
          # actions/cache gives a repository 10 GB in total, shared with every other
          # cache. If the image alone does not fit, the cache is the wrong store and the
          # decision has to be made deliberately (a larger runner, a self-hosted one, or
          # accepting compile-only x86_64) rather than discovered as a silent eviction
          # loop where every run rebuilds nothing and fails on a miss.
          if [ "$size" -gt 9000000000 ]; then
            echo "::error::golden image is $(numfmt --to=iec "$size"), which does not fit GitHub's 10 GB per-repository cache. See docs/ci-gates.md."
            exit 1
          fi

      - uses: actions/cache/save@v4
        with:
          path: /mnt/golden
          key: ${{ inputs.golden_key }}

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dockur-bootstrap-logs
          path: tunnel.log
          if-no-files-found: warn
