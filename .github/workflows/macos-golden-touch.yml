name: macos-golden-touch

# Issue #277 phase B2. Keep the golden macOS disk alive in the Actions cache.
#
# GitHub evicts a cache entry after **7 days without a read**. The golden image is the one
# cache entry in this repository that cannot be rebuilt by CI -- rebuilding it needs a
# human to sit through Apple's Recovery installer on their own machine (see
# ci/macos_golden_local.sh). If it were allowed to expire, `run-macos-x64-dockur` would go
# red until someone noticed and re-ran `macos-golden-upload`.
#
# A restore is a read, so restoring it weekly resets the clock. `lookup-only: true` makes
# that read cost nothing: it refreshes the entry's last-accessed time without downloading
# the multi-GB payload.
#
# Note the other half of the cache budget problem, which this job does not solve: GitHub
# gives a repository 10 GB of Actions cache IN TOTAL, and the golden image is gated at
# 9 GB. An image near that ceiling will LRU-evict the soldr toolchain caches that
# macos-bundles.yml and cross.yml rely on, making every run slower without ever failing.
# If that happens, the fix is a smaller image or a self-hosted runner -- see
# docs/ci-gates.md, "Running macOS on a Linux runner".

on:
  schedule:
    # Weekly, comfortably inside the 7-day eviction window even if one run is skipped.
    - cron: '17 4 * * 1'
  workflow_dispatch: {}

concurrency:
  group: macos-golden-touch
  cancel-in-progress: false

permissions:
  actions: read

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: golden
        uses: actions/cache/restore@v4
        with:
          path: /mnt/golden
          key: macos-x64-golden-ventura-v1
          lookup-only: true
      - name: Report
        run: |
          set -euo pipefail
          if [ "${{ steps.golden.outputs.cache-hit }}" = "true" ]; then
            echo "golden image present; eviction clock reset" >> "$GITHUB_STEP_SUMMARY"
          else
            # A warning, not a failure: this job existing to notice the problem is the
            # point, but a red scheduled job every week is noise nobody reads.
            echo "::warning::The golden macOS image is GONE from the cache. run-macos-x64-dockur will fail until someone rebuilds it with ci/macos_golden_local.sh and re-runs macos-golden-upload."
            echo "golden image MISSING -- rebuild with ci/macos_golden_local.sh" >> "$GITHUB_STEP_SUMMARY"
          fi
