name: perf-ab

# Small paired A/B of the allocator at this ref against a base ref (#479, #493): memory (peak
# RSS, RSS after drain), CPU (ops/s, process and worker-thread cpu seconds) and minor page
# faults on a few large-block workloads, a small-object control, the Larson server workload (#506)
# and a profiler-on row. It runs on PRs labelled `perf-ab` (against the PR base) or by
# dispatch; the table lands in the job summary and is pasted into the PR. Runs on a hosted
# runner so no developer machine is timed. A dispatch can set allocator options on the head arm
# only (`head_env`): with base = the same commit, that attributes a cost to one option (#506).
# `head_cppdefs` does the same for compile-time defines: the head arm's library is built with
# -DMI_EXTRA_CPPDEFS=<value>, and the table's first line says so (#527). The #422 diagnostic rows
# (exact sizes, size-class edges, the sparse-large-buffers twin; names end in "(#422)") never run
# on a PR: a dispatch selects them through `workloads`, e.g. "#422" or "80 KiB|512 KiB".
# `holes_report` (#529, #422 E4) appends an untimed allocator-internal snapshot per row and arm:
# every worker's mi_purge_holes_report() in an MI_DIAGNOSTICS=ON build (see ci/perf_ab.py).
# #573: the first repetition of every row is a sanity screen (`sanity_gate`): a head RSS metric
# above 1.5x base + 8 MiB fails the job at once. A PR push queues behind an older running measurement
# (one PR, one live run), and only the `perf-ab` label itself starts a run: another label
# (ci-test, ci-full, ...) used to start a second and third run on the same SHA, each on a
# different CPU model. `head_sha` dispatches a head that is not the ref the workflow runs from.
# `null_arm`, `max_reps` and the raw-samples artifact are #573 B3, B6 and B4; several head variants
# (`head_env` / `head_cppdefs` split on ' || ') run as one rotation on one VM (B5).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref to compare against"
        type: string
        default: origin/main
      head_sha:
        description: "Head commit to measure (empty = the ref the workflow was dispatched on)"
        type: string
        default: ""
      reps:
        description: "Paired repetitions per workload"
        type: string
        default: "7"
      workloads:
        description: "Workload name substrings, '|' between alternatives; '=name' matches exactly (empty = gating rows; diagnostics run only when named)"
        type: string
        default: ""
      head_env:
        description: "KEY=VALUE pairs (space separated) set on the head arm only, e.g. MIMALLOC_ARENA_PURGE_MULT=1"
        type: string
        default: ""
      head_cppdefs:
        description: "Defines (NAME or NAME=VALUE, ';' or space separated) the head arm's library is built with, as -DMI_EXTRA_CPPDEFS, e.g. MI_ENABLE_LARGE_PAGES=0"
        type: string
        default: ""
      holes_report:
        description: "After the timed reps, one untimed MI_DIAGNOSTICS=ON run per row and arm printing every worker's mi_purge_holes_report() and the allocator's statistics (#529, #573)"
        type: boolean
        default: false
      null_arm:
        description: "Measure base a second time in the rotation: its base-vs-base intervals are the per-cell noise floor (#573 B3); costs one more arm of runner time"
        type: boolean
        default: false
      max_reps:
        description: "Adaptive reps (#573 B6): after `reps`, add 5 at a time to the rows whose rule-12 ledger is still INCONCLUSIVE, up to this many (0 = none)"
        type: string
        default: "0"
      sanity_gate:
        description: "Fail after the first repetition when a head RSS metric exceeds 1.5x base + 8 MiB (#573); turn off for a knob that is meant to trade memory away"
        type: boolean
        default: true
      build_report_only:
        description: "Build-only plain-binary layout diagnostic: preserve executables, disassembly and compiler settings; run no measurements (#585)"
        type: boolean
        default: false

permissions:
  contents: read

# One live run per PR; new pushes queue behind a running measurement (#585).
# A dispatch is its own group and is never cancelled by another. A run for
# some other label skips the job below, so it gets its own group too: it must not cancel a live one.
concurrency:
  group: perf-ab-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'labeled' && github.event.label.name != 'perf-ab' && github.run_id || 'live' }}
  cancel-in-progress: false

jobs:
  ab:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'perf-ab') &&
       (github.event.action != 'labeled' || github.event.label.name == 'perf-ab'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use this workflow revision's harness even when measuring an older
          # allocator. Historical perf_ab.py versions may not accept today's flags.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: zackees/setup-soldr@6bf04d4196ee26fe9d51550187013a7f32955e20 # v0
        with:
          cache: false
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
      - name: paired A/B
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base }}
          HEAD_REF: ${{ inputs.head_sha || 'HEAD' }}
          REPS: ${{ inputs.reps || '7' }}
          WORKLOADS: ${{ inputs.workloads }}
          HEAD_ENV: ${{ inputs.head_env }}
          HEAD_CPPDEFS: ${{ inputs.head_cppdefs }}
          HOLES_REPORT: ${{ inputs.holes_report && '--holes-report' || '' }}
          NO_SANITY_GATE: ${{ inputs.sanity_gate == false && '--no-sanity-gate' || '' }}
          NULL_ARM: ${{ inputs.null_arm && '--null-arm' || '' }}
          MAX_REPS: ${{ inputs.max_reps || '0' }}
          BUILD_REPORT_ONLY: ${{ inputs.build_report_only }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_REPORT_ONLY" == true ]]; then
            if [[ -n "$HEAD_ENV" || -n "$HEAD_CPPDEFS" ]]; then
              echo '::error::build-only report supports the unchanged plain build, without head variants'
              exit 2
            fi
            python3 ci/perf_ab_build_report.py --base "$BASE_REF" --head "$HEAD_REF" --output perf-ab-build-report --summary "$GITHUB_STEP_SUMMARY"
          else
            python3 ci/perf_ab.py --base "$BASE_REF" --head "$HEAD_REF" --reps "$REPS" --max-reps "$MAX_REPS" --workloads "$WORKLOADS" --head-env "$HEAD_ENV" --head-cppdefs "$HEAD_CPPDEFS" $HOLES_REPORT $NO_SANITY_GATE $NULL_ARM --budget-minutes 80 --json perf-ab-samples.json --preserve-builds perf-ab-builds --summary "$GITHUB_STEP_SUMMARY"
          fi
      - name: upload the build-only diagnostic
        if: always() && inputs.build_report_only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-ab-build-report
          path: perf-ab-build-report
          if-no-files-found: ignore
          retention-days: 30
      - name: upload the measured executables
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-ab-builds
          path: perf-ab-builds
          if-no-files-found: ignore
          retention-days: 30
      # the raw per-repetition samples (#573 B4): ci/perf_ab_dispatch.py and ci/perf_ab_ledger.py
      # re-judge them, and runs on the same CPU model can be pooled
      - name: upload the samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-ab-samples
          path: perf-ab-samples.json
          if-no-files-found: ignore
          retention-days: 30
