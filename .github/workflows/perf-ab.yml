name: perf-ab

# Small paired A/B of the allocator at this ref against a base ref (#479, #493): memory (peak
# RSS, RSS after drain), CPU (ops/s, process and worker-thread cpu seconds) and minor page
# faults on a few large-block workloads, a small-object control, a profiler-on row and the
# Larson & Krishnan server workload (`larson` rows, #506). It runs on PRs labelled `perf-ab` (against the PR base) or by
# dispatch; the table lands in the job summary and is pasted into the PR. A dispatch can set
# `head_env` to run the head arm with an allocator option changed, to attribute a cost (#506).
# Runs on a hosted runner so no developer machine is timed.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref to compare against"
        type: string
        default: origin/main
      reps:
        description: "Paired repetitions per workload"
        type: string
        default: "7"
      workloads:
        description: "Only the workloads whose name contains this text (empty = all)"
        type: string
        default: ""
      head_env:
        description: "Space-separated KEY=VALUE pairs applied to the head arm only (#506)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ab:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'perf-ab')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: paired A/B
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base }}
          REPS: ${{ inputs.reps || '7' }}
          WORKLOADS: ${{ inputs.workloads }}
          HEAD_ENV: ${{ inputs.head_env }}
        run: |
          head_env_args=()
          read -r -a pairs <<< "$HEAD_ENV"
          for pair in "${pairs[@]}"; do head_env_args+=(--head-env "$pair"); done
          python3 ci/perf_ab.py --base "$BASE_REF" --head HEAD --reps "$REPS" --workloads "$WORKLOADS" \
            "${head_env_args[@]}" --summary "$GITHUB_STEP_SUMMARY"
