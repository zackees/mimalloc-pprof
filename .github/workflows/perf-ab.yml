name: perf-ab

# Small paired A/B of the allocator at this ref against a base ref (#479, #493): memory (peak
# RSS, RSS after drain), CPU (ops/s, process and worker-thread cpu seconds) and minor page
# faults on a few large-block workloads, a small-object control, the Larson server workload (#506)
# and a profiler-on row. It runs on PRs labelled `perf-ab` (against the PR base) or by
# dispatch; the table lands in the job summary and is pasted into the PR. Runs on a hosted
# runner so no developer machine is timed. A dispatch can set allocator options on the head arm
# only (`head_env`): with base = the same commit, that attributes a cost to one option (#506).
# `head_cppdefs` does the same for compile-time defines: the head arm's library is built with
# -DMI_EXTRA_CPPDEFS=<value>, and the table's first line says so (#527). The #422 diagnostic rows
# (exact sizes, size-class edges, the sparse-large-buffers twin; names end in "(#422)") never run
# on a PR: a dispatch selects them through `workloads`, e.g. "#422" or "80 KiB|512 KiB".
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref to compare against"
        type: string
        default: origin/main
      reps:
        description: "Paired repetitions per workload"
        type: string
        default: "7"
      workloads:
        description: "Only the workloads whose name contains this text, '|' between alternatives (empty = the gating rows; the (#422) diagnostic rows run only when named)"
        type: string
        default: ""
      head_env:
        description: "KEY=VALUE pairs (space separated) set on the head arm only, e.g. MIMALLOC_ARENA_PURGE_MULT=1"
        type: string
        default: ""
      head_cppdefs:
        description: "Defines (NAME or NAME=VALUE, ';' or space separated) the head arm's library is built with, as -DMI_EXTRA_CPPDEFS, e.g. MI_ENABLE_LARGE_PAGES=0"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ab:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'perf-ab')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: paired A/B
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base }}
          REPS: ${{ inputs.reps || '7' }}
          WORKLOADS: ${{ inputs.workloads }}
          HEAD_ENV: ${{ inputs.head_env }}
          HEAD_CPPDEFS: ${{ inputs.head_cppdefs }}
        run: python3 ci/perf_ab.py --base "$BASE_REF" --head HEAD --reps "$REPS" --workloads "$WORKLOADS" --head-env "$HEAD_ENV" --head-cppdefs "$HEAD_CPPDEFS" --summary "$GITHUB_STEP_SUMMARY"
