name: python-lint

# The Python here is small but load-bearing: it is the CI gating layer. A bug in
# ci/memory_gate.py or ci/check_isa_baseline.py silently disables a gate rather than
# failing loudly, which has already happened twice (the arm64 scanner matched nothing
# and reported "clean"; the memory gate returned before printing its diagnostics).
# Neither was a C bug. Both were Python. Hence: hard failure, not advisory.

on:
  push:
    branches: [main, v4]
  pull_request:
    paths:
      - 'ci/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
      # The feature table renders from docs/allocator-features.json into the README
      # region and both SVGs. Without these three, an edit to any of them would skip
      # this job entirely and the `--check` below could not catch the drift it exists
      # to catch.
      - 'README.md'
      - 'docs/allocator-features.json'
      - '.github/assets/allocator-features-*.svg'

concurrency:
  # Pure verification: a superseded push's answer is worthless.
  group: python-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Pinned so a tool release cannot turn a green PR red (or a red one green)
      # without a commit that says so.
      - run: pip install ruff==0.12.10 pyright==1.1.411 pyyaml==6.0.2 pytest==8.3.4
      - run: ruff check ci/
      - run: ruff format --check ci/
      - run: pyright
      # The linters must not have changed behavior. These are the same checks the
      # isa-baseline job runs, minus the compile: parser fixtures for both
      # architectures, which is what caught the arm64 breakage in the first place.
      - name: Gate scripts still work
        run: |
          python3 ci/check_isa_baseline.py --selftest
          python3 ci/check_internal_state.py --selftest
          # Parses C headers and Rust source with regexes; a regex that matches nothing
          # reports "clean" exactly as loudly as one that works.
          python3 ci/check_rust_surface.py --selftest
          python3 ci/check_rust_surface.py
          # A gate script that imports cleanly but crashes on argv is still broken.
          python3 ci/memory_gate.py 2>&1 | grep -q "Exit codes"
          python3 ci/check_isa_baseline.py --help > /dev/null
          python3 ci/check_release_equivalence.py --help > /dev/null
      # The benchmark publication policy checkers gate a workflow that can push
      # to a public branch and to Pages. They were previously unreachable from
      # any workflow, so a policy regression could not fail anything.
      - name: Benchmark workflow policy checkers
        run: |
          set -euo pipefail
          python3 ci/check_benchmark_workflow.py --selftest
          python3 ci/check_benchmark_memory_workflow.py --selftest
          python3 ci/check_benchmark_latency_workflow.py --selftest
          python3 ci/check_benchmark_scaling_workflow.py --selftest
      # Issue #277 phase B2. Both Apple architectures are cross-built on Linux and the
      # x86_64 bundle runs under dockurr/macos, so a macOS runner label anywhere in
      # .github/workflows is a regression. This is the check that says so out loud --
      # see the module docstring for why it parses the YAML instead of grepping it.
      - name: No workflow may schedule onto a native macOS runner
        run: python3 ci/lint_no_macos_runners.py
      - name: Selective macOS lane helpers (#339)
        run: |
          set -euo pipefail
          python3 ci/check_macos_labels.py --selftest
          python3 ci/macos_lane_decide.py --selftest

      # The committed chart SVGs under .github/assets must still re-render
      # byte-for-byte from the committed CSV/JSON they name. `--check` re-renders and
      # compares; it never re-measures, so this needs no allocator build and no
      # benchmark machine. Without it, a renderer edit can ship an SVG whose caption
      # no longer matches the data it claims to come from -- which is exactly the kind
      # of drift the charts exist to rule out.
      - name: Committed benchmark charts still re-render from their committed data
        run: |
          set -euo pipefail
          python3 ci/bench_hole_purging.py --check
          python3 ci/bench_hole_purging.py --check --table
          python3 ci/bench_hole_purging_allocators.py --check
          python3 ci/bench_hole_purging_allocators.py --check --table

      # Same argument, different data: the README's allocator feature table and the two
      # allocator-features SVGs are rendered from docs/allocator-features.json. Editing
      # the JSON without re-rendering, or hand-editing the README region, would ship a
      # table that disagrees with its own sourced data -- which is worse than no table,
      # because the sources are the whole reason to believe it.
      - name: The feature table still re-renders from docs/allocator-features.json
        run: python3 ci/render_feature_table.py --check

      - name: Benchmark report and policy unit tests
        run: python3 -m pytest ci/tests -q
