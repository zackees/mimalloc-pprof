name: python-lint

# The Python here is small but load-bearing: it is the CI gating layer. A bug in
# ci/memory_gate.py or ci/check_isa_baseline.py silently disables a gate rather than
# failing loudly, which has already happened twice (the arm64 scanner matched nothing
# and reported "clean"; the memory gate returned before printing its diagnostics).
# Neither was a C bug. Both were Python. Hence: hard failure, not advisory.

on:
  push:
    branches: [main, v4]
  pull_request:
    # No `paths` filter (#360): every job here is a required status check on `main`, and a
    # filtered workflow never reports on a PR outside its paths, leaving that PR BLOCKED.

concurrency:
  # Pure verification: a superseded push's answer is worthless.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # zackees/ci.yml#166 (GATE-002/003): the lint job needs this one, so a PR head that never passed
  # the local gate (`ci-lint local-gate run`, which stamps a tree-bound `Local-Gate:` trailer)
  # fails here in seconds. #190/#198 (GATE-008/010): on an attested, in-policy PR head it outputs
  # skip_lint=true and the lint job is skipped (the required `lint` check then reports skipped,
  # which GitHub accepts, like the minimal lane's skipped run-linux); pushes to main never skip. The ci_lint ref is ci/local_gate.py's CI_LINT_REF
  # (ci/tests/test_local_gate.py keeps the two in step).
  ci-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trusted: ${{ steps.gate.outputs.trusted }}
      skip_lint: ${{ steps.gate.outputs.skip_lint }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Full history: GATE-008 reads the base commit's local-gate.toml and diffs the PR
          # from its merge base; GATE-003 accepts an "Update branch" merge head through its
          # attested first parent.
          fetch-depth: 0
      - name: Fetch ci_lint
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/ci-lint"
          git -C "$RUNNER_TEMP/ci-lint" fetch -q --depth=1 https://github.com/zackees/ci.yml 0d0c5545b0f574f31c70fae2f961863984a13eae
          git -C "$RUNNER_TEMP/ci-lint" checkout -q FETCH_HEAD
      - name: Local gate attestation
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH="$RUNNER_TEMP/ci-lint" python3 -m ci_lint local-gate verify --repo . --trust --github-output

  lint:
    needs: ci-mode
    if: needs.ci-mode.outputs.skip_lint != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # check_usdt_probes.py --require compiles src/static.c against <sys/sdt.h>.
      - name: Install USDT probe headers
        run: sudo apt-get install -y --no-install-recommends systemtap-sdt-dev binutils
      # GATE-001: exactly the local gate's lint lane; ci/local_gate.py lists every check
      # (ruff, pyright, the gate-script selftests, the chart/table re-renders, pytest ci/tests).
      - run: uv run --no-project --python 3.13 python ci/local_gate.py --lane lint
