on:
  workflow_dispatch:   # run the workflow manually 

concurrency:
  # Never cancel: this workflow uploads release assets to a GitHub Release, and a
  # cancelled run leaves that release half-populated. Inherited from upstream as
  # cancel-in-progress: true; flipped in #277 phase 0.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE: Release v3.4.3
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
name: Release
jobs:
  build:
    name: Bundle
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        branch: [v3.4.3]  # [dev,dev2,dev3]
        # we build on the oldest ubuntu version for better binary compatibility.
        os: [windows-latest, ubuntu-22.04, ubuntu-22.04-arm]

    steps:
      # Checkout: https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
          fetch-tags: true
          fetch-depth: 0

      # Build
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          ./bin/bundle.bat

      - name: Build (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          ./bin/bundle.sh
                
      # Create a release: https://github.com/softprops/action-gh-release (MIT license)
      - name: Release
        uses: softprops/action-gh-release@v3
        if: ${{ env.RELEASE != '' && env.RELEASE != 'no' }} 
        with:
          name: ${{ env.RELEASE }}
          draft: true
          body_path: doc/release-notes.md
          files: |
            out/bundle/*.tar.gz            
