name: rust-native

on:
  push:
    branches: [main, v4]
  pull_request:
    paths:
      - 'rust/**'
      - 'ci/check_crate_package.py'
      - '.github/workflows/rust-native.yml'

concurrency:
  # Its only publish-shaped step is `cargo publish --dry-run`, which uploads nothing.
  group: rust-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # TODO(#277 phase B, added 2026-09-02): DELETE the macos-latest row after ten pushes
    # have compared it against macos-bundles.yml's `run-macos`. Its cross-built Rust test
    # binaries cover this row's `cargo test`, with one stated exception: the 8 doctests in
    # rust/mimalloc-pprof/src/lib.rs cannot run from a `--tests` binary and are Linux-only
    # after this (#277 §4). Informational until then; do not leave it yellow forever.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
        with:
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
          build-cache-mode: full
      - name: xtask check (vendored C amalgamation must match src/include/)
        run: soldr cargo run -p xtask -- check
      - run: soldr cargo test --locked
      - name: cargo publish --dry-run (mimalloc-pprof)
        run: soldr cargo publish --dry-run -p mimalloc-pprof --locked
      - name: Verify publish archive contains feature gate and DHAT
        shell: bash
        run: python ../ci/check_crate_package.py target/package

  test-win-gnu:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          release: true
          install: mingw-w64-x86_64-gcc
      - uses: zackees/setup-soldr@v0
        with:
          # The embedded cache expects MSVC-style .pdb outputs even though this
          # target is GNU, then fails while materializing files that do not exist.
          # Keep Soldr's pinned toolchain but bypass zccache for this one job.
          cache: false
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
      - run: rustup target add x86_64-pc-windows-gnu
      - shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER = "x86_64-w64-mingw32-gcc"
          soldr --no-cache cargo test --locked --target x86_64-pc-windows-gnu

  test-no-pprof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
        with:
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
          build-cache-mode: full
      - name: Test allocator-only build (profiler compiled out)
        run: soldr cargo test -p mimalloc-pprof --no-default-features --locked
