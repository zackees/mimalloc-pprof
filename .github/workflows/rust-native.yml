name: rust-native

on:
  push:
    branches: [main, v4]
  pull_request:
    paths:
      - 'rust/**'
      - 'ci/check_crate_package.py'
      - 'ci/check_rust_surface.py'
      # The C headers ARE an input to this job: ci/check_rust_surface.py fails when a
      # header grows an export or an mi_option_t enumerator that rust/mimalloc-pprof's
      # hand-written bindings do not mirror. Without these paths a C-only PR could add
      # an API (or shift the option enum) and this job would never look.
      - 'include/**'
      # Purge regression repairs must also validate the Rust integration (#396).
      - 'test/test-purge-all.cpp'
      - '.github/workflows/rust-native.yml'

concurrency:
  # Its only publish-shaped step is `cargo publish --dry-run`, which uploads nothing.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # TODO(#277 phase D, added 2026-09-02): DELETE the windows-latest row after ten pushes
    # have compared it against `run-windows` in windows-bundles.yml, which runs the whole
    # workspace's test binaries -- cross-built on Linux for x86_64-pc-windows-msvc -- on
    # the shared Windows VM. Informational until then. A permanently-yellow job is worse
    # than an absent one. The ubuntu-latest row is NOT affected and stays a hard gate.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
        with:
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
          build-cache-mode: full
      # `xtask check`, `cargo publish --dry-run` and the package check are
      # platform-INDEPENDENT: they compare the vendored C amalgamation against src/ and
      # inspect a .crate archive. Running them on a second OS proves nothing, and #277's
      # review addendum (item 5) asked for them to be dropped from the non-Linux runners
      # rather than carried into a test bundle. `cargo test` is the only row-specific
      # step, and windows-bundles.yml's `run-windows` now runs the same tests from
      # Linux-cross-built binaries.
      - name: xtask check (vendored C amalgamation must match src/include/)
        if: runner.os != 'Windows'
        run: soldr cargo run -p xtask -- check
      # The bindings in src/sys.rs are hand written, so nothing in the Rust build notices
      # when C grows an export or shifts mi_option_t. This is what notices. Run before
      # `cargo test` so a missing binding is reported as a missing binding rather than as
      # a compile error three steps later.
      - name: Rust binding surface covers the fork's C API
        if: runner.os != 'Windows'
        shell: bash
        run: python ../ci/check_rust_surface.py
      # Lint gate (#373 phase 2, the Rust row of docs/ci-gates.md's strict-warnings table).
      # Platform-independent, so ubuntu only -- same reasoning as the steps above. Both
      # cover every workspace member (benchmark-suite, bench-harness, dashboard,
      # mimalloc-pprof, stress-harness, xtask) and every target (lib, bins, tests,
      # benches, examples). Run before `cargo test` so lint debt is reported as lint
      # debt. A lint that is genuinely wrong for a line gets a line-scoped `#[allow]`
      # with a one-line reason, never a crate- or workspace-wide one.
      - name: rustfmt + clippy components
        if: runner.os != 'Windows'
        run: rustup component add rustfmt clippy
      - name: cargo fmt --check (whole workspace)
        if: runner.os != 'Windows'
        run: soldr cargo fmt --all --check
      - name: cargo clippy -D warnings (whole workspace, all targets, all features)
        if: runner.os != 'Windows'
        run: soldr cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # #414: the crate's default feature set is EMPTY, so this workspace run exercises
      # the minimal allocator -- except that stress-harness's dev-dependency names
      # `features = ["pprof"]`, and cargo unifies features, so the pprof tests still run
      # here exactly as they always did. The explicit per-feature lanes are below.
      - run: soldr cargo test --locked
      # Every subsystem is opt-in since #414, so each one gets a lane that actually
      # compiles it in. `full` is the everything-on build (and the pre-0.12 default plus
      # DHAT and the owner gate); the individual lanes keep each feature honest on its
      # own, and `test-no-pprof` below covers the compiled-out halves.
      - name: Test the everything-on build (--features full)
        run: soldr cargo test -p mimalloc-pprof --features full --locked
      - name: Test pprof + DHAT (dhat feature opted in; dhat implies memory-events)
        run: soldr cargo test -p mimalloc-pprof --features pprof,dhat --locked
      - name: Test memory-events on its own
        run: soldr cargo test -p mimalloc-pprof --features memory-events --locked
      - name: Test diagnostics on its own
        run: soldr cargo test -p mimalloc-pprof --features diagnostics --locked
      - name: Test the owner gate on its own
        run: soldr cargo test -p mimalloc-pprof --features owner-gate --locked
      - name: cargo publish --dry-run (mimalloc-pprof)
        if: runner.os != 'Windows'
        run: soldr cargo publish --dry-run -p mimalloc-pprof --locked
      - name: Verify publish archive contains feature gate and DHAT
        if: runner.os != 'Windows'
        shell: bash
        run: python ../ci/check_crate_package.py target/package

  test-win-gnu:
    runs-on: windows-latest
    # TODO(#277 phase C, added 2026-09-02): DELETE this job after ten pushes have compared
    # it against `run-windows` in windows-bundles.yml, which runs the same Rust test
    # binaries, cross-built on Linux, on a shared Windows VM. Informational until then -- it is
    # the control arm for a deliberate CRT change (MSYS2 MINGW64 is msvcrt, soldr's
    # mingw-w64 is UCRT), so do not delete it before that comparison has actually
    # happened. A permanently-yellow job is worse than an absent one.
    continue-on-error: true
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          release: true
          install: mingw-w64-x86_64-gcc
      - uses: zackees/setup-soldr@v0
        with:
          # The embedded cache expects MSVC-style .pdb outputs even though this
          # target is GNU, then fails while materializing files that do not exist.
          # Keep Soldr's pinned toolchain but bypass zccache for this one job.
          cache: false
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
      - run: rustup target add x86_64-pc-windows-gnu
      - shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER = "x86_64-w64-mingw32-gcc"
          soldr --no-cache cargo test --locked --target x86_64-pc-windows-gnu

  test-no-pprof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
        with:
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
          build-cache-mode: full
      - name: clippy components
        run: rustup component add clippy
      # The `pprof`/`dhat` cfg-gated code paths only compile out in this job, so this is
      # the only place clippy can see the feature-off halves of mimalloc-pprof.
      - name: clippy -D warnings for each feature-off combination
        run: |
          soldr cargo clippy -p mimalloc-pprof --all-targets --no-default-features --locked -- -D warnings
          soldr cargo clippy -p mimalloc-pprof --all-targets --no-default-features --features pprof --locked -- -D warnings
          soldr cargo clippy -p mimalloc-pprof --all-targets --no-default-features --features dhat --locked -- -D warnings
          soldr cargo clippy -p mimalloc-pprof --all-targets --no-default-features --features memory-events --locked -- -D warnings
          soldr cargo clippy -p mimalloc-pprof --all-targets --no-default-features --features diagnostics --locked -- -D warnings
          soldr cargo clippy -p mimalloc-pprof --all-targets --no-default-features --features owner-gate --locked -- -D warnings
      - name: Test allocator-only build (profiler and DHAT compiled out)
        run: soldr cargo test -p mimalloc-pprof --no-default-features --locked
      # #371: the `dhat` cargo feature is independent of `pprof`; prove each compiles and
      # passes with the other one off.
      - name: Test pprof without DHAT (dhat feature off)
        run: soldr cargo test -p mimalloc-pprof --no-default-features --features pprof --locked
      - name: Test DHAT without pprof (pprof feature off)
        run: soldr cargo test -p mimalloc-pprof --no-default-features --features dhat --locked
      # #414: the remaining single-subsystem shapes, each with everything else compiled
      # out. `feature_contract` asserts both halves of every feature in each of them.
      - name: Test memory-events without pprof
        run: soldr cargo test -p mimalloc-pprof --no-default-features --features memory-events --locked
      - name: Test diagnostics without pprof
        run: soldr cargo test -p mimalloc-pprof --no-default-features --features diagnostics --locked
      - name: Test the owner gate without pprof
        run: soldr cargo test -p mimalloc-pprof --no-default-features --features owner-gate --locked
      - name: Test the everything-on build
        run: soldr cargo test -p mimalloc-pprof --no-default-features --features full --locked
