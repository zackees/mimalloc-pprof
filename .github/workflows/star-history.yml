# Refresh the committed star-history chart.
#
# GitHub restricted the stargazers endpoint to a repo's own admins and collaborators
# (changelog 2026-06-30), which is why the chart is generated here and committed as a
# static asset instead of being fetched live by a third party from the README. See
# ci/star_history.py for how the series survives the endpoint's eventual removal.
#
# GH_TOKEN prefers STAR_HISTORY_TOKEN if that secret exists, so that if the Actions
# installation token is not honored as an "admin or collaborator" for the stargazers
# list, a fine-grained PAT can be dropped into repo secrets with no workflow edit.
# The token belongs in secrets -- never in the README, whatever star-history.com's
# own workaround suggests.
name: star-history

on:
  schedule:
    - cron: "17 5 * * *" # daily, off the hour to dodge scheduler congestion
  workflow_dispatch: {} # manual trigger, used to verify token access after landing

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate chart
        env:
          GH_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python ci/star_history.py

      - name: Commit if the chart moved
        run: |
          if git diff --quiet -- .github/assets; then
            echo "No star movement; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets
          git commit -m "chore: refresh star history chart"
          git push
