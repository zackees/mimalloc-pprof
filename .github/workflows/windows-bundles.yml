name: windows-bundles

# Issue #277 phase C: build the windows-gnu (MinGW-w64) test binaries on Linux, execute
# them on ONE Windows runner.
#
# Five jobs per push go away: c-unit.yml's `ctest-win-gnu`, `ctest-debug-full-win-gnu` and
# `ctest-shared-win-gnu` (each an `msys2/setup-msys2` install of gcc+cmake+ninja on its own
# VM before it compiles anything), rust-native.yml's `test-win-gnu`, and cross.yml's
# `build-win-gnu` + `test (x86_64-pc-windows-gnu)`. They are replaced by four Linux build
# jobs, one Linux Rust build job, and one `windows-latest` job that runs everything
# serially.
#
# The Linux side needs no MSYS2 and no Windows: `soldr prepare --target
# x86_64-pc-windows-gnu` provisions mingw-w64-gcc 15.3.0, and
# cmake/toolchains/soldr-x86_64-pc-windows-gnu.cmake feeds CMake nothing but what soldr
# exported. `ci/bundle_tests.py` turns the build tree into a directory that runs with no
# CMake and no checkout (see docs/ci-gates.md, "Test bundles").
#
# THE CRT CHANGES. MSYS2's MINGW64 environment, which the three native jobs use, is
# msvcrt. soldr's mingw-w64 is UCRT (`libmsvcrt.a` is an archive of `lib64_libucrt_*.o`,
# `_mingw.h` defines `_UCRT`, and a hello-world imports `api-ms-win-crt-*` rather than
# `msvcrt.dll`). That is a deliberate coverage change and it has two consequences this
# workflow has to handle explicitly, because `MI_MINGW_UCRT64` keys on `$ENV{MSYSTEM}`
# upstream and cannot fire in a cross build:
#   * the toolchain file sets `MI_MINGW_UCRT64` ON, which turns on the `.CRT$XLB` TLS
#     callback path in src/prim/windows/prim.c, and
#   * `mimalloc-test-stress-dynamic.exe` imports `mimalloc.dll` *after* the UCRT api-sets,
#     so `bin/minject.exe` has to reorder its import table -- on the Windows runner, since
#     minject is itself a PE binary and cannot run on the Linux builder.
# `run-windows-gnu` measures the override before and after minject and asserts it after.
#
# While this is being compared against the jobs it replaces, those jobs are
# `continue-on-error: true`. They are the control arm, not decoration -- see the dated
# TODO on each.

env:
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

on:
  push:
    branches: [main, v4]
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'rust/**'
      - 'bin/**'
      - 'CMakeLists.txt'
      - 'cmake/toolchains/**'
      - 'ci/**'
      - '.github/workflows/windows-bundles.yml'

concurrency:
  group: windows-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-gnu:
    name: build-windows-gnu (${{ matrix.bundle }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exactly today's win-gnu C coverage, config for config. The flags mirror the
          # c-unit.yml job each bundle replaces; where one differs from the macOS lane it
          # is because the native job differs, not because this lane chose differently.
          - bundle: windows-gnu-x64-release
            # `ctest-win-gnu`: `cmake -B build -G Ninja -DMI_PPROF=ON`. It passes no
            # CMAKE_BUILD_TYPE and CMakeLists.txt (~137-145) defaults it from the binary
            # directory's name, which is `build` -> Release. Spelled out here.
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON
          - bundle: windows-gnu-x64-debug-full
            # `ctest-debug-full-win-gnu`: `-DMI_PPROF=ON -DMI_DEBUG_FULL=ON
            # -DCMAKE_BUILD_TYPE=Debug`. NOTE: unlike macOS's `ctest-debug-full`, this job
            # passes CMAKE_BUILD_TYPE=Debug *explicitly*, so #277's phase B correction 3
            # ("debug-full is really Release + MI_DEBUG=3") does NOT transfer to win-gnu.
            # Debug here also turns on MI_GUARDED=1 and MI_FREE_IS_CHECKED=1, and renames
            # the library to `mimalloc-debug`.
            cmake: -DCMAKE_BUILD_TYPE=Debug -DMI_PPROF=ON -DMI_DEBUG_FULL=ON
          - bundle: windows-gnu-x64-shared
            # `ctest-shared-win-gnu`.
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON -DMI_BUILD_SHARED=ON -DMI_BUILD_STATIC=OFF -DMI_BUILD_OBJECT=OFF
          - bundle: windows-gnu-x64-leak
            # The memory gate's positive control. It is a separate *build*
            # (MI_BENCH_INJECT_LEAK), not a separate run, so it cannot be an entry in
            # another bundle's manifest. A gate whose control never runs is a gate nobody
            # has seen fire (docs/ci-gates.md). New on win-gnu: no native win-gnu job runs
            # the memory gate today -- see the coverage table in docs/ci-gates.md.
            cmake: -DCMAKE_BUILD_TYPE=Release -DMI_PPROF=ON -DMI_BENCH_INJECT_LEAK=200000
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
        with:
          # zccache wraps `soldr cargo`; this job drives CMake directly, so there is
          # nothing for it to wrap. Only the toolchain provisioning is wanted here.
          cache: false
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
      - name: Cache the prepared MinGW toolchain
        uses: actions/cache@v4
        with:
          path: ~/soldr-x86_64-pc-windows-gnu.tar.zst
          key: soldr-prepare-x86_64-pc-windows-gnu-${{ hashFiles('rust/rust-toolchain.toml') }}
      - name: Prepare the soldr MinGW toolchain
        # `soldr prepare` resolves rustc from a rust-toolchain.toml at or above the working
        # directory, which is why this runs in rust/ like cross.yml does.
        working-directory: rust
        run: |
          set -euo pipefail
          archive="$HOME/soldr-x86_64-pc-windows-gnu.tar.zst"
          args=(--target x86_64-pc-windows-gnu --github-env "$GITHUB_ENV" --save "$archive")
          # --restore on a nonexistent archive is not a documented no-op, so only pass it
          # on a cache hit.
          if [ -f "$archive" ]; then
            args=(--restore "$archive" "${args[@]}")
          fi
          soldr prepare "${args[@]}"
      - name: Configure for x86_64-pc-windows-gnu
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja ${{ matrix.cmake }} \
            --toolchain cmake/toolchains/soldr-x86_64-pc-windows-gnu.cmake \
            --log-level=VERBOSE 2>&1 | tee configure.log
          # Assert on the *resolved* list, not on the option that was passed in -- the
          # MI_GUARDED lesson from docs/ci-gates.md. On this lane the find-root confinement
          # is belt-and-braces rather than load-bearing (unlike Darwin): CMake's
          # Windows-GNU CMAKE_FIND_LIBRARY_SUFFIXES are `.dll.a;.a;.lib`, so a host
          # `librt.so` is not a candidate even with the search unconfined. Verified both
          # ways locally; the assertion is what would notice if that ever changed.
          if ! grep -qE '^-- Link libraries *: *psapi;shell32;user32;advapi32;bcrypt$' configure.log; then
            echo "::error::the MinGW link resolved unexpected libraries"
            grep -E 'Link libraries' configure.log || true
            exit 1
          fi
          # The CRT decision, asserted rather than assumed: the toolchain file sets
          # MI_MINGW_UCRT64 because $ENV{MSYSTEM} cannot fire in a cross build, and a flag
          # that never reaches the compiler is this repository's most-repeated CI bug.
          if ! grep -qE '^-- Compiler defines .*MI_MINGW_UCRT64=1' configure.log; then
            echo "::error::MI_MINGW_UCRT64=1 did not reach the compiler defines"
            grep -E 'Compiler defines' configure.log || true
            exit 1
          fi
      - run: cmake --build build --parallel
      - name: Prove the output is x86-64 PE with the profiler's Windows sections
        run: |
          set -euo pipefail
          # soldr's own binutils, so this does not depend on what the runner image ships.
          objdump="$MINGW_W64_CROSS_BIN/x86_64-w64-mingw32-objdump"
          lib=$(ls build/mimalloc*.dll | grep -v 'redirect' | head -1)
          echo "## ${{ matrix.bundle }}" >> "$GITHUB_STEP_SUMMARY"
          "$objdump" -f "$lib" | tee headers.txt
          grep -q 'file format pei-x86-64' headers.txt
          # MI_MINGW_UCRT64=1 makes src/prim/windows/prim.c register process/thread
          # init through the CRT initialiser tables instead of a constructor attribute.
          # If a cross build silently dropped them, mimalloc would load on the runner and
          # never initialise -- which no test failure would obviously explain.
          obj=$(find build -name 'prim.c.obj' | head -1)
          test -n "$obj"
          "$objdump" -h "$obj" > prim-sections.txt
          for section in '.CRT$XLB' '.CRT$XLY' '.CRT$XIB'; do
            if ! grep -qF "$section" prim-sections.txt; then
              echo "::error::$section is missing from $obj"
              cat prim-sections.txt
              exit 1
            fi
          done
          # ... and the linked image must actually carry a TLS directory, which is what
          # makes the .CRT$XLB callback fire. An empty entry 9 means the section was
          # dropped at link time.
          "$objdump" -p "$lib" > private.txt
          if ! grep -qE '^Entry 9 +0*[1-9a-f][0-9a-f]* +0*[1-9a-f]' private.txt; then
            echo "::error::$lib has no Thread Storage Directory; the .CRT\$XLB callback cannot fire"
            grep -E '^Entry 9' private.txt || true
            exit 1
          fi
          # The Windows override goes through the redirection DLL, not through symbol
          # interposition; a mimalloc.dll that lost this import overrides nothing.
          grep -qi 'DLL Name: mimalloc-redirect.dll' private.txt
          {
            echo '```'
            grep -E '^Entry 9' private.txt
            echo "$lib imports:"
            grep -i 'DLL Name:' private.txt
            echo "mimalloc-test-stress-dynamic.exe imports (order matters, see minject):"
            "$objdump" -p build/mimalloc-test-stress-dynamic.exe | grep -i 'DLL Name:'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Bundle the tests
        # --dll-search-dir turns on the PE import scan. soldr's mingw-w64 links
        # mimalloc.dll against libgcc_s_seh-1.dll, which no `windows-latest` runner has,
        # and a missing DLL is a dialog-free 0xC0000135 exit rather than a test failure
        # that says what happened. Shipping it (rather than building `-static-libgcc`)
        # keeps the binary under test byte-for-byte the one an ordinary mingw link
        # produces: the DLL is a property of the *bundle*, not of the artifact.
        run: |
          set -euo pipefail
          python3 ci/bundle_tests.py build bundle \
            --objdump "$MINGW_W64_CROSS_BIN/x86_64-w64-mingw32-objdump" \
            --dll-search-dir "$MINGW_W64_CROSS_ROOT/x86_64-w64-mingw32/lib"
      - name: The manifest must carry no absolute path, and the runtime DLL must be there
        # bundle_tests.py already refuses both; these are the independent checks, because
        # the whole portability claim rests on them.
        run: |
          set -euo pipefail
          if grep -nE '"(/|[A-Za-z]:[\\/])' bundle/tests.json; then
            echo "::error::the bundle manifest contains an absolute path"
            exit 1
          fi
          python3 -c "import json; d=json.load(open('bundle/tests.json')); print(len(d['tests']), 'tests')"
          ls bundle | grep -q '^libgcc_s_seh-1\.dll$'
          ls bundle | grep -q '^mimalloc-redirect\.dll$'
      - name: Pack the bundle
        # tar, not a plain artifact upload: upload-artifact@v4 drops the executable bit.
        # (Nothing in a Windows bundle is a symlink, but keeping the two lanes identical
        # means one unpack step on the runner rather than two.)
        run: tar -C bundle -czf "${{ matrix.bundle }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.bundle }}
          path: ${{ matrix.bundle }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-rust-windows-gnu:
    name: build-rust (x86_64-pc-windows-gnu)
    # cross.yml's `build-win-gnu` runs this on `windows-latest` (it predates soldr having
    # a Linux-hosted mingw lane). Nothing about it needs Windows: soldr's mingw-w64 is a
    # Linux-hosted cross compiler and cc-rs picks it up from CC_x86_64_pc_windows_gnu.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
        with:
          # Same reason cross.yml's build-win-gnu gives: the embedded cache expects
          # MSVC-style .pdb outputs even though this target is GNU, then fails while
          # materialising files that do not exist.
          cache: false
          toolchain-file: rust/rust-toolchain.toml
          lockfile: rust/Cargo.lock
          target-dir: rust/target
      - name: Prepare blessed cross toolchain
        run: soldr prepare --target x86_64-pc-windows-gnu --github-env "$GITHUB_ENV"
      - name: Build test binaries through Soldr
        run: |
          # pipefail is NOT on by default in GitHub's `bash -e` shell, so without it this
          # pipeline reports jq's exit status and a FAILED cargo build looks green. And
          # the raw JSON is kept because piping cargo straight into jq discards every
          # `compiler-message`, which is where the error text lives.
          set -euo pipefail
          rc=0
          # Plain `cargo`, NOT `soldr cargo` -- see the long note in cross.yml's
          # build-cross: the wrapper drops mi_prof_* symbols at link time. No
          # frame-pointer flags either: the profiler does not walk frame pointers on
          # Windows (it uses RtlCaptureStackBackTrace), which is why cross.yml's
          # frame-pointer steps are gated on `apple-darwin`.
          cargo test -p mimalloc-pprof --no-run --target x86_64-pc-windows-gnu --release \
            --message-format=json > cargo.json || rc=$?
          jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' cargo.json > bins.txt
          if [ "$rc" -ne 0 ]; then
            jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' cargo.json >&2
            exit "$rc"
          fi
          test -s bins.txt
          mkdir -p dist/x86_64-pc-windows-gnu
          xargs -r -a bins.txt -I{} cp {} dist/x86_64-pc-windows-gnu/
          # `test (x86_64-pc-windows-gnu)` has `pprof: true`, so run-windows-gnu needs
          # these two specifically. Assert it here, next to the compiler output, instead
          # of letting the consumer fail without saying why.
          for required in t3_stats t12_proto; do
            if ! ls "dist/x86_64-pc-windows-gnu/$required"-* >/dev/null 2>&1; then
              echo "::error::$required was not built. Staged binaries:"
              ls -1 dist/x86_64-pc-windows-gnu || echo "  (none)"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rust-test-bins-x86_64-pc-windows-gnu
          path: rust/dist/x86_64-pc-windows-gnu
          if-no-files-found: error
          retention-days: 7

  run-windows-gnu:
    # The point of the whole workflow: one Windows VM, one queue slot, everything serial.
    needs: [build-windows-gnu, build-rust-windows-gnu]
    runs-on: windows-latest
    # Everything here is serial, so a hung test would otherwise hold the slot for the
    # workflow's whole timeout.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-windows-gnu-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: rust-test-bins-x86_64-pc-windows-gnu
          path: rust-bins
      - name: Unpack the bundles
        run: |
          set -euo pipefail
          for archive in artifacts/*/*.tar.gz; do
            name=$(basename "$archive" .tar.gz)
            mkdir -p "bundle/$name"
            tar -C "bundle/$name" -xzf "$archive"
          done
          # A cross-built binary that will not even load is the failure this whole phase
          # risks, so say what these files are before running anything.
          python3 --version
          ls -l bundle/windows-gnu-x64-release | head -40

      - name: Import order BEFORE minject (informational)
        # The open question #277 phase C exists to answer. Today's native MINGW64 lane is
        # msvcrt, where MI_MINGW_UCRT64 is off and minject never runs -- and it passes. On
        # soldr's UCRT lane mimalloc.dll is imported *after* the UCRT api-sets, which is
        # exactly the case the fix exists for. Record what that does to the override
        # before fixing it, so the next reader does not have to guess.
        continue-on-error: true
        run: |
          set -uo pipefail
          bundle=bundle/windows-gnu-x64-release
          ./bin/minject.exe --list "$bundle/mimalloc-test-stress-dynamic.exe" || true
          # 4 threads / scale 10 / 1 iteration: this is a redirection probe, not the
          # stress test (the bundle runs that in full below).
          MIMALLOC_VERBOSE=1 PATH="$PWD/$bundle:$PATH" \
            "$bundle/mimalloc-test-stress-dynamic.exe" 4 10 1 > before.txt 2>&1 || true
          if grep -q 'malloc is redirected' before.txt; then
            echo "::notice::the UCRT override took effect WITHOUT minject"
          else
            echo "::notice::the UCRT override did NOT take effect without minject (this is what minject is for)"
          fi
          head -20 before.txt

      - name: Reorder the import table with minject
        # CMakeLists.txt runs this as a POST_BUILD command when MI_MINGW_UCRT64 is on,
        # but minject is a PE binary and the bundles are built on Linux -- so the guard
        # there is `AND CMAKE_HOST_WIN32` and this step is the cross-build's other half.
        # The postfix is derived from the bundle's own library name rather than hardcoded
        # per bundle: the Debug config renames it to `mimalloc-debug.dll`, and a
        # `--postfix` that does not match the DLL injects an import of a file that is not
        # there.
        run: |
          set -euo pipefail
          for bundle in bundle/windows-gnu-x64-*; do
            exe="$bundle/mimalloc-test-stress-dynamic.exe"
            if [ ! -f "$exe" ]; then
              echo "$bundle has no test-stress-dynamic (nothing to inject)"
              continue
            fi
            dll=$(ls "$bundle"/mimalloc*.dll | grep -v 'redirect' | head -1)
            base=$(basename "$dll" .dll)
            postfix=${base#mimalloc}
            postfix=${postfix#-}
            echo "::group::minject $bundle (--postfix=$postfix, dll=$(basename "$dll"))"
            ./bin/minject.exe --verbose --postfix="$postfix" --force --inplace "$exe"
            # Recorded, not parsed: minject's listing format is not a contract, and the
            # assertion that matters is functional -- "Prove test-stress-dynamic still
            # overrides malloc" below, which reads mimalloc's own verbose output.
            ./bin/minject.exe --list "$exe"
            echo "::endgroup::"
          done

      - name: Prove test-stress-dynamic still overrides malloc
        # The test itself does not assert this -- it links mi_version() so the DLL loads
        # and then allocates through the CRT. `MIMALLOC_VERBOSE=1` makes src/init.c print
        # "malloc is redirected." when _mi_is_redirected() is true, which is the only
        # direct evidence that the redirection module patched the UCRT. Without this the
        # bundle would pass while overriding nothing.
        run: |
          set -euo pipefail
          bundle=bundle/windows-gnu-x64-release
          MIMALLOC_VERBOSE=1 PATH="$PWD/$bundle:$PATH" \
            "$bundle/mimalloc-test-stress-dynamic.exe" 4 10 1 > after.txt 2>&1
          if ! grep -q 'malloc is redirected' after.txt; then
            echo "::error::mimalloc did not redirect malloc in the UCRT bundle"
            cat after.txt
            exit 1
          fi
          grep -m1 'malloc is redirected' after.txt

      - name: ctest-win-gnu equivalent -- windows-gnu-x64-release
        run: |
          python3 ci/run_test_bundle.py bundle/windows-gnu-x64-release \
            --junit "$GITHUB_WORKSPACE/bundle-release.xml"
      - name: ctest-debug-full-win-gnu equivalent -- windows-gnu-x64-debug-full
        # Carries the six run-negative.cmake controls. Run serially after the release
        # bundle, never alongside it.
        run: |
          python3 ci/run_test_bundle.py bundle/windows-gnu-x64-debug-full \
            --junit "$GITHUB_WORKSPACE/bundle-debug-full.xml"
      - name: ctest-shared-win-gnu equivalent -- windows-gnu-x64-shared
        run: |
          python3 ci/run_test_bundle.py bundle/windows-gnu-x64-shared \
            --junit "$GITHUB_WORKSPACE/bundle-shared.xml"

      - name: Run the cross-built Rust test binaries
        # Replaces cross.yml's `test (x86_64-pc-windows-gnu)` and rust-native.yml's
        # `test-win-gnu`. Those binaries link MI_STATIC_LIB, so no DLL, no redirection
        # module and no minject are involved.
        run: |
          set -euo pipefail
          for test_binary in rust-bins/*.exe; do
            echo "::group::$(basename "$test_binary")"
            "$test_binary" --test-threads=4
            echo "::endgroup::"
          done
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install pprof
        run: |
          set -euo pipefail
          go install github.com/google/pprof@latest
          # `go env GOPATH` answers a native path (C:\Users\...); pasting it into a
          # bash command line produces mixed separators. Put its bin/ on PATH once, as a
          # POSIX path, and call `pprof` by name from here on.
          cygpath -u "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Prove pprof parses a native dump
        # cross.yml's win-gnu row has `pprof: true`; these two steps are that row's
        # dump checks, unchanged in substance.
        run: |
          set -euo pipefail
          generator=$(ls rust-bins/t3_stats-*.exe | head -1)
          MIMALLOC_PPROF_CI_DUMP="$GITHUB_WORKSPACE/heap.prof" "$generator"
          pprof -raw "$GITHUB_WORKSPACE/heap.prof" > raw.txt
          grep -Eq 'PeriodType: space|heap_v2|inuse_space' raw.txt
      - name: Prove pprof parses a proto dump
        run: |
          set -euo pipefail
          generator=$(ls rust-bins/t12_proto-*.exe | head -1)
          MIMALLOC_PROF_PROTO_PATH="$GITHUB_WORKSPACE/heap.pb" "$generator"
          pprof -raw "$GITHUB_WORKSPACE/heap.pb" > raw-pb.txt
          grep -Eq 'inuse_space|alloc_space' raw-pb.txt

      - name: Memory gate -- 8 runs from the release bundle
        # NEW coverage on win-gnu: no native MinGW job runs the memory gate today (only
        # the MSVC `memory-gate (windows-latest)` row does, against
        # ci/memory-baselines/windows-pprof1.json, which this lane must not borrow).
        run: |
          set -euo pipefail
          exe="bundle/windows-gnu-x64-release/mimalloc-test-memory-gate.exe"
          for i in 1 2 3 4 5 6 7 8; do
            MI_BENCH_JSON="result-$i.json" "$exe" > /dev/null
          done
          # A gate binary that crashed writes no JSON, the glob stays unexpanded, and
          # every downstream error would then be indistinguishable from "this lane has no
          # baseline yet" -- i.e. a green step. Count first, with a glob rather than
          # `ls | wc -l` (which fails under `pipefail` when it finds nothing).
          count=0
          for produced in result-*.json; do
            if [ -e "$produced" ]; then count=$((count + 1)); fi
          done
          if [ "$count" -ne 8 ]; then
            echo "::error::only $count of 8 memory-gate runs produced JSON"
            exit 1
          fi
          cat result-1.json
          # --arch/--compiler give this lane its own baseline file. Without them it would
          # be compared against ci/memory-baselines/windows-pprof1.json, which MSVC
          # recorded -- a cross-toolchain comparison dressed as a regression check.
          #
          # "Is this lane new?" is decided by `where`, which answers 3 for "no baseline"
          # and 2 for "cannot read this run". `check` collapses both into 2, so gating the
          # yellow bootstrap path on check's own status would report an unreadable result
          # as a bootstrap and exit green.
          rc=0
          python3 ci/memory_gate.py where --arch x64 --compiler soldr-mingw-gcc-15 result-1.json || rc=$?
          case "$rc" in
            0)
              python3 ci/memory_gate.py check --arch x64 --compiler soldr-mingw-gcc-15 result-*.json
              ;;
            3)
              echo "::warning::No committed baseline for the soldr win-gnu lane yet -- bootstrap it from this run's memory-gate artifact."
              # `check` exits 2 here by construction: the probe just proved the baseline
              # is absent, so its status carries no information -- but its report does.
              python3 ci/memory_gate.py check --arch x64 --compiler soldr-mingw-gcc-15 result-*.json || true
              ;;
            *)
              echo "::error::memory_gate could not read this run's JSON (rc=$rc)"
              exit 1
              ;;
          esac
      - name: Positive control -- the gate must catch an injected leak
        run: |
          set -euo pipefail
          exe="bundle/windows-gnu-x64-leak/mimalloc-test-memory-gate.exe"
          for i in 1 2 3 4 5 6 7 8; do
            MI_BENCH_JSON="leak-$i.json" "$exe" > /dev/null || true
          done
          # The leak build is *expected* to exit non-zero (hence `|| true` above), which
          # makes the file count the only evidence that it ran at all.
          count=0
          for produced in leak-*.json; do
            if [ -e "$produced" ]; then count=$((count + 1)); fi
          done
          if [ "$count" -ne 8 ]; then
            echo "::error::only $count of 8 leak-control runs produced JSON"
            exit 1
          fi
          # `control` requires `check` to FAIL. A missing baseline is not a failure, it is
          # a bootstrap, so before this lane's baseline is committed the control would go
          # red for the wrong reason.
          rc=0
          python3 ci/memory_gate.py where --arch x64 --compiler soldr-mingw-gcc-15 leak-1.json || rc=$?
          case "$rc" in
            0)
              python3 ci/memory_gate.py control --arch x64 --compiler soldr-mingw-gcc-15 leak-*.json
              ;;
            3)
              echo "::warning::the soldr win-gnu lane has no committed baseline yet, so its positive control cannot run. Commit the baseline, then this becomes a hard gate."
              ;;
            *)
              echo "::error::memory_gate could not read the leak control's JSON (rc=$rc)"
              exit 1
              ;;
          esac
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: memory-gate-windows-gnu-x64-soldr
          # The leak runs too: they are what a reader needs to see why the control did or
          # did not fire, and the gate runs are what the baseline is bootstrapped from.
          path: |
            result-*.json
            leak-*.json
          if-no-files-found: error

      - uses: msys2/setup-msys2@v2
        if: ${{ !cancelled() }}
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Native compile-compat check and native ctest enumeration (MSYS2 MinGW64)
        # The bundles are built by soldr's UCRT mingw-w64 on Linux. This is the only thing
        # on this runner that still uses MSYS2's *msvcrt* MINGW64 gcc, and it catches
        # compile-only breakage that a cross build would not. It builds the Release tree
        # (no tests -- the bundles do that) and only *configures* the other two, because
        # `--show-only` needs a configured tree, not a built one.
        #
        # Each configure must stay in step with the c-unit.yml job it mirrors, or the
        # coverage comparison below silently stops describing the job being replaced.
        if: ${{ !cancelled() }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          gcc --version | head -1
          # `ctest-win-gnu`
          cmake -B native-release -G Ninja -DMI_PPROF=ON
          cmake --build native-release
          # `ctest-debug-full-win-gnu` (CMAKE_BUILD_TYPE=Debug is explicit there)
          cmake -B native-debug-full -G Ninja -DMI_PPROF=ON -DMI_DEBUG_FULL=ON -DCMAKE_BUILD_TYPE=Debug
          # `ctest-shared-win-gnu`
          cmake -B native-shared -G Ninja -DMI_PPROF=ON -DMI_BUILD_SHARED=ON -DMI_BUILD_STATIC=OFF -DMI_BUILD_OBJECT=OFF
          ctest --test-dir native-release --show-only=json-v1 > native-release.json
          ctest --test-dir native-debug-full --show-only=json-v1 > native-debug-full.json
          ctest --test-dir native-shared --show-only=json-v1 > native-shared.json
      - name: Coverage -- the bundles must run every test the native runner would
        if: ${{ !cancelled() }}
        run: |
          python3 ci/bundle_coverage.py \
            --compare "ctest-win-gnu" native-release.json bundle/windows-gnu-x64-release/tests.json \
            --compare "ctest-debug-full-win-gnu" native-debug-full.json bundle/windows-gnu-x64-debug-full/tests.json \
            --compare "ctest-shared-win-gnu" native-shared.json bundle/windows-gnu-x64-shared/tests.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-gnu-bundle-results
          path: |
            bundle-release.xml
            bundle-debug-full.xml
            bundle-shared.xml
            native-release.json
            native-debug-full.json
            native-shared.json
            before.txt
            after.txt
          if-no-files-found: warn
          retention-days: 7
