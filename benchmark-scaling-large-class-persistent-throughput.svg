<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img">
<title>Long-lived threads (96-512 KiB): aggregate throughput (operations/second), median of n=40</title>
<desc>One panel with one median line per allocator, all on a shared zero-based axis from 0 to 1e+07 with tick step 2e+06, shared across both workloads of the family. Each line is the median of 40 paired repetitions; the spread is in latest.json and the dashboard table.</desc>
