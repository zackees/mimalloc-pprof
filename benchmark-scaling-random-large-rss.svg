<text x="118.0" y="70.0" fill="#7d8da5" font-size="14" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-weight="normal" text-anchor="start">peak RSS (bytes; lower is better); median of n=40</text>
