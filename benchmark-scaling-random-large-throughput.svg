<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img">
<title>Uniform random requested sizes (64 KiB-4 MiB): aggregate throughput (operations/second), median of n=40</title>
<desc>One panel with one median line per allocator, all on a shared zero-based axis from 0 to 2.5e+06 with tick step 500000, shared across both workloads of the family. Each line is the median of 40 paired repetitions; the spread is in latest.json and the dashboard table.</desc>
