<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" width="1120" height="780" role="img">
<title>RSS after the work stops: short-lived threads, 96-512 KiB, 8 workers; every thread joined at 0 s, then idle; RSS in MiB, median of n=40</title>
<desc>Resident memory of each allocator's process at fixed times after its worker threads were joined, one median line per allocator on a shared zero-based axis from 0 to 250 MiB, and a table of when each one's memory settled. A dashed live data (theoretical minimum) line is the least RSS any allocator could return to: nothing is live after the drain, so it is the process's own RSS before any worker started.</desc>
