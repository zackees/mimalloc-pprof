# ci-attestations (zackees/ci.yml#198, GATE-010).
#
# Each gate is one thing CI would otherwise verify remotely, named <ecosystem>/<platform>/<check>.
# `lane` is the local-gate.toml lane whose pass proves it: `ci-lint local-gate run` writes one
# compact-JSON `Ci-Attestation:` trailer per gate of each passed lane into the commit message.
# `jobs` maps each remote job to the gates it runs. On a PR, python-lint.yml's ci-mode job skips
# a job only when every one of its gates is attested and stamp-valid AND the head passes
# [gate.trust]. This file is read from the PR's base and is itself a trust surface. Pushes to main
# always run every job; a release always ignores attestations.
version: 1
gates:
  python/all/lint: {lane: lint}   # ruff, pyright, every ci/ gate-script selftest, pytest ci/tests
jobs:
  python-lint.yml:lint: [python/all/lint]
