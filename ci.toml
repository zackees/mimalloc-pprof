# ci.toml -- zackees/mimalloc-pprof's CI contract. Bounds what the workflows may do; nothing here
# generates YAML. schema 3.
#
# Scope note: this document declares the CACHE policy only. It is deliberately conservative --
# every family's `max x cardinality` is at or above the family's measured live footprint, because
# `ci-lint cache janitor` LRU-evicts down to exactly that product. Over-stating costs headroom;
# under-stating truncates live caches. See docs/ci-toml.md.
schema  = 3
profile = "cpp-rust-library"
linter  = "zackees/ci.yml@92106df315bd28de24ef1808c893c91a5859122d"

# ── Platforms ────────────────────────────────────────────────────────────────
# Seven build/run targets, read from .github/workflows/cross.yml's build and test matrices plus
# macos-bundles.yml's cross-build matrix. `aarch64-pc-windows-msvc` is deliberately absent: cross.yml
# builds it but has no runner for it (build-only), so it declares no platform here.
[platforms]
linux-x64   = { target = "x86_64-unknown-linux-gnu",  runs-on = "ubuntu-24.04",     group = "linux" }
linux-arm64 = { target = "aarch64-unknown-linux-gnu", runs-on = "ubuntu-24.04-arm", group = "linux" }
linux-musl  = { target = "x86_64-unknown-linux-musl",  runs-on = "ubuntu-24.04",     group = "linux" }
win-msvc    = { target = "x86_64-pc-windows-msvc",    runs-on = "windows-2025",     group = "windows" }
win-gnu     = { target = "x86_64-pc-windows-gnu",     runs-on = "windows-2025",     group = "windows" }
macos-x64   = { target = "x86_64-apple-darwin",       runs-on = "macos-15-intel",   group = "macos" }
macos-arm64 = { target = "aarch64-apple-darwin",      runs-on = "macos-15",         group = "macos" }

# ── Suites ───────────────────────────────────────────────────────────────────
[suites]
lint     = { run = "ci/local_gate.py lint", required = true }
c-unit   = { run = "ctest", required = true }
rust     = { run = "soldr cargo test -p mimalloc-pprof", required = true }
bench    = { run = "ci/build_benchmark_allocators.py", kind = "bench", gating = false }

# ── Flows ────────────────────────────────────────────────────────────────────
[flow.pr]
platforms = ["linux-x64"]
suites    = ["lint", "c-unit"]
budget    = { critical-path = "12m" }

[flow.main]
extends   = "pr"
platforms = ["linux-x64", "linux-arm64", "win-msvc"]
suites    = ["lint", "c-unit", "rust"]
cache     = "write"
# `pre-prune = true` is deliberately ABSENT from this, the repository's ONLY cache writer
# (zackees/ci.yml#352, rule CACHE-034). It was declared but never honoured: no workflow or ci/
# script here runs `ci-lint cache preprune` (`grep -rn preprune .github/ ci/` finds nothing), yet
# CACHE-004's arithmetic waives the lockfile-change-peak term purely on the declaration, so the
# modelled footprint was understated by that peak for free. Dropped rather than wired, per
# zackees/ci.yml#354 (checklist item: zackees/ci.yml#360) -- because this is the only writer
# flow, removing it brings the full lockfile-change peak back into CACHE-004's model. Restoring
# `pre-prune = true` requires a real `ci-lint cache preprune` step ordered ahead of the cache
# saves in the same run, on a job holding `actions: write`.

[flow.full]
extends = "main"
platforms = "all"
suites    = "all"

[tags]
ci-full = { add = { platforms = "all", suites = "all" } }
release = { flow = "full", publish = "none" }

# ── Caches ───────────────────────────────────────────────────────────────────
# Measured 2026-10-05 on main: 85 entries, 8061 MB = 79% of GitHub's 10 GiB cap. This document
# bounds the DECLARABLE families at ~5.0 GiB steady, leaving headroom for the lockfile generations
# a toolchain bump produces before the janitor reclaims them.
#
# The live repository holds ~3.3 GiB more that NO `via` value can classify -- see the PR body.
[cache]
budget   = "9.5GB"
write-on = ["main"]
never    = ["linked-tests", "nextest-archives", "wheels", "incremental", "target-dir", "perf-results", "bench-artifacts"]
retired  = []
pr       = { mode = "none", families = [], max-per-pr = "0MB", budget = "0MB", trim = "on-close" }

# Each family's `max x cardinality(per)` is >= its measured live footprint, so the janitor's LRU
# trim is a no-op on today's caches. `per = "os"` is the honest cardinality axis for every family
# below: all of them key on the runner OS, and none of them key on the target triple.
#
# NOTE: `shapes` (zackees/ci.yml#334) is deliberately NOT used. `family_footprint` in
# ci_lint.rules.cache_static honours it, but `ci_lint.cache.ops._lru_evictions` -- the code the
# janitor actually runs -- still computes `max x cardinality(per)` and ignores it. Declaring shapes
# here would make CACHE-004's arithmetic look right while the janitor evicted down to a smaller
# number. Revisit once ops.py routes through family_footprint.
[cache.family]
# solo-toolchain-v3-*: 9 live entries, 2472 MB (5 x 332 MB linux + 169 MB rustc1.99.0 + 3 x 325 MB
# windows). per="platform" (7) at 400 MB = 2800 MB >= 2472 MB. evict = "lru" (CACHE-029: 400 MB >=
# the 256 MB floor) and genuinely needed: the key embeds a soldr version, so every setup-soldr bump
# appends an entry nothing retires.
solo-toolchain = { via = "setup-soldr:solo-toolchain", max = "400MB", lockfile = true, per = "platform", evict = "lru" }
# cook-base-v2-*: 10 live entries, 1580 MB (6 linux, 4 windows; the two 519-522 MB windows entries
# dominate). per="os" (3) at 600 MB = 1800 MB >= 1580 MB.
cook          = { via = "setup-soldr:cook",            max = "600MB", lockfile = true, per = "platform", evict = "lru" }
# setup-soldr-buildcache-v2-*: 14 live entries, 204 MB. per="os" at 100 MB = 300 MB >= 204 MB.
compile       = { via = "setup-soldr:build-cache",     max = "100MB", lockfile = true, per = "platform", evict = "lru" }
# setup-soldr-cargoregistry-v1-*: 15 live entries, 60 MB.
registry      = { via = "setup-soldr:cargo-registry",  max = "30MB",  lockfile = true, per = "platform" }
# soldr-mini-v2-*: 8 live entries, 80 MB.
soldr-mini    = { via = "setup-soldr:soldr-mini",      max = "40MB",  per = "platform" }
# cook-delta-v2-*: 3 live entries, 6 MB. Still being written at setup-soldr 0.9.27, so declared as a
# family rather than retired -- listing it under [cache].retired would fire CACHE-009 against three
# live entries.
cook-delta    = { via = "setup-soldr:cook-delta",      max = "10MB",  per = "os" }

# CACHE-024 / CACHE-030: nearest-ancestor promotion is DECLARED ONLY. setup-soldr#566 is unreleased,
# so nothing implements it today. `off` is the honest mode.
[cache.promote]
mode          = "off"
max-age-hours = 168

# ── Local ────────────────────────────────────────────────────────────────────
# bosn.toml already drives the local loop. No [local.gate] table here on purpose: this repository
# already ships local-gate.toml, and adding a ci.toml makes `ci-lint local-gate` read its gate
# config from ci.toml -- so an incomplete [local.gate] would be worse than none. The existing
# local-gate.toml stays the single source of truth.
[local]
runner = "bosn-act"
lanes  = ["lint"]
cache  = "machine"

# ── Allowlists ───────────────────────────────────────────────────────────────
[allow]
workflows         = { "cross.yml" = ["pull_request", "push:main", "workflow_dispatch"], "python-lint.yml" = ["pull_request", "push:main"], "c-unit.yml" = ["pull_request", "push:main"], "rust-native.yml" = ["push:main", "workflow_dispatch"], "macos-bundles.yml" = ["push:main", "workflow_dispatch"], "windows-bundles.yml" = ["push:main", "workflow_dispatch"] }
actions           = ["actions/checkout", "actions/upload-artifact", "actions/download-artifact", "actions/cache", "zackees/setup-soldr"]
# This repository calls zackees/setup-soldr directly from ~15 workflows and has no composite-action
# wrapper, so `only-in` names the one directory the policy permits. It matches nothing today: no
# call site is inside it, which is the honest current state -- narrowing it to a single wrapper
# would require creating one first (a follow-up, not this PR).
setup-soldr       = { only-in = ".github/actions/soldr", require = { save-cache = "plan" } }
tools             = ["soldr", "cmake", "ctest", "python3", "git"]
secrets           = []
# The C library's OS branches live under src/prim/; prim.c is the one file allowed to select on the
# host OS at build time.
platform-selector = "src/prim/prim.c"
platform-code     = ["src/prim/osx/**", "src/prim/unix/**", "src/prim/windows/**", "src/prim/wasi/**", "src/prim/emscripten/**"]
permissions       = {}

[publish]