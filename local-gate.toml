# mimalloc-pprof's local gate (zackees/ci.yml#166 GATE-001..004, #190 GATE-008, #198 GATE-010).
#
# Before every push, from a clean, committed tree:
#
#   uvx --from git+https://github.com/zackees/ci.yml@0d0c5545b0f574f31c70fae2f961863984a13eae ci-lint local-gate run
#
# runs `run` below and, on success, stamps HEAD with a tree-bound `Local-Gate:` trailer plus one
# `Ci-Attestation:` trailer per gate in ci-attestations.yml. python-lint.yml's `ci-mode` job
# (`verify`) fails a PR whose head lacks it, and python-lint.yml's `lint` job needs `ci-mode`.
# Install the matching pre-push hook once per clone with `... ci-lint local-gate install-hook`.
# On a host whose default include path lacks <sys/sdt.h>, set CPATH (see ci/local_gate.py).
[gate]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py"]
# The remote lint job runs `ci/local_gate.py --lane lint` and nothing else.
mirrors = ["python-lint.yml:lint"]
setup-steps = ["Install USDT probe headers"]
verify = "python-lint.yml:ci-mode"
mode = "enforce"

# GATE-007: the gate is one lane today -- the python-lint job reads ci/, the C sources it compiles
# (USDT, unused-function), workflows, docs and assets, so no input exclusion is safe.
[gate.lanes.lint]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py", "--lane", "lint"]
tools = ["uv"]
env = ["CPATH"]

# GATE-008 (zackees/ci.yml#190): an attested PR head skips the remote lint job -- it would rerun
# exactly what the gate just ran. python-lint.yml's ci-mode job decides with
# `ci-lint local-gate verify --trust`, from THIS file as committed on the PR's base. It fails
# closed: a fork or non-writer author, a `ci-full` label, a head not attested for its exact tree,
# a change to this file, ci/local_gate.py, ci-attestations.yml, python-lint.yml or the surfaces
# below, or the audit sample all run the job as before. Pushes to main always run it.
[gate.trust]
mode = "enforce"
skip = ["python-lint.yml:lint"]
surfaces = ["pyproject.toml"]
