[package]
name = "bench-harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Trustworthy Rust benchmark harness for allocator throughput/latency measurement — Phase 0 of #170"

[lib]
name = "bench_harness"
path = "src/lib.rs"

[dependencies]
stress-harness = { path = "../stress-harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mimalloc-pprof = { path = "../mimalloc-pprof" }
