[package]
name = "benchmark-suite"
version = "0.1.0"
edition = "2021"
publish = false
description = "Four-allocator native benchmark producer for mimalloc-pprof"
build = "build.rs"

[lib]
name = "benchmark_suite"
path = "src/lib.rs"

[[bin]]
name = "benchmark-child"
path = "src/bin/benchmark-child.rs"

[[bin]]
name = "benchmark-run"
path = "src/bin/benchmark-run.rs"

[[bin]]
name = "benchmark-validate"
path = "src/bin/benchmark-validate.rs"

[[bin]]
name = "benchmark-memory-run"
path = "src/bin/benchmark-memory-run.rs"

[[bin]]
name = "benchmark-memory-validate"
path = "src/bin/benchmark-memory-validate.rs"

[[bin]]
name = "benchmark-latency-run"
path = "src/bin/benchmark-latency-run.rs"

[[bin]]
name = "benchmark-latency-validate"
path = "src/bin/benchmark-latency-validate.rs"

[[bin]]
name = "benchmark-scaling-run"
path = "src/bin/benchmark-scaling-run.rs"

[[bin]]
name = "benchmark-scaling-validate"
path = "src/bin/benchmark-scaling-validate.rs"

[[test]]
name = "timed_allocation_audit"
path = "tests/timed_allocation_audit.rs"
# Custom `fn main` (no libtest harness): libtest runs `#[test]` fns
# concurrently on their own OS threads by default, and it initializes
# per-thread output capture on each test's thread the moment that thread
# starts -- an allocation with no ordering relative to this file's
# `MEASURED` gate. That stray allocation from the *sibling* test's thread
# landed inside this test's measured interval and was misattributed to
# the code under audit. See #236 / #206.
harness = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[build-dependencies]
