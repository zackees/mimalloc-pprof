[package]
name = "mimalloc-pprof"
version = "0.11.1"
edition = "2021"
license = "MIT"
description = "mimalloc global allocator with pprof-compatible sampled heap profiling"
repository = "https://github.com/zackees/mimalloc-pprof"
homepage = "https://github.com/zackees/mimalloc-pprof"
documentation = "https://docs.rs/mimalloc-pprof"
readme = "README.md"
keywords = ["mimalloc", "allocator", "pprof", "profiling", "heap"]
categories = ["memory-management", "development-tools::profiling"]
links = "mimalloc"
build = "build.rs"

[dependencies]

[features]
# Sampled pprof profiling is enabled by default. The exact DHAT observer is NOT: it is
# opt-in (owner decision 2026-09-18) via `features = ["dhat"]`. Consumers that only need
# the allocator can compile the profiler out too with `default-features = false`.
default = ["pprof"]
pprof = []
# Build the exact DHAT v2 observer (C `MI_DHAT=1`, issue #371). Opt-in, off by default:
# without it the observer's per-allocation hook sites are compiled out of the C allocator
# and `dhat::start()` returns `false`. Clients that want DHAT enable it explicitly.
dhat = []
# Build the allocator with the per-thread owner gate (C `MI_OWNER_GATE=1`, issue #366):
# every allocator call takes a gate so `purge_all` can sweep EVERY thread's heap, not only
# parked ones. Costs a few percent on the malloc/free fast path; off by default.
owner-gate = []

[[test]]
name = "t1_smoke"
required-features = ["pprof"]
[[test]]
name = "t2_format"
required-features = ["pprof"]
[[test]]
name = "t3_stats"
required-features = ["pprof"]
[[test]]
name = "t4_accum"
required-features = ["pprof"]
[[test]]
name = "t5_stacks"
required-features = ["pprof"]
[[test]]
name = "t6_concurrency"
required-features = ["pprof"]
[[test]]
name = "t8_query"
required-features = ["pprof"]
[[test]]
name = "t9_stats"
required-features = ["pprof"]
[[test]]
name = "t10_snapshot_concurrency"
required-features = ["pprof"]
[[test]]
name = "t11_enable"
required-features = ["pprof"]
[[test]]
name = "t12_proto"
required-features = ["pprof"]
[[test]]
name = "t14_modules"
required-features = ["pprof"]
[[test]]
name = "t15_heap_stats"
required-features = ["pprof"]
[[test]]
name = "t17_realloc_profiling"
required-features = ["pprof"]

[[test]]
name = "t18_heap_snapshot"
[[test]]
name = "feature_contract"
[[test]]
name = "t24_purge_all"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
regex = "1"
