[package]
name = "mimalloc-pprof"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "mimalloc global allocator with pprof-compatible sampled heap profiling"
repository = "https://github.com/zackees/mimalloc-pprof"
homepage = "https://github.com/zackees/mimalloc-pprof"
documentation = "https://docs.rs/mimalloc-pprof"
readme = "README.md"
keywords = ["mimalloc", "allocator", "pprof", "profiling", "heap"]
categories = ["memory-management", "development-tools::profiling"]
links = "mimalloc"
build = "build.rs"

[dependencies]

[features]
# #414 (owner decision 2026-09-19): EVERY observability subsystem is opt-in. The default
# build is a plain fast allocator -- no profiler, no accounting hooks, no diagnostics, no
# DHAT, no owner gate -- and the `mi_malloc`/`mi_free` fast path is byte-identical to
# upstream mimalloc. The full Rust API is still present and still compiles in every
# configuration; a subsystem that is compiled out simply reports itself off (`start()`
# returns `false`, a dump returns `None`).
#
# Cargo features are additive and unified across the graph: if ANY crate in your build
# enables one of these, the C library is built with it. `cargo tree -e features` shows who.
default = []
# Sampled pprof profiling (C `MI_PPROF=1`). Measured cost when compiled in but stopped:
# +3.4 instructions per malloc/free pair (+10% cycles) and 28.9 KB + 16 B per page.
pprof = []
# Allocation-change accounting and callbacks (C `MI_MEMEVT=1`, issue #20). Measured cost
# when compiled in but disabled: +9 to +13 instructions per malloc/free pair (18-26%).
# #415 tracks making that free again, which would let this default back on.
memory-events = []
# Heap snapshot (#338) and live-heap JSON dump (#269) (C `MI_DIAGNOSTICS=1`). Costs
# nothing per allocation; 25.7 KB of code. `heap_snapshot_to_file` / `heap_dump_json`
# fail (`Err` / `None`) without it. `Opt::SNAPSHOT_ON_EXIT` exists either way.
diagnostics = []
# Build the exact DHAT v2 observer (C `MI_DHAT=1`, issue #371). Opt-in, off by default:
# without it the observer's per-allocation hook sites are compiled out of the C allocator
# and `dhat::start()` returns `false`. Clients that want DHAT enable it explicitly.
# Implies `memory-events`: DHAT dispatches from the memory-events slow paths, so its hook
# sites are what carries DHAT's events (see src/memory-events.c).
dhat = ["memory-events"]
# Build the allocator with the per-thread owner gate (C `MI_OWNER_GATE=1`, issue #366):
# every allocator call takes a gate so `purge_all` can sweep EVERY thread's heap, not only
# parked ones. Measured at +95 instructions per malloc/free pair (+206% cycles) in a tight
# alloc/free loop; off by default.
owner-gate = []
# Everything. This is what `0.11.x` shipped plus DHAT and the owner gate -- use it to
# restore the pre-0.12 default (`features = ["full"]`) or just `["pprof"]` for that half.
full = ["pprof", "memory-events", "diagnostics", "dhat", "owner-gate"]

[[test]]
name = "t1_smoke"
required-features = ["pprof"]
[[test]]
name = "t2_format"
required-features = ["pprof"]
[[test]]
name = "t3_stats"
required-features = ["pprof"]
[[test]]
name = "t4_accum"
required-features = ["pprof"]
[[test]]
name = "t5_stacks"
required-features = ["pprof"]
[[test]]
name = "t6_concurrency"
required-features = ["pprof"]
[[test]]
name = "t8_query"
required-features = ["pprof"]
[[test]]
name = "t9_stats"
required-features = ["pprof"]
[[test]]
name = "t10_snapshot_concurrency"
required-features = ["pprof"]
[[test]]
name = "t11_enable"
required-features = ["pprof"]
[[test]]
name = "t12_proto"
required-features = ["pprof"]
[[test]]
name = "t14_modules"
required-features = ["pprof"]
[[test]]
name = "t15_heap_stats"
required-features = ["pprof"]
[[test]]
name = "t17_realloc_profiling"
required-features = ["pprof"]

[[test]]
name = "t18_heap_snapshot"
required-features = ["diagnostics"]
[[test]]
name = "t20_memory_events"
required-features = ["memory-events"]
[[test]]
name = "t21_visit_live"
required-features = ["memory-events"]
# No `required-features`: these run in every configuration and assert what each one does.
[[test]]
name = "feature_contract"
[[test]]
name = "t24_purge_all"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
regex = "1"
